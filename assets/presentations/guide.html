                const mx = srcs[i].x + a * ux;
                const my = srcs[i].y + a * uy;
                const strength = Math.min(1, (ri.alpha + rj.alpha) * 2.1);
                for (const sign of [-1, 1]) {
                  const ix = mx + sign * h * (-uy);
                  const iy = my + sign * h * ux;
                  if (ix < fx + 10 || ix > fx + fw - 10 || iy < fy + 10 || iy > fy + fh - 10) continue;
                  // Draw glowing constructive resonance node
                  ambCtx.fillStyle = `rgba(196, 134, 28, ${(strength * 0.82).toFixed(3)})`;
                  ambCtx.beginPath();
                  ambCtx.arc(ix, iy, (2.2 + strength * 1.6) * s, 0, Math.PI * 2);
                  ambCtx.fill();
                  ambCtx.strokeStyle = `rgba(37, 133, 90, ${(strength * 0.45).toFixed(3)})`;
                  ambCtx.lineWidth = Math.max(0.85, 0.9 * s);
                  ambCtx.beginPath();
                  ambCtx.arc(ix, iy, (5.5 + strength * 3.5) * s, 0, Math.PI * 2);
                  ambCtx.stroke();
                  if (strength > bestStrength && iy > fy + fh * 0.18 && iy < fy + fh * 0.78) {
                    const clearOfCenters = srcs.every((sc) => Math.hypot(ix - sc.x, iy - sc.y) > 54 * s);
                    if (clearOfCenters) {
                      bestStrength = strength;
                      bestNode = { x: ix, y: iy };
                    }
                  }
                }
              }
            }
          }
        }

        // Subtle Resonance callout on the strongest active constructive crossing
        if (bestNode && bestStrength > 0.25) {
          ambCtx.fillStyle = 'rgba(154, 100, 14, 0.88)';
          ambCtx.font = `600 ${(9.5 * s).toFixed(1)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
          ambCtx.textAlign = 'left';
          ambCtx.textBaseline = 'middle';
          ambCtx.fillText(
            state.lang === 'zh' ? '共振强化' : 'RESONANCE',
            bestNode.x + 11 * s,
            bestNode.y - 8 * s,
          );
        }

        // 4. Crisp Living Center Markers (draggable loci)
        srcs.forEach((src, idx) => {
          const hot = state.priorHoverIdx === idx || state.priorDragIdx === idx;
          ambCtx.strokeStyle = hot ? 'rgba(184, 122, 30, 0.75)' : 'rgba(37, 133, 90, 0.42)';
          ambCtx.lineWidth = (hot ? 1.8 : 1.1) * s;
          ambCtx.beginPath();
          ambCtx.arc(src.x, src.y, (hot ? 13 : 9.5) * s, 0, Math.PI * 2);
          ambCtx.stroke();

          ambCtx.fillStyle = hot ? '#b87a1e' : '#25855a';
          ambCtx.beginPath();
          ambCtx.arc(src.x, src.y, 4.2 * s, 0, Math.PI * 2);
          ambCtx.fill();

          ambCtx.fillStyle = 'rgba(21, 20, 18, 0.74)';
          ambCtx.font = `600 ${(9.5 * s).toFixed(1)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
          ambCtx.textAlign = 'center';
          ambCtx.textBaseline = 'bottom';
          ambCtx.fillText(
            state.lang === 'zh' ? `中心 ${idx + 1}` : `CENTER ${idx + 1}`,
            src.x,
            src.y - 13 * s,
          );
        });
        ambCtx.restore();
      }

      // Slide 21: Interactive Orbital Constellation behind Closing Portal
      if (sl.id === 'enter') {
        const s = remScale();
        const cx = ambW * 0.5;
        const cy = ambH * 0.48;
        const R = Math.min(ambW, ambH) * 0.43;
        ambCtx.save();
        ambCtx.strokeStyle = 'rgba(244, 240, 232, 0.05)';
        ambCtx.lineWidth = 1;
        [0.42, 0.70, 1.0].forEach((k) => {
          ambCtx.beginPath();
          ambCtx.arc(cx, cy, R * k, 0, Math.PI * 2);
          ambCtx.stroke();
        });
        const count = BOOK_DATA.partCount || 14;
        const ptr = state.enterPointer;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + state.time * 0.045;
          const x = cx + Math.cos(ang) * R;
          const y = cy + Math.sin(ang) * R * 0.62;
          ambCtx.fillStyle = 'rgba(52, 184, 124, 0.42)';
          ambCtx.beginPath();
          ambCtx.arc(x, y, 2.4 * s, 0, Math.PI * 2);
          ambCtx.fill();
          if (ptr.inside) {
            const d = Math.hypot(ptr.x - x, ptr.y - y);
            if (d < 220 * s) {
              ambCtx.strokeStyle = `rgba(52, 184, 124, ${((1 - d / (220 * s)) * 0.25).toFixed(3)})`;
              ambCtx.beginPath();
              ambCtx.moveTo(x, y);
              ambCtx.lineTo(ptr.x, ptr.y);
              ambCtx.stroke();
            }
          }
        }
        ambCtx.restore();
      }
    }

    // Slide 3: Interactive Braided Möbius Coin & Severance Simulator
    function setCoinMode(mode, userTriggered = false) {
      state.coinMode = mode;
      if (userTriggered) state.coinPinned = true;
      dom.slideMount.querySelectorAll('[data-coin-mode]').forEach((b) => {
        b.classList.toggle('active', b.dataset.coinMode === mode);
      });
      dom.slideMount.querySelectorAll('[data-coin-toggle]').forEach((card) => {
        const isAct = card.dataset.coinToggle === mode;
        card.classList.toggle('active', isAct);
        const cue = card.querySelector('.severance-cue');
        if (cue) cue.textContent = isAct ? UI[state.lang].coinActiveState : UI[state.lang].coinTapInspect;
      });
      const leftPole = document.getElementById('coin-pole-left');
      const rightPole = document.getElementById('coin-pole-right');
      if (leftPole) leftPole.classList.toggle('dimmed', mode === 'severA');
      if (rightPole) rightPole.classList.toggle('dimmed', mode === 'severB');
    }

    function drawGear(ctx, gx, gy, r, teeth, rot, color) {
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(rot);
      ctx.strokeStyle = color;
      ctx.beginPath();
      const step = (Math.PI * 2) / teeth;
      for (let i = 0; i < teeth; i++) {
        const a0 = i * step;
        const a1 = a0 + step * 0.28;
        const a2 = a0 + step * 0.52;
        const a3 = a0 + step * 0.78;
        const rIn = r * 0.84;
        const rOut = r * 1.06;
        if (i === 0) ctx.moveTo(Math.cos(a0) * rIn, Math.sin(a0) * rIn);
        else ctx.lineTo(Math.cos(a0) * rIn, Math.sin(a0) * rIn);
        ctx.lineTo(Math.cos(a1) * rOut, Math.sin(a1) * rOut);
        ctx.lineTo(Math.cos(a2) * rOut, Math.sin(a2) * rOut);
        ctx.lineTo(Math.cos(a3) * rIn, Math.sin(a3) * rIn);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.34, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawCoinCanvas(dt) {
      const c = document.getElementById('coin-canvas');
      if (!c) return;
      const rect = c.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const t = state.time;
      const s = remScale();
      const targetA = state.coinMode === 'severA' ? 1 : 0;
      const targetB = state.coinMode === 'severB' ? 1 : 0;
      state.coinSeverA += (targetA - state.coinSeverA) * Math.min(1, dt * 6);
      state.coinSeverB += (targetB - state.coinSeverB) * Math.min(1, dt * 6);
      const sevA = state.coinSeverA;
      const sevB = state.coinSeverB;
      const coupled = Math.max(0, 1 - Math.max(sevA, sevB));

      const cx = w * 0.5;
      const cy = h * 0.5;
      const span = Math.min(w * 0.27, 290 * s);
      const ampY = h * 0.34;

      // 1. Coupled Braided Figure-8 / Möbius Phase Ribbon
      if (coupled > 0.02) {
        ctx.save();
        ctx.globalAlpha = coupled;
        const grad = ctx.createLinearGradient(cx - span, cy, cx + span, cy);
        grad.addColorStop(0, 'rgba(52, 184, 124, 0.9)');
        grad.addColorStop(0.5, 'rgba(212, 168, 83, 0.98)');
        grad.addColorStop(1, 'rgba(79, 156, 240, 0.9)');

        // Main lemniscate loop
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.8 * s;
        ctx.beginPath();
        for (let i = 0; i <= 140; i++) {
          const u = (i / 140) * Math.PI * 2;
          const px = cx + Math.sin(u) * span;
          const py = cy + Math.sin(u) * Math.cos(u) * ampY * 2.15;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Secondary delicate harmonic braid
        ctx.strokeStyle = grad;
        ctx.lineWidth = 0.9 * s;
        ctx.globalAlpha = coupled * 0.38;
        ctx.beginPath();
        for (let i = 0; i <= 140; i++) {
          const u = (i / 140) * Math.PI * 2;
          const px = cx + Math.sin(u) * span * 0.92;
          const py = cy - Math.sin(u) * Math.cos(u) * ampY * 1.65;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Streaming luminous distinctions along the Möbius loop
        ctx.globalAlpha = coupled;
        for (let p = 0; p < 24; p++) {
          const u = ((p / 24) * Math.PI * 2 + t * 0.85) % (Math.PI * 2);
          const px = cx + Math.sin(u) * span;
          const py = cy + Math.sin(u) * Math.cos(u) * ampY * 2.15;
          const side = Math.sin(u);
          ctx.fillStyle = Math.abs(side) < 0.2 ? '#f6d27a' : (side < 0 ? '#34b87c' : '#4f9cf0');
          ctx.beginPath();
          ctx.arc(px, py, (Math.abs(side) < 0.2 ? 3.2 : 2.1) * s, 0, Math.PI * 2);
          ctx.fill();
        }

        // Center Living Edge (+1) fulcrum & dissipating energy-cost micro-sparks
        ctx.fillStyle = '#d4a853';
        ctx.beginPath();
        ctx.arc(cx, cy, 4.8 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(212, 168, 83, 0.34)';
        ctx.lineWidth = 1 * s;
        ctx.beginPath();
        ctx.arc(cx, cy, (14 + Math.sin(t * 2.6) * 3.5) * s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(212, 168, 83, 0.94)';
        ctx.font = `600 ${(10 * s).toFixed(1)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(state.lang === 'zh' ? '活态前沿 · +1' : 'LIVING EDGE · +1', cx, cy - 32 * s);
        ctx.restore();
      }

      // 2. Severance A: Mechanical Clockwork Cosmos (no observer)
      if (sevA > 0.02) {
        ctx.save();
        ctx.globalAlpha = sevA;
        // Center crimson fracture slit
        ctx.strokeStyle = 'rgba(224, 90, 90, 0.82)';
        ctx.lineWidth = 1.6 * s;
        ctx.setLineDash([4 * s, 4 * s]);
        ctx.beginPath();
        ctx.moveTo(cx, h * 0.22);
        ctx.lineTo(cx, h * 0.88);
        ctx.stroke();
        ctx.setLineDash([]);

        // Cold interlocking gears on center-right
        ctx.lineWidth = 1.25 * s;
        const g1x = cx + span * 0.42;
        const g1y = cy + 2 * s;
        const r1 = Math.min(h * 0.22, 38 * s);
        drawGear(ctx, g1x, g1y, r1, 12, t * 0.75, 'rgba(224, 90, 90, 0.75)');
        drawGear(ctx, g1x + r1 * 1.56, g1y + r1 * 0.56, r1 * 0.68, 8, -t * 1.12 + 0.3, 'rgba(244, 240, 232, 0.42)');
        drawGear(ctx, g1x - r1 * 1.15, g1y + r1 * 0.92, r1 * 0.56, 7, -t * 1.28, 'rgba(79, 156, 240, 0.55)');

        ctx.fillStyle = 'rgba(224, 90, 90, 0.92)';
        ctx.font = `600 ${(10 * s).toFixed(1)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(state.lang === 'zh' ? '发条宇宙 · 观察者被抽干' : 'CLOCKWORK COSMOS · ZERO OBSERVER', cx, h * 0.13);
        ctx.restore();
      }

      // 3. Severance B: Unmoored First-Person Self-Looping Vortex (no causal friction)
      if (sevB > 0.02) {
        ctx.save();
        ctx.globalAlpha = sevB;
        ctx.strokeStyle = 'rgba(212, 168, 83, 0.75)';
        ctx.lineWidth = 1.5 * s;
        ctx.setLineDash([4 * s, 4 * s]);
        ctx.beginPath();
        ctx.moveTo(cx, h * 0.22);
        ctx.lineTo(cx, h * 0.88);
        ctx.stroke();
        ctx.setLineDash([]);

        // Self-consuming tight vortex spiral on center-left
        const vx = cx - span * 0.44;
        const vy = cy + 4 * s;
        ctx.strokeStyle = 'rgba(212, 168, 83, 0.84)';
        ctx.lineWidth = 1.35 * s;
        ctx.beginPath();
        for (let i = 0; i <= 180; i++) {
          const frac = i / 180;
          const ang = frac * Math.PI * 8 - t * 2.2;
          const rad = (1 - frac) * Math.min(h * 0.32, 52 * s);
          const px = vx + Math.cos(ang) * rad;
          const py = vy + Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        ctx.fillStyle = 'rgba(212, 168, 83, 0.94)';
        ctx.font = `600 ${(10 * s).toFixed(1)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(state.lang === 'zh' ? '虚空自旋 · 脱离现实摩擦' : 'SELF-ENCLOSED VORTEX · ZERO FRICTION', cx, h * 0.13);
        ctx.restore();
      }
    }

    // Slide 4: Full-Range -90° (Anti-ToE) <-> 0° (Orthogonal ⊥) <-> +90° (ToE) Projection Instrument
    function drawOrthoInstrument(dt) {
      const c = document.getElementById('ortho-canvas');
      if (!c) return;
      const rect = c.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // Gentle educational entrance sweep (+64° -> -64° -> 0°) unless user took manual control
      if (state.orthoAutoSweep && !state.orthoDragging) {
        state.orthoSweepAge += dt;
        const a = state.orthoSweepAge;
        if (a < 1.35) state.orthoTarget = 68 * Math.sin((a / 1.35) * Math.PI * 0.5);
        else if (a < 3.15) state.orthoTarget = 68 - 136 * ((a - 1.35) / 1.8);
        else if (a < 4.55) state.orthoTarget = -68 * (1 - (a - 3.15) / 1.4);
        else {
          state.orthoTarget = 0;
          state.orthoAutoSweep = false;
        }
      }

      // Smooth spring toward target tilt angle φ ∈ [-90°, +90°] with exact snap
      if (Math.abs(state.orthoTarget - state.orthoAngle) < 0.08) {
        state.orthoAngle = state.orthoTarget;
      } else {
        state.orthoAngle += (state.orthoTarget - state.orthoAngle) * Math.min(1, dt * 11);
      }
      const deg = state.orthoAngle;
      const rad = (deg * Math.PI) / 180;
      // u = (1, 0) along 1D ToE axis; v = (sin φ, cos φ)
      const dot = Math.sin(rad);  // -1.00 at -90° (Anti-ToE), 0.00 at 0° (Orthogonal ⊥), +1.00 at +90° (ToE)
      const lift = Math.cos(rad); //  0.00 at ±90°, 1.00 at 0°

      const absDeg = Math.abs(deg);
      const isOrtho = absDeg <= 6;
      const isTrapped = absDeg >= 62;

      // Update readout, slider, regime pill, and preset states
      const readout = document.getElementById('ortho-readout');
      if (readout) {
        const roundDeg = Math.round(deg);
        const degStr = roundDeg === 0 ? '0° (⊥)' : `${roundDeg > 0 ? '+' : ''}${roundDeg}°`;
        const dispDot = roundDeg === 0 ? 0 : dot;
        const dotStr = Math.abs(dispDot) < 0.005 ? '0.00' : `${dispDot > 0 ? '+' : ''}${dispDot.toFixed(2)}`;
        readout.textContent = `φ = ${degStr} · u·v = ${dotStr}`;
      }
      const slider = document.getElementById('ortho-slider');
      if (slider && !state.orthoDragging) slider.value = String(Math.round(deg));
      const regimeEl = document.getElementById('ortho-regime');
      if (regimeEl) {
        regimeEl.classList.toggle('trapped', isTrapped);
        regimeEl.classList.toggle('partial', !isOrtho && !isTrapped);
        if (isOrtho) {
          regimeEl.textContent = state.lang === 'zh' ? '正交切分 ⊥ · 新自由度展开' : 'ORTHOGONAL ⊥ · NEW DIMENSION';
        } else if (deg <= -62) {
          regimeEl.textContent = state.lang === 'zh' ? '反万物之理 · 困于同一维轴' : 'ANTI-ToE · TRAPPED ON 1D AXIS';
        } else if (deg >= 62) {
          regimeEl.textContent = state.lang === 'zh' ? '封闭万物之理 · 困于同一维轴' : 'CLOSED ToE · TRAPPED ON 1D AXIS';
        } else {
          regimeEl.textContent = state.lang === 'zh' ? '斜向投影 · 仍受旧轴牵引' : 'OBLIQUE · RESIDUAL 1D DRAG';
        }
      }
      dom.slideMount.querySelectorAll('[data-ortho-preset]').forEach((b) => {
        const pv = Number(b.dataset.orthoPreset);
        b.classList.toggle('active', Math.abs(deg - pv) <= 6);
      });

      const s = remScale();
      const cx = w * 0.5;
      const cy = h * 0.72;
      const axisLen = Math.min(w * 0.40, h * 0.54);
      const vecLen = axisLen * 0.90;

      ctx.save();
      // Subtle isometric lower ground plane
      const py = (8 + lift * 20) * s;
      ctx.strokeStyle = 'rgba(21, 20, 18, 0.075)';
      ctx.lineWidth = Math.max(1, s * 0.8);
      for (let g = -3; g <= 3; g++) {
        const f = g / 3;
        ctx.beginPath();
        ctx.moveTo(cx - axisLen + f * 24 * s, cy + f * py);
        ctx.lineTo(cx + axisLen + f * 24 * s, cy + f * py);
        ctx.stroke();
      }

      // Full -90° to +90° semicircular protractor arc + ticks
      ctx.strokeStyle = 'rgba(21, 20, 18, 0.14)';
      ctx.lineWidth = Math.max(1, 0.95 * s);
      ctx.beginPath();
      ctx.arc(cx, cy, vecLen, Math.PI, 0, false);
      ctx.stroke();

      for (let td = -90; td <= 90; td += 15) {
        const tr = (td * Math.PI) / 180;
        const major = td % 45 === 0;
        const r0 = vecLen - (major ? 7 : 4) * s;
        const r1 = vecLen + (major ? 4 : 2) * s;
        ctx.strokeStyle = td === 0 ? 'rgba(37, 133, 90, 0.65)' : 'rgba(21, 20, 18, 0.18)';
        ctx.lineWidth = (major ? 1.2 : 0.8) * s;
        ctx.beginPath();
        ctx.moveTo(cx + Math.sin(tr) * r0, cy - Math.cos(tr) * r0);
        ctx.lineTo(cx + Math.sin(tr) * r1, cy - Math.cos(tr) * r1);
        ctx.stroke();
      }

      // Translucent orthogonal plane rising cleanly with lift = cos(φ)
      const vx = cx + dot * vecLen;
      const vy = cy - lift * vecLen;
      if (lift > 0.04) {
        const grad = ctx.createLinearGradient(cx, cy, cx, vy);
        grad.addColorStop(0, `rgba(37, 133, 90, ${(0.03 * lift).toFixed(3)})`);
        grad.addColorStop(1, `rgba(37, 133, 90, ${(0.14 * lift).toFixed(3)})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx - axisLen * 0.56, cy);
        ctx.lineTo(cx + axisLen * 0.56, cy);
        ctx.lineTo(vx + axisLen * 0.56, vy);
        ctx.lineTo(vx - axisLen * 0.56, vy);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = `rgba(37, 133, 90, ${(0.24 * lift).toFixed(3)})`;
        ctx.lineWidth = Math.max(1, s * 0.85);
        ctx.stroke();
      }

      // 1D Horizontal Axis (-1 Anti-ToE <---> +1 ToE)
      ctx.strokeStyle = 'rgba(21, 20, 18, 0.45)';
      ctx.lineWidth = 1.5 * s;
      ctx.beginPath();
      ctx.moveTo(cx - axisLen, cy);
      ctx.lineTo(cx + axisLen, cy);
      ctx.stroke();

      // Signed Red 1D Projection Bar (shows exact overlap onto the 1D axis: -1..+1, vanishes at 0°!)
      if (Math.abs(dot) > 0.015) {
        ctx.strokeStyle = isTrapped ? 'rgba(192, 57, 43, 0.92)' : 'rgba(192, 57, 43, 0.62)';
        ctx.lineWidth = 4.2 * s;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(vx, cy);
        ctx.stroke();
        ctx.lineCap = 'butt';

        // Vertical dashed projection drop line
        ctx.setLineDash([3 * s, 4 * s]);
        ctx.strokeStyle = 'rgba(192, 57, 43, 0.48)';
        ctx.lineWidth = 1.15 * s;
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx, cy);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Axis endpoint labels
      ctx.fillStyle = deg < -60 ? '#c0392b' : 'rgba(21, 20, 18, 0.68)';
      ctx.font = `600 ${(10.5 * s).toFixed(1)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(state.lang === 'zh' ? '反万物之理 (-1)' : 'ANTI-ToE (-1)', cx - axisLen, cy + 22 * s);
      ctx.fillStyle = deg > 60 ? '#c0392b' : 'rgba(21, 20, 18, 0.68)';
      ctx.textAlign = 'right';
      ctx.fillText(state.lang === 'zh' ? '万物之理 (+1)' : 'ToE (+1)', cx + axisLen, cy + 22 * s);
      if (absDeg > 16) {
        ctx.fillStyle = 'rgba(21, 20, 18, 0.45)';
        ctx.textAlign = 'center';
        ctx.fillText('0° (⊥)', cx, cy - vecLen - 10 * s);
      }

      // Right-angle square at 0° OR tilt arc from vertical normal
      ctx.strokeStyle = isOrtho ? 'rgba(37, 133, 90, 0.72)' : 'rgba(184, 122, 30, 0.52)';
      ctx.lineWidth = 1.2 * s;
      if (isOrtho) {
        const sq = 13 * s;
        ctx.strokeRect(cx, cy - sq, sq, sq);
      } else {
        ctx.beginPath();
        const aTop = -Math.PI / 2;
        const aCur = aTop + rad;
        ctx.arc(cx, cy, 34 * s, Math.min(aTop, aCur), Math.max(aTop, aCur));
        ctx.stroke();
      }

      // Vector shaft color shifts smoothly: emerald at 0° -> amber -> crimson at ±90°
      const vecColor = isOrtho ? '#25855a' : (isTrapped ? '#c0392b' : '#b87a1e');
      ctx.strokeStyle = vecColor;
      ctx.lineWidth = 2.6 * s;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(vx, vy);
      ctx.stroke();

      // Living draggable tip node
      ctx.fillStyle = vecColor;
      ctx.beginPath();
      ctx.arc(vx, vy, 5.8 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = isOrtho ? 'rgba(37, 133, 90, 0.3)' : 'rgba(192, 57, 43, 0.28)';
      ctx.lineWidth = 1.3 * s;
      ctx.beginPath();
      ctx.arc(vx, vy, (12 + Math.sin(state.time * 2.6) * 2.4) * s, 0, Math.PI * 2);
      ctx.stroke();

      // Dynamic tip label (clamped smoothly inside canvas width)
      const tipText = isOrtho
        ? (state.lang === 'zh' ? '非万物之理（正交切分）' : 'Not a ToE (Orthogonal Cut)')
        : (deg <= -62
          ? (state.lang === 'zh' ? '陷入同轴反对' : 'Trapped in 1D Opposition')
          : (deg >= 62
            ? (state.lang === 'zh' ? '陷入封闭教条' : 'Trapped in Closed Doctrine')
            : (state.lang === 'zh' ? `自由度 ${Math.round(lift * 100)}%` : `Lift ${Math.round(lift * 100)}%`)));
      ctx.fillStyle = '#151412';
      ctx.font = `600 ${(11.5 * s).toFixed(1)}px Georgia, serif`;
      ctx.textAlign = 'center';
      const tx = Math.max(84 * s, Math.min(w - 84 * s, vx));
      const ty = Math.max(22 * s, vy - 20 * s);
      ctx.fillText(tipText, tx, ty);

      // Origin pivot dot
      ctx.fillStyle = '#151412';
      ctx.beginPath();
      ctx.arc(cx, cy, 3.6 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Slide 5: Real 14-Part Synaptic Interactive Chord Constellation (Multi-Hop L1 -> L2 Ripples)
    function drawLatticeCanvas(dt) {
      const c = document.getElementById('lattice-canvas');
      if (!c) return;
      const rect = c.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const parts = BOOK_DATA.parts || [];
      const mat = BOOK_DATA.partMatrix || [];
      const N = parts.length;
      if (!N) return;

      // Gentle periodic sleep-consolidation heartbeat
      state.latticeAutoTimer += dt;
      if (state.latticeAutoTimer > 5.2 && state.latticePulses.length < 4) {
        state.latticeAutoTimer = 0;
        triggerLatticePulse(Math.floor((state.time * 0.3) % N));
      }

      const s = remScale();
      const cx = w * 0.5;
      const cy = h * 0.48;
      const R = Math.min(w * 0.34, h * 0.36);

      // Subtle outer orbital hairlines
      ctx.strokeStyle = 'rgba(244, 240, 232, 0.08)';
      ctx.lineWidth = Math.max(1, s * 0.85);
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();

      const nodes = parts.map((p, i) => {
        const ang = -Math.PI / 2 + (i / N) * Math.PI * 2;
        return {
          p, i, ang,
          x: cx + Math.cos(ang) * R,
          y: cy + Math.sin(ang) * R,
          accent: PART_SPECS[p.slug]?.accent || '#34b87c',
        };
      });

      // Compute max weight for clean visual scaling
      let maxW = 1;
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          if ((mat[i]?.[j] || 0) > maxW) maxW = mat[i][j];
        }
      }

      const hov = state.latticeHover;

      // Draw real synaptic chords
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const weight = mat[i]?.[j] || 0;
          if (!weight) continue;
          const norm = Math.sqrt(weight / maxW);
          const isHot = hov === i || hov === j;
          const alpha = hov >= 0
            ? (isHot ? 0.26 + norm * 0.66 : 0.032)
            : (0.065 + norm * 0.28);
          ctx.strokeStyle = isHot
            ? (nodes[hov].accent)
            : `rgba(244, 240, 232, ${alpha.toFixed(3)})`;
          ctx.globalAlpha = isHot ? alpha : 1;
          ctx.lineWidth = (isHot ? (0.85 + norm * 2.2) : (0.5 + norm * 1.1)) * Math.sqrt(s);
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.quadraticCurveTo(cx, cy, nodes[j].x, nodes[j].y);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // Draw active multi-hop L1 -> L2 sleep-consolidation pulses
      for (let k = state.latticePulses.length - 1; k >= 0; k--) {
        const pulse = state.latticePulses[k];
        pulse.t += dt * (pulse.hop === 1 ? 0.78 : 0.95);
        if (pulse.t < 0) continue;
        if (pulse.t >= 1) {
          // Spawn arrival resonance halo + secondary L2 echo from top-weighted arrivals
          const dstNode = nodes[pulse.dst];
          if (dstNode) {
            state.latticeHalos.push({ idx: pulse.dst, age: 0, accent: dstNode.accent, hop: pulse.hop || 1 });
            if ((pulse.hop || 1) === 1 && pulse.echo && state.latticePulses.length < 44) {
              // Find top 2 neighbors of dst other than src
              const nbrs = [];
              for (let m = 0; m < N; m++) {
                if (m !== pulse.dst && m !== pulse.src && (mat[pulse.dst]?.[m] || 0) > 0) {
                  nbrs.push([m, mat[pulse.dst][m]]);
                }
              }
              nbrs.sort((a, b) => b[1] - a[1]);
              nbrs.slice(0, 2).forEach(([m]) => {
                state.latticePulses.push({ src: pulse.dst, dst: m, t: -0.05, hop: 2, echo: false });
              });
            }
          }
          state.latticePulses.splice(k, 1);
          continue;
        }
        const a = nodes[pulse.src];
        const b = nodes[pulse.dst];
        const t = pulse.t;
        const inv = 1 - t;
        const px = inv * inv * a.x + 2 * inv * t * cx + t * t * b.x;
        const py = inv * inv * a.y + 2 * inv * t * cy + t * t * b.y;
        ctx.fillStyle = pulse.hop === 2 ? '#d4a853' : a.accent;
        ctx.globalAlpha = Math.sin(t * Math.PI) * (pulse.hop === 2 ? 0.72 : 1);
        ctx.beginPath();
        ctx.arc(px, py, (pulse.hop === 2 ? 2.1 : 3.1) * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Draw expanding arrival resonance halos on reached parts
      for (let hIdx = state.latticeHalos.length - 1; hIdx >= 0; hIdx--) {
        const hl = state.latticeHalos[hIdx];
        hl.age += dt * 1.35;
        if (hl.age >= 1) { state.latticeHalos.splice(hIdx, 1); continue; }
        const n = nodes[hl.idx];
        if (!n) continue;
        ctx.strokeStyle = hl.accent;
        ctx.globalAlpha = (1 - hl.age) * (hl.hop === 2 ? 0.45 : 0.75);
        ctx.lineWidth = (hl.hop === 2 ? 1.0 : 1.6) * s;
        ctx.beginPath();
        ctx.arc(n.x, n.y, (8 + hl.age * 20) * s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Draw 14 Part nodes + crisp radial domain labels
      nodes.forEach((n) => {
        const isHov = hov === n.i;
        const r = (4.2 + Math.sqrt(n.p.count) * 0.85) * s;
        ctx.fillStyle = isHov ? n.accent : '#09090b';
        ctx.strokeStyle = n.accent;
        ctx.lineWidth = (isHov ? 2.4 : 1.5) * s;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const lx = cx + Math.cos(n.ang) * (R + r + 15 * s);
        const ly = cy + Math.sin(n.ang) * (R + r + 15 * s);
        ctx.fillStyle = isHov ? '#f4f0e8' : 'rgba(244, 240, 232, 0.78)';
        ctx.font = isHov
          ? `600 ${(11.5 * s).toFixed(1)}px -apple-system, sans-serif`
          : `500 ${(10.5 * s).toFixed(1)}px -apple-system, sans-serif`;
        ctx.textBaseline = 'middle';
        const cosA = Math.cos(n.ang);
        ctx.textAlign = Math.abs(cosA) < 0.18 ? 'center' : (cosA > 0 ? 'left' : 'right');
        const sh = PART_SHORT[n.p.slug] || { en: n.p.labelEn, zh: n.p.labelZh };
        const tag = `${sh[state.lang]} · ${n.p.count}`;
        ctx.fillText(tag, lx, ly);
      });

      // Center hover synaptic hub summary
      if (hov >= 0 && nodes[hov]) {
        const hn = nodes[hov];
        let bestPartner = -1, bestW = 0;
        for (let j = 0; j < N; j++) {
          if (j !== hov && (mat[hov]?.[j] || 0) > bestW) {
            bestW = mat[hov][j];
            bestPartner = j;
          }
        }
        ctx.fillStyle = 'rgba(9, 9, 11, 0.72)';
        ctx.beginPath();
        ctx.arc(cx, cy, 44 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = hn.accent;
        ctx.globalAlpha = 0.42;
        ctx.lineWidth = 1 * s;
        ctx.stroke();
        ctx.globalAlpha = 1;

        ctx.fillStyle = '#f4f0e8';
        ctx.font = `600 ${(13 * s).toFixed(1)}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${hn.p.inLinks}`, cx, cy - 8 * s);
        ctx.fillStyle = 'rgba(244, 240, 232, 0.62)';
        ctx.font = `500 ${(8.5 * s).toFixed(1)}px ui-monospace, monospace`;
        ctx.fillText(state.lang === 'zh' ? '条入链' : 'IN-LINKS', cx, cy + 7 * s);
        if (bestPartner >= 0) {
          const ps = PART_SHORT[nodes[bestPartner].p.slug] || { en: '', zh: '' };
          ctx.fillStyle = hn.accent;
          ctx.fillText(`↔ ${ps[state.lang]}`, cx, cy + 20 * s);
        }
      }

      // Store node coordinates for hover/click hit-testing
      c._nodes = nodes;
    }

    function triggerLatticePulse(srcIdx) {
      const mat = BOOK_DATA.partMatrix || [];
      const N = (BOOK_DATA.parts || []).length;
      const targets = [];
      for (let j = 0; j < N; j++) {
        if (j === srcIdx) continue;
        const w = mat[srcIdx]?.[j] || 0;
        if (w > 0) targets.push([j, w]);
      }
      targets.sort((a, b) => b[1] - a[1]);
      targets.forEach(([j], idx) => {
        state.latticePulses.push({
          src: srcIdx,
          dst: j,
          t: -Math.random() * 0.22,
          hop: 1,
          echo: idx < 3, // top 3 weighted destinations trigger L2 consolidation ripple
        });
      });
    }

    /* =========================================================================
       ACT II: 14 BESPOKE INTERACTIVE EXPLANATORY CUT VISUALIZERS (Slides 6–19)
       ========================================================================= */
    function labLabel(ctx, text, x, y, color, s, align = 'center') {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `600 ${(9.2 * s).toFixed(1)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    const PART_VISUALIZERS = {
      // Preface: Open Scaffold vs. Sealed Dome & Orthogonal Escape
      method(ctx, w, h, t, p, env) {
        const { s, accent, ink, inkSoft, inkFaint, warn, L } = env;
        const cx = w * 0.5, cy = h * 0.64;
        const span = w * 0.34, ht = h * 0.42;
        ctx.strokeStyle = inkFaint;
        ctx.lineWidth = 1 * s;
        ctx.beginPath();
        ctx.moveTo(cx - span * 1.2, cy + ht * 0.35);
        ctx.lineTo(cx + span * 1.2, cy + ht * 0.35);
        ctx.stroke();

        // Scaffolding arch bends inward into a sealed dome as p -> 1
        ctx.strokeStyle = p > 0.6 ? warn : accent;
        ctx.lineWidth = 1.6 * s;
        ctx.beginPath();
        const topOpen = (1 - p) * span * 0.68;
        ctx.moveTo(cx - span, cy + ht * 0.35);
        ctx.quadraticCurveTo(cx - span * 0.85, cy - ht * (0.75 + p * 0.25), cx - topOpen, cy - ht * 0.78);
        ctx.moveTo(cx + span, cy + ht * 0.35);
        ctx.quadraticCurveTo(cx + span * 0.85, cy - ht * (0.75 + p * 0.25), cx + topOpen, cy - ht * 0.78);
        ctx.stroke();

        // Truss ribs
        ctx.strokeStyle = inkFaint;
        ctx.lineWidth = 0.9 * s;
        for (let k = -2; k <= 2; k++) {
          const rx = cx + (k / 2.5) * span * 0.78;
          ctx.beginPath();
          ctx.moveTo(rx, cy + ht * 0.35);
          ctx.lineTo(rx * 0.86 + cx * 0.14, cy - ht * 0.36);
          ctx.stroke();
        }

        // Stress fracture sparks at sealed crown when p > 0.55
        if (p > 0.55) {
          const f = (p - 0.55) / 0.45;
          ctx.strokeStyle = warn;
          ctx.globalAlpha = f * 0.85;
          ctx.lineWidth = 1.2 * s;
          for (let a = -2; a <= 2; a++) {
            const ang = -Math.PI / 2 + a * 0.26;
            const r0 = ht * 0.66;
            const r1 = r0 + (8 + Math.sin(t * 7 + a) * 4) * f * s;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
            ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }

        // Living edge stepping upward orthogonally past the boundary
        const edgeY = Math.max(h * 0.25, cy - ht * (0.1 + p * 0.88) - Math.sin(t * 2.2) * 3.5 * s);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        ctx.moveTo(cx, cy + ht * 0.2);
        ctx.lineTo(cx, edgeY);
        ctx.stroke();
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(cx, edgeY, 4.5 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.arc(cx, edgeY, (10 + Math.sin(t * 3) * 3) * s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;

        labLabel(ctx, p < 0.5
          ? (L === 'zh' ? '有限脚手架 · 敞开承托' : 'OPEN SCAFFOLD · SUPPORTING EDGE')
          : (L === 'zh' ? '封闭教条碎裂 · 正交跃出' : 'SEALED DOME FRACTURES · ORTHOGONAL STEP'),
          cx, h * 0.11, p < 0.5 ? accent : warn, s);
      },

      // Part 1: External Chain vs. Initiating Center Forking Light-Cone
      causality(ctx, w, h, t, p, env) {
        const { s, accent, inkSoft, inkFaint, warn, L } = env;
        const y0 = h * 0.54;
        const left = w * 0.10, mid = w * 0.48, right = w * 0.89;

        // Bounded engineering chain on left (works cleanly!)
        ctx.strokeStyle = inkFaint;
        ctx.lineWidth = 1.2 * s;
        ctx.beginPath();
        ctx.moveTo(left, y0);
        ctx.lineTo(mid, y0);
        ctx.stroke();

        const pulseX = left + ((t * 0.42) % 1) * (mid - left);
        for (let i = 0; i < 4; i++) {
          const nx = left + (i / 3) * (mid - left);
          const hot = Math.abs(nx - pulseX) < 28 * s;
          ctx.fillStyle = hot ? accent : inkSoft;
          ctx.beginPath();
          ctx.arc(nx, y0, (hot ? 4.4 : 3.2) * s, 0, Math.PI * 2);
          ctx.fill();
        }

        // Passive deterministic extrapolation (fades / red dashed when p rises)
        ctx.save();
        ctx.setLineDash([4 * s, 4 * s]);
        ctx.strokeStyle = p > 0.45 ? warn : inkSoft;
        ctx.globalAlpha = 0.35 + (1 - p) * 0.5;
        ctx.lineWidth = 1.4 * s;
        ctx.beginPath();
        ctx.moveTo(mid, y0);
        ctx.lineTo(right, y0);
        ctx.stroke();
        ctx.restore();

        // Living Acting Center at mid: opens branching causal cone when p > 0.15
        const fan = (0.18 + p * 0.82) * h * 0.34;
        const grad = ctx.createLinearGradient(mid, y0, right, y0);
        grad.addColorStop(0, accent);
        grad.addColorStop(1, 'rgba(184,122,30,0.04)');
        ctx.fillStyle = grad;
        ctx.globalAlpha = 0.16 + p * 0.22;
        ctx.beginPath();
        ctx.moveTo(mid, y0);
        ctx.lineTo(right, y0 - fan);
        ctx.lineTo(right, y0 + fan);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;

        // Branching living-cut paths from acting center
        [-0.78, -0.32, 0.44, 0.82].forEach((k, idx) => {
          const active = idx === 1;
          ctx.strokeStyle = active ? accent : inkSoft;
          ctx.globalAlpha = active ? 0.92 : 0.28 + p * 0.22;
          ctx.lineWidth = (active ? 1.8 : 1.0) * s;
          ctx.beginPath();
          ctx.moveTo(mid, y0);
          ctx.quadraticCurveTo(
            (mid + right) * 0.52,
            y0 + k * fan * 0.45 + Math.sin(t * 2 + idx) * 4 * s,
            right,
            y0 + k * fan,
          );
          ctx.stroke();
        });
        ctx.globalAlpha = 1;

        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(mid, y0, 5.2 * s, 0, Math.PI * 2);
        ctx.fill();
        labLabel(ctx, L === 'zh' ? '可控外在链' : 'BOUNDED CHAIN', (left + mid) * 0.5, h * 0.2, inkSoft, s);
        labLabel(ctx, p < 0.5
          ? (L === 'zh' ? '线性外推' : 'LINEAR ROLLOUT')
          : (L === 'zh' ? '行动中心 · 发起新分支' : 'ACTING CENTER · FORKS NEW CUT'),
          (mid + right) * 0.52, h * 0.2, accent, s);
      },

      // Part 2: Measurement Slit vs. Unfolding Wave (Record != Legislator)
      physics(ctx, w, h, t, p, env) {
        const { s, accent, inkSoft, inkFaint, warn, L } = env;
        const slitX = w * (0.48 + (env.ptr.inside ? (env.ptr.x - 0.5) * 0.22 : 0));
        const cy = h * 0.54;
        const amp = h * 0.24;

        // Left recorded ledger grid (past contact stamps)
        ctx.strokeStyle = inkFaint;
        ctx.lineWidth = 0.8 * s;
        for (let g = 1; g < 4; g++) {
          const gy = h * (0.24 + g * 0.15);
          ctx.beginPath();
          ctx.moveTo(w * 0.06, gy);
          ctx.lineTo(slitX - 6 * s, gy);
          ctx.stroke();
        }

        // Unfolding organic living wave crossing right -> left (past on left, unfolding on right)
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.9 * s;
        ctx.beginPath();
        for (let i = 0; i <= 90; i++) {
          const frac = i / 90;
          const x = w * 0.06 + frac * w * 0.88;
          const futureBoost = x > slitX ? (1 + p * 0.85) : 1;
          const y = cy + Math.sin(frac * 10 - t * 2.4) * amp * 0.62 * futureBoost
            + Math.cos(frac * 17 + t * 1.4) * amp * 0.34 * (x > slitX ? 1 : 0.35);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Discrete stamped invariant dots on the past (left) side
        for (let k = 0; k < 6; k++) {
          const x = w * 0.1 + k * ((slitX - w * 0.14) / 5);
          const frac = (x - w * 0.06) / (w * 0.88);
          const y = cy + Math.sin(frac * 10 - t * 2.4) * amp * 0.62 + Math.cos(frac * 17 + t * 1.4) * amp * 0.12;
          ctx.fillStyle = accent;
          ctx.beginPath();
          ctx.arc(x, y, 3.2 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        // Rigid "Cosmic Legislator" box projected onto future when p -> 1
        if (p > 0.12) {
          ctx.save();
          ctx.strokeStyle = warn;
          ctx.globalAlpha = p * 0.82;
          ctx.setLineDash([4 * s, 3 * s]);
          ctx.lineWidth = 1.3 * s;
          ctx.strokeRect(slitX + 8 * s, cy - amp * 0.66, w * 0.88 - (slitX - w * 0.06) - 10 * s, amp * 1.32);
          ctx.restore();
        }

        // Crisp vertical measurement slit
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        ctx.moveTo(slitX, h * 0.18);
        ctx.lineTo(slitX, h * 0.88);
        ctx.stroke();

        labLabel(ctx, L === 'zh' ? '过往测量记录' : 'PAST RECORD', slitX * 0.52, h * 0.15, accent, s);
        labLabel(ctx, p < 0.5
          ? (L === 'zh' ? '受控复现' : 'REPRODUCIBLE')
          : (L === 'zh' ? '剧本溢出 · 现实未封口' : 'SCRIPT EXCEEDED · OPEN FUTURE'),
          (slitX + w * 0.94) * 0.5, h * 0.15, p < 0.5 ? inkSoft : warn, s);
      },

      // Part 3: Formal Axiom Box & Gödel Self-Reference Stepping Outside
      mathematics(ctx, w, h, t, p, env) {
        const { s, accent, inkSoft, inkFaint, warn, L } = env;
        const bx = w * 0.12, by = h * 0.25, bw = w * 0.48, bh = h * 0.56;

        // Deductive formal box & internal axiom lattice
        ctx.strokeStyle = p > 0.55 ? warn : accent;
        ctx.lineWidth = 1.5 * s;
        ctx.strokeRect(bx, by, bw, bh);

        const cols = 4, rows = 3;
        ctx.strokeStyle = inkFaint;
        ctx.lineWidth = 0.9 * s;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const nx = bx + ((c + 0.5) / cols) * bw;
            const ny = by + ((r + 0.5) / rows) * bh;
            if (c < cols - 1) {
              ctx.beginPath();
              ctx.moveTo(nx, ny);
              ctx.lineTo(nx + bw / cols, ny);
              ctx.stroke();
            }
            if (r < rows - 1) {
              ctx.beginPath();
              ctx.moveTo(nx, ny);
              ctx.lineTo(nx, ny + bh / rows);
              ctx.stroke();
            }
            ctx.fillStyle = accent;
            ctx.globalAlpha = 0.55;

          const ang = f * Math.PI * 5 + t * 0.85;
          const rad = f * maxR;
          const x = cx + Math.cos(ang) * rad;
          const y = cy + Math.sin(ang) * rad * 0.82;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          tipX = x; tipY = y;
        }
        ctx.stroke();
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(tipX, tipY, 4.2 * s, 0, Math.PI * 2);
        ctx.fill();

        // Uncharted friction spark dots illuminated near the living spiral
        for (let k = 0; k < 6; k++) {
          const ang = k * 1.05 + 0.4;
          const dx = cx + Math.cos(ang) * (maxR * 1.15);
          const dy = cy + Math.sin(ang) * (maxR * 0.92);
          ctx.fillStyle = accent;
          ctx.globalAlpha = 0.2 + p * 0.55;
          ctx.beginPath();
          ctx.arc(dx, dy, 2.3 * s, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        labLabel(ctx, L === 'zh' ? '既有痕迹索引' : 'PRIOR INDEX', sx + sw * 0.5, h * 0.15, inkSoft, s);
        labLabel(ctx, p < 0.5
          ? (L === 'zh' ? '快速定位参考' : 'FAST ORIENTATION')
          : (L === 'zh' ? '未知摩擦中亲自重溯' : 'LIVE RE-TRACING IN FRICTION'),
          cx, h * 0.15, accent, s);
      },

      // Part 12: Noisy Trial-and-Error Tree vs. Retroactive Linear Formula
      'success-and-the-self'(ctx, w, h, t, p, env) {
        const { s, accent, inkSoft, inkFaint, gold, warn, L } = env;
        const x0 = w * 0.11, y0 = h * 0.72;
        const x1 = w * 0.87, y1 = h * 0.28;

        // Messy forward exploratory trial-and-error branches (real path fades when p -> 1)
        const treeAlpha = 0.9 - p * 0.68;
        ctx.save();
        ctx.strokeStyle = accent;
        ctx.globalAlpha = treeAlpha;
        ctx.lineWidth = 1.4 * s;
        const mainPts = [
          [x0, y0],
          [w * 0.24, h * 0.56],
          [w * 0.36, h * 0.76],
          [w * 0.52, h * 0.44],
          [w * 0.65, h * 0.62],
          [w * 0.76, h * 0.36],
          [x1, y1],
        ];
        ctx.beginPath();
        mainPts.forEach(([px, py], i) => (i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)));
        ctx.stroke();

        // Dead-end friction stubs branching off the real path
        const stubs = [
          [mainPts[1], [w * 0.28, h * 0.30]],
          [mainPts[2], [w * 0.44, h * 0.86]],
          [mainPts[3], [w * 0.56, h * 0.22]],
          [mainPts[4], [w * 0.74, h * 0.78]],
        ];
        ctx.lineWidth = 1.0 * s;
        ctx.globalAlpha = treeAlpha * 0.55;
        stubs.forEach(([a, b]) => {
          ctx.beginPath();
          ctx.moveTo(a[0], a[1]);
          ctx.lineTo(b[0], b[1]);
          ctx.stroke();
          ctx.fillStyle = warn;
          ctx.beginPath();
          ctx.arc(b[0], b[1], 2.2 * s, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();

        // Retroactive clean straight "Success Formula" ruler snapping backward when p -> 1!
        if (p > 0.1) {
          ctx.save();
          ctx.strokeStyle = gold;
          ctx.globalAlpha = p * 0.95;
          ctx.lineWidth = 2.2 * s;
          ctx.beginPath();
          const curX = x1 - (x1 - x0) * p;
          const curY = y1 + (y0 - y1) * p;
          ctx.moveTo(x1, y1);
          ctx.lineTo(curX, curY);
          ctx.stroke();
          ctx.restore();
        }

        // Moving dot along real path at p < 0.5
        const segF = (t * 0.25) % 1;
        const idxF = segF * (mainPts.length - 1);
        const i0 = Math.floor(idxF), i1 = Math.min(mainPts.length - 1, i0 + 1);
        const lf = idxF - i0;
        const dx = mainPts[i0][0] + (mainPts[i1][0] - mainPts[i0][0]) * lf;
        const dy = mainPts[i0][1] + (mainPts[i1][1] - mainPts[i0][1]) * lf;
        ctx.fillStyle = accent;
        ctx.globalAlpha = 1 - p * 0.6;
        ctx.beginPath();
        ctx.arc(dx, dy, 3.8 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Finish star
        ctx.fillStyle = gold;
        ctx.beginPath();
        ctx.arc(x1, y1, 5 * s, 0, Math.PI * 2);
        ctx.fill();

        labLabel(ctx, p < 0.5
          ? (L === 'zh' ? '真实前向试错 · 充满摩擦与折返' : 'REAL TRIAL & ERROR · FRICTION & DEAD ENDS')
          : (L === 'zh' ? '事后倒置 · 裁剪出虚幻直线秘籍' : 'RETROSPECTIVE INVERSION · FAKE LINEAR RECIPE'),
          w * 0.48, h * 0.13, p < 0.5 ? accent : gold, s);
      },

      // Part 13: Expanding Tool-Leverage Rings Around Fixed Sovereign Helm
      'tools-and-progress'(ctx, w, h, t, p, env) {
        const { s, accent, inkSoft, warn, L } = env;
        const cx = w * 0.5, cy = h * 0.55;
        const baseR = Math.min(w * 0.14, h * 0.26);
        const tiers = L === 'zh'
          ? ['石器', '印刷', '算力', '智能体']
          : ['STONE', 'PRINT', 'COMPUTE', 'AGENTS'];

        // Expanding concentric tool leverage rings
        tiers.forEach((name, i) => {
          const rad = baseR * (0.52 + i * 0.42) * (1 + p * 0.34);
          ctx.strokeStyle = accent;
          ctx.globalAlpha = 0.22 + (i / 4) * 0.48;
          ctx.lineWidth = (i === 3 ? 1.6 : 1.05) * s;
          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.stroke();

          // Orbiting tool node on each ring
          const ang = t * (0.45 + i * 0.24 * (1 + p)) + i * 1.4;
          const tx = cx + Math.cos(ang) * rad;
          const ty = cy + Math.sin(ang) * rad;
          ctx.fillStyle = accent;
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.arc(tx, ty, 2.5 * s, 0, Math.PI * 2);
          ctx.fill();

          if (i === 0 || i === 3) {
            labLabel(ctx, name, cx + rad + 18 * s, cy + (i === 0 ? 12 * s : -10 * s), accent, s, 'left');
          }
        });
        ctx.globalAlpha = 1;

        // Sovereign helm crosshairs at exact center (never outsourced!)
        const helmR = 13 * s;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * 0.32);
        ctx.strokeStyle = p > 0.55 ? warn : '#f4f0e8';
        ctx.lineWidth = 1.4 * s;
        ctx.beginPath();
        ctx.arc(0, 0, helmR, 0, Math.PI * 2);
        for (let a = 0; a < 4; a++) {
          const ang = (a * Math.PI) / 2;
          ctx.moveTo(Math.cos(ang) * 4 * s, Math.sin(ang) * 4 * s);
          ctx.lineTo(Math.cos(ang) * (helmR + 5 * s), Math.sin(ang) * (helmR + 5 * s));
        }
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(cx, cy, 4.5 * s, 0, Math.PI * 2);
        ctx.fill();

        labLabel(ctx, p < 0.5
          ? (L === 'zh' ? '工具压缩成本 · 拓展行动半径' : 'TOOLS WIDEN ACTION RADIUS')
          : (L === 'zh' ? '杠杆再大 · 主权裁决仍在中心原点' : 'LEVERAGE SCALES · SOVEREIGN HELM STAYS HOME'),
          cx, h * 0.13, p < 0.5 ? accent : warn, s);
      },
    };

    function syncPartLabToggleChrome() {
      const btn = document.getElementById('cut-lab-toggle');
      if (!btn) return;
      const onBoundary = state.partStress >= 0.5;
      btn.classList.toggle('boundary-on', onBoundary);
      btn.textContent = onBoundary ? UI[state.lang].cutBoundary : UI[state.lang].cutWithin;
    }

    function drawPartCutLab(dt, sl) {
      const c = document.getElementById('part-cut-canvas');
      if (!c || !sl?.partSlug) return;
      const fn = PART_VISUALIZERS[sl.partSlug];
      if (!fn) return;
      const rect = c.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // Gentle autonomous plateau oscillation when idle & not speaking/pinned
      if (!state.partUserPinned && !state.speaking && !state.autoplay) {
        const wave = Math.sin(state.time * 0.68 - Math.PI * 0.35);
        state.partTargetStress = Math.max(0, Math.min(1, 0.5 + wave * 0.85));
      }

      state.partStress += (state.partTargetStress - state.partStress) * Math.min(1, dt * 6.5);
      syncPartLabToggleChrome();

      const isDark = sl.surface === 'dark';
      const env = {
        s: remScale(),
        accent: sl.accent,
        L: state.lang,
        isDark,
        ink: isDark ? 'rgba(244, 240, 232, 0.88)' : 'rgba(21, 20, 18, 0.86)',
        inkSoft: isDark ? 'rgba(244, 240, 232, 0.54)' : 'rgba(21, 20, 18, 0.52)',
        inkFaint: isDark ? 'rgba(244, 240, 232, 0.14)' : 'rgba(21, 20, 18, 0.12)',
        warn: isDark ? '#f06868' : '#c0392b',
        gold: isDark ? '#e6ba62' : '#b87a1e',
        ptr: state.partPointer,
      };
      ctx.save();
      fn(ctx, w, h, state.time, state.partStress, env);
      ctx.restore();
    }

    /* =========================================================================
       MOUNT SLIDE, BIND INTERACTIONS & UPDATE CHROME
       ========================================================================= */
    function mountSlide(instant = false) {
      const sl = SLIDES[state.slide];
      const L = state.lang;
      const u = UI[L];

      // Update surface & domain pigment
      document.documentElement.dataset.lang = L;
      document.documentElement.lang = L === 'zh' ? 'zh-CN' : 'en';
      document.documentElement.dataset.surface = sl.surface;
      document.documentElement.style.setProperty('--accent', sl.accent);

      // Ambient canvas interactive on Slide 2 (Prior wave interference) & Slide 21 (Enter constellation)
      ambCanvas.classList.toggle('interactive', sl.id === 'prior' || sl.id === 'enter');

      // Update Topbar & Bottombar
      dom.brandName.textContent = u.brand;
      dom.btnLang.textContent = u.langToggle;
      dom.lblOverview.textContent = u.overview;
      dom.lblAuto.textContent = state.autoplay ? u.autoOn : u.autoOff;
      dom.lblClose.textContent = u.close;
      dom.actCrumb.textContent = sl.act === 1 ? u.act1 : (sl.act === 2 ? u.act2 : u.act3);
      dom.slideNum.textContent = `${String(state.slide + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
      dom.slideLabel.textContent = sl.shortTitle[L];
      dom.btnPrev.disabled = state.slide === 0;
      dom.btnNext.disabled = state.slide === SLIDES.length - 1;

      // Update hash quietly
      const nextHash = `#${sl.id}`;
      if (location.hash !== nextHash) {
        history.replaceState(null, '', `${location.pathname}${location.search}${nextHash}`);
      }

      // Render slide HTML
      dom.slideMount.innerHTML = renderSlideHtml(sl);
      const slideEl = dom.slideMount.querySelector('.slide');
      if (slideEl && !instant) {
        slideEl.classList.add('entering');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => slideEl.classList.remove('entering'));
        });
      }

      // Reset Slide 3 coin simulator cleanly on entry
      if (sl.id === 'coin') {
        if (!instant) {
          state.coinMode = 'coupled';
          state.coinPinned = false;
        }
        const stageBox = document.getElementById('coin-stage-box');
        if (stageBox) {
          stageBox.addEventListener('click', () => {
            const order = ['coupled', 'severA', 'severB'];
            const next = order[(order.indexOf(state.coinMode) + 1) % order.length];
            setCoinMode(next, true);
          });
        }
      }

      // Bind Slide 4 Full-Range (-90° .. +90°) Orthogonal Slider & Direct Polar Drag
      if (sl.id === 'orthogonal') {
        if (!instant) {
          state.orthoAngle = 0;
          state.orthoTarget = 0;
          state.orthoAutoSweep = true;
          state.orthoSweepAge = 0;
        }
        const slider = document.getElementById('ortho-slider');
        const wrap = document.getElementById('ortho-wrap');
        if (slider) {
          slider.addEventListener('pointerdown', () => {
            state.orthoDragging = true;
            state.orthoAutoSweep = false;
          });
          slider.addEventListener('pointerup', () => { state.orthoDragging = false; });
          slider.addEventListener('input', () => {
            state.orthoAutoSweep = false;
            state.orthoTarget = Number(slider.value);
          });
        }
        if (wrap) {
          const aimFromPointer = (e) => {
            const r = wrap.getBoundingClientRect();
            const cx = r.left + r.width * 0.5;
            const cy = r.top + r.height * 0.72;
            const dx = e.clientX - cx;
            const dy = Math.max(2, cy - e.clientY);
            let deg = (Math.atan2(dx, dy) * 180) / Math.PI;
            // Allow sweeping all the way down to ±90° even near/below the horizontal line
            if (e.clientY >= cy - 4) deg = dx < 0 ? -90 : 90;
            deg = Math.max(-90, Math.min(90, deg));
            if (Math.abs(deg) < 2.2) deg = 0; // gentle tactile detent at exact 0° orthogonal
            state.orthoTarget = deg;
            if (slider) slider.value = String(Math.round(deg));
          };
          wrap.addEventListener('pointerdown', (e) => {
            state.orthoDragging = true;
            state.orthoAutoSweep = false;
            wrap.setPointerCapture(e.pointerId);
            aimFromPointer(e);
          });
          wrap.addEventListener('pointermove', (e) => {
            if (!state.orthoDragging) return;
            aimFromPointer(e);
          });
          wrap.addEventListener('pointerup', () => { state.orthoDragging = false; });
        }
      }

      // Bind Slide 5 Synaptic Lattice Hover & Click
      if (sl.id === 'lattice') {
        const c = document.getElementById('lattice-canvas');
        const cap = document.getElementById('lattice-caption');
        if (c) {
          const pickNode = (e) => {
            const rect = c.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const nodes = c._nodes || [];
            let best = -1, bestDist = 26 * remScale();
            for (const n of nodes) {
              const d = Math.hypot(mx - n.x, my - n.y);
              if (d < bestDist) { bestDist = d; best = n.i; }
            }
            return best;
          };
          c.addEventListener('pointermove', (e) => {
            const hit = pickNode(e);
            state.latticeHover = hit;
            if (cap) {
              if (hit >= 0) {
                const p = BOOK_DATA.parts[hit];
                cap.textContent = L === 'zh'
                  ? `${p.labelZh} · ${p.titleZh}（${p.count} 篇 · ${p.inLinks} 条入链）· 点击发射整合波`
                  : `${p.labelEn} · ${p.titleEn} (${p.count} essays · ${p.inLinks} incoming links) · Click to pulse`;
              } else {
                cap.textContent = u.latticeHint;
              }
            }
          });
          c.addEventListener('pointerleave', () => {
            state.latticeHover = -1;
            if (cap) cap.textContent = u.latticeHint;
          });
          c.addEventListener('click', (e) => {
            const hit = pickNode(e);
            triggerLatticePulse(hit >= 0 ? hit : Math.floor(Math.random() * BOOK_DATA.partCount));
          });
          // Initial graceful consolidation wave from Method (Part 0)
          setTimeout(() => {
            if (SLIDES[state.slide]?.id === 'lattice') triggerLatticePulse(0);
          }, 550);
        }
      }

      // Bind Act II per-part interactive Cut Lab (click to flip, drag to scrub stress 0..1)
      if (sl.kind === 'part') {
        if (!instant) {
          state.partStress = 0.0;
          state.partTargetStress = 0.0;
          state.partUserPinned = false;
        }
        const labStage = document.getElementById('cut-lab-stage');
        if (labStage) {
          let downX = 0;
          let moved = false;
          const scrubFromEvent = (e) => {
            const r = labStage.getBoundingClientRect();
            const nx = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
            const ny = Math.max(0, Math.min(1, (e.clientY - r.top) / Math.max(1, r.height)));
            state.partPointer = { x: nx, y: ny, inside: true };
            if (state.partDragActive) {
              state.partUserPinned = true;
              state.partTargetStress = nx;
            }
          };
          labStage.addEventListener('pointerdown', (e) => {
            state.partDragActive = true;
            downX = e.clientX;
            moved = false;
            labStage.setPointerCapture(e.pointerId);
            scrubFromEvent(e);
          });
          labStage.addEventListener('pointermove', (e) => {
            if (state.partDragActive && Math.abs(e.clientX - downX) > 6) moved = true;
            scrubFromEvent(e);
          });
          labStage.addEventListener('pointerup', () => {
            if (state.partDragActive && !moved) {
              state.partUserPinned = true;
              state.partTargetStress = state.partTargetStress < 0.5 ? 1.0 : 0.0;
            }
            state.partDragActive = false;
          });
          labStage.addEventListener('pointerleave', () => {
            state.partDragActive = false;
            state.partPointer.inside = false;
          });
        }
      }

      // Update Pips & Preload adjacent covers + next audio
      updatePips();
      preloadAdjacent(state.slide);
      preloadAudioFor(state.slide, state.lang);
      preloadAudioFor(state.slide + 1, state.lang);
      state.autoElapsed = 0;
      state.userPinnedPlate = false;
      dom.autoplayBar.style.width = '0%';
      updateVoiceChrome();
    }

    /* =========================================================================
       PIP RAIL & OVERVIEW DRAWER
       ========================================================================= */
    function buildPipRail() {
      dom.pipRail.innerHTML = '';
      SLIDES.forEach((sl, idx) => {
        if (idx > 0 && SLIDES[idx - 1].act !== sl.act) {
          const gap = document.createElement('span');
          gap.className = 'pip-gap';
          dom.pipRail.appendChild(gap);
        }
        const btn = document.createElement('button');
        btn.className = 'pip';
        btn.type = 'button';
        btn.dataset.idx = String(idx);
        btn.innerHTML = '<span></span>';
        btn.addEventListener('click', () => goTo(idx));
        dom.pipRail.appendChild(btn);
      });
    }

    function updatePips() {
      const L = state.lang;
      dom.pipRail.querySelectorAll('.pip').forEach((btn) => {
        const idx = Number(btn.dataset.idx);
        btn.classList.toggle('active', idx === state.slide);
        btn.title = `${String(idx + 1).padStart(2, '0')} · ${SLIDES[idx].shortTitle[L]}`;
        btn.setAttribute('aria-label', btn.title);
      });
    }

    function renderOverview() {
      const L = state.lang;
      const u = UI[L];
      dom.overviewTitle.textContent = u.overviewTitle;
      const groups = [
        { title: u.act1, items: SLIDES.map((s, i) => ({ s, i })).filter((x) => x.s.act === 1) },
        { title: u.act2, items: SLIDES.map((s, i) => ({ s, i })).filter((x) => x.s.act === 2) },
        { title: u.act3, items: SLIDES.map((s, i) => ({ s, i })).filter((x) => x.s.act === 3) },
      ];
      dom.overviewContent.innerHTML = groups.map((g) => `
        <div class="overview-group-title">${esc(g.title)}</div>
        <div class="overview-grid">
          ${g.items.map(({ s, i }) => {
            const p = s.partSlug ? PARTS_BY_SLUG.get(s.partSlug) : null;
            const meta = p ? `${p.count} ${u.essaysUnit}` : `${String(i + 1).padStart(2, '0')}`;
            return `
              <button class="overview-item${i === state.slide ? ' current' : ''}" type="button" data-jump-idx="${i}" style="--item-accent:${s.accent};">
                <span class="overview-item-top">
                  <span>${String(i + 1).padStart(2, '0')}</span>
                  <span>${esc(meta)}</span>
                </span>
                <span class="overview-item-name">${esc(s.shortTitle[L])}</span>
              </button>`;
          }).join('')}
        </div>
      `).join('');
    }

    function setOverview(open) {
      state.overviewOpen = open;
      if (open) {
        renderOverview();
        if (state.speaking) {
          narrator.pause();
          state.pausedForOverview = true;
        }
      } else if (state.pausedForOverview) {
        state.pausedForOverview = false;
        if (state.narrationEnabled && (state.autoplay || narrator.currentTime > 0) && !narrator.ended) {
          narrator.play().catch(() => {});
        }
      }
      dom.overviewDrawer.classList.toggle('open', open);
      dom.overviewDrawer.setAttribute('aria-hidden', open ? 'false' : 'true');
      dom.btnOverview.classList.toggle('active', open);
    }

    /* =========================================================================
       NAVIGATION & DELEGATED INTERACTIONS
       ========================================================================= */
    function goTo(idx) {
      const target = Math.max(0, Math.min(SLIDES.length - 1, idx));
      if (target === state.slide) return;
      const shouldNarrate = state.autoplay && state.narrationEnabled;
      stopNarration();
      state.slide = target;
      // Reset part cover to first plate when entering via autoplay so 3-plate progression runs cleanly
      if (state.autoplay && SLIDES[target]?.kind === 'part') {
        state.selectedPlate[SLIDES[target].partSlug] = 0;
      }
      mountSlide(false);
      if (shouldNarrate) startSlideNarration();
    }

    function toggleLang() {
      const wasSpeaking = state.speaking || (state.autoplay && state.narrationEnabled);
      stopNarration();
      state.lang = state.lang === 'en' ? 'zh' : 'en';
      const url = new URL(location.href);
      url.searchParams.set('lang', state.lang);
      history.replaceState(null, '', url.toString());
      mountSlide(true);
      if (state.overviewOpen) renderOverview();
      if (wasSpeaking && !state.overviewOpen) startSlideNarration();
    }

    function toggleVoice() {
      if (state.autoplay) {
        state.narrationEnabled = !state.narrationEnabled;
        if (state.narrationEnabled) {
          startSlideNarration();
        } else {
          stopNarration();
        }
      } else {
        // Manual mode: toggle narrating current slide on demand
        if (state.speaking) {
          stopNarration();
        } else {
          state.narrationEnabled = true;
          startSlideNarration();
        }
      }
      updateVoiceChrome();
    }

    function toggleAutoplay(forceOn = null) {
      const next = forceOn === null ? !state.autoplay : Boolean(forceOn);
      if (next && state.slide === SLIDES.length - 1 && !state.autoplay) {
        // Restart from Slide 1 if autoplay is triggered at the end
        state.slide = 0;
        mountSlide(false);
      }
      state.autoplay = next;
      state.autoElapsed = 0;
      state.postAudioPause = 0;
      if (state.autoplay) {
        if (state.narrationEnabled) {
          startSlideNarration();
        }
      } else {
        stopNarration();
        dom.autoplayBar.style.width = '0%';
      }
      updateVoiceChrome();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    // Delegated clicks inside slide mount
    dom.slideMount.addEventListener('click', (e) => {
      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        const act = actionBtn.dataset.action;
        if (act === 'play-tour') {
          state.narrationEnabled = true;
          toggleAutoplay(true);
        }
        if (act === 'next') goTo(state.slide + 1);
        if (act === 'jump-parts') goTo(5);
        if (act === 'overview') setOverview(true);
        if (act === 'replay') {
          stopNarration();
          state.autoplay = false;
          goTo(0);
          updateVoiceChrome();
        }
        if (act === 'toggle-part-stress') {
          state.partUserPinned = true;
          state.partTargetStress = state.partTargetStress < 0.5 ? 1.0 : 0.0;
        }
        return;
      }

      // Slide 2 multi-center wave interference presets
      const priorBtn = e.target.closest('[data-prior-preset]');
      if (priorBtn) {
        setPriorPreset(priorBtn.dataset.priorPreset);
        return;
      }

      // Slide 3 Möbius coin coupling / severance simulator controls
      const coinModeBtn = e.target.closest('[data-coin-mode]');
      if (coinModeBtn) {
        setCoinMode(coinModeBtn.dataset.coinMode, true);
        return;
      }
      const coinToggleBtn = e.target.closest('[data-coin-toggle]');
      if (coinToggleBtn) {
        const tgt = coinToggleBtn.dataset.coinToggle;
        setCoinMode(state.coinMode === tgt ? 'coupled' : tgt, true);
        return;
      }

      // Slide 4 orthogonal quick-snap presets (-90°, 0°, +90°)
      const orthoPresetBtn = e.target.closest('[data-ortho-preset]');
      if (orthoPresetBtn) {
        state.orthoAutoSweep = false;
        state.orthoTarget = Number(orthoPresetBtn.dataset.orthoPreset);
        const slider = document.getElementById('ortho-slider');
        if (slider) slider.value = String(state.orthoTarget);
        return;
      }

      // Part 3-plate cover switcher
      const plateBtn = e.target.closest('[data-plate-idx]');
      if (plateBtn) {
        selectPartPlate(plateBtn.dataset.partSlug, Number(plateBtn.dataset.plateIdx), true);
        return;
      }

      // Slide 20 Index of Premises label filter
      const labelEl = e.target.closest('[data-label-idx]');
      if (labelEl) {
        state.activeLabelIdx = Number(labelEl.dataset.labelIdx);
        mountSlide(true);
      }
    });

    dom.overviewContent.addEventListener('click', (e) => {
      const item = e.target.closest('[data-jump-idx]');
      if (!item) return;
      const idx = Number(item.dataset.jumpIdx);
      state.pausedForOverview = false;
      setOverview(false);
      goTo(idx);
    });

    dom.btnLang.addEventListener('click', toggleLang);
    dom.btnOverview.addEventListener('click', () => setOverview(!state.overviewOpen));
    dom.btnCloseOverview.addEventListener('click', () => setOverview(false));
    dom.btnVoice.addEventListener('click', toggleVoice);
    dom.btnAuto.addEventListener('click', () => toggleAutoplay());
    dom.btnFs.addEventListener('click', toggleFullscreen);
    dom.btnPrev.addEventListener('click', () => goTo(state.slide - 1));
    dom.btnNext.addEventListener('click', () => goTo(state.slide + 1));

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape' && state.overviewOpen) { setOverview(false); return; }
      if (e.key === 'o' || e.key === 'O' || e.key === 'g' || e.key === 'G') { setOverview(!state.overviewOpen); return; }
      if (state.overviewOpen) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); goTo(state.slide + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(state.slide - 1); }
      else if (e.key === 'Home') { goTo(0); }
      else if (e.key === 'End') { goTo(SLIDES.length - 1); }
      else if (e.key === 'l' || e.key === 'L') { toggleLang(); }
      else if (e.key === 'm' || e.key === 'M') { toggleVoice(); }
      else if (e.key === 'a' || e.key === 'A') { toggleAutoplay(); }
      else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
    });

    // Touch swipe navigation on mobile
    let touchX = 0, touchY = 0;
    dom.stage.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });
    dom.stage.addEventListener('touchend', (e) => {
      if (!touchX || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      touchX = 0;
      if (Math.abs(dx) > 54 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) goTo(state.slide + 1);
        else goTo(state.slide - 1);
      }
    }, { passive: true });

    // Track pointer cleanly across stage for Slide 21 interactive constellation
    dom.stage.addEventListener('pointermove', (e) => {
      if (SLIDES[state.slide]?.id !== 'enter') return;
      const rect = dom.stage.getBoundingClientRect();
      state.enterPointer = { x: e.clientX - rect.left, y: e.clientY - rect.top, inside: true };
    });
    dom.stage.addEventListener('pointerleave', () => {
      state.enterPointer.inside = false;
    });

    window.addEventListener('resize', resizeAmbient);
    document.addEventListener('fullscreenchange', () => setTimeout(resizeAmbient, 60));

    /* =========================================================================
       ANIMATION LOOP
       ========================================================================= */
    let lastTs = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - lastTs) / 1000);
      lastTs = now;
      state.time += dt;

      drawAmbientFrame(dt);
      const sl = SLIDES[state.slide];
      if (sl?.id === 'coin') drawCoinCanvas(dt);
      if (sl?.id === 'orthogonal') drawOrthoInstrument(dt);
      if (sl?.id === 'lattice') drawLatticeCanvas(dt);
      if (sl?.kind === 'part') drawPartCutLab(dt, sl);

      // Narration-length-synchronized autoplay + gentle 3-plate progression on Part slides
      const tr = getTrack(state.slide, state.lang);
      const liveDur = (Number.isFinite(narrator.duration) && narrator.duration > 0)
        ? narrator.duration
        : (tr?.duration || sl?.duration || 12);

      if (!state.overviewOpen && state.speaking && state.narrationEnabled && !state.audioFailed) {
        const cur = narrator.currentTime || 0;
        const denom = state.autoplay && state.slide < SLIDES.length - 1 ? (liveDur + BREATH_PAUSE) : liveDur;
        const ratio = Math.min(1, cur / Math.max(0.1, denom));
        dom.autoplayBar.style.width = `${(ratio * 100).toFixed(2)}%`;
        dom.narrationTime.textContent = `${fmtTime(cur)} / ${fmtTime(liveDur)}`;
        dom.narrationTime.classList.add('visible');

        // Auto-cue Slide 3 coin coupling -> Severance A -> Severance B with narration unless pinned
        if (sl?.id === 'coin' && !state.coinPinned) {
          const audioRatio = cur / Math.max(0.1, liveDur);
          const wantMode = audioRatio < 0.48 ? 'coupled' : (audioRatio < 0.74 ? 'severA' : 'severB');
          if (state.coinMode !== wantMode) setCoinMode(wantMode, false);
        }

        // Auto-cycle the 3 flagship cover plates & sync Part Cut Lab (Within Scope -> Boundary Begins)
        if (sl?.kind === 'part') {
          const audioRatio = cur / Math.max(0.1, liveDur);
          if (!state.partUserPinned) {
            state.partTargetStress = audioRatio < 0.44 ? 0.06 : Math.min(1, (audioRatio - 0.44) / 0.16);
          }
          if (!state.userPinnedPlate) {
            const wantIdx = audioRatio < 0.34 ? 0 : (audioRatio < 0.67 ? 1 : 2);
            if (state.selectedPlate[sl.partSlug] !== wantIdx) {
              selectPartPlate(sl.partSlug, wantIdx, false);
            }
          }
        }
      } else if (state.autoplay && !state.overviewOpen && state.slide < SLIDES.length - 1) {
        if (state.narrationEnabled && !state.audioFailed && state.audioEnded) {
          // Breathing pause after narration ends, then advance cleanly
          state.postAudioPause += dt;
          const total = liveDur + BREATH_PAUSE;
          const pct = Math.min(100, ((liveDur + state.postAudioPause) / total) * 100);
          dom.autoplayBar.style.width = `${pct.toFixed(2)}%`;
          if (state.postAudioPause >= BREATH_PAUSE) {
            goTo(state.slide + 1);
          }
        } else if (!state.narrationEnabled || state.audioFailed) {
          // Muted or fallback autoplay paced to the exact narration length
          state.autoElapsed += dt;
          const dur = (tr?.duration || sl?.duration || 11) + BREATH_PAUSE;
          const ratio = Math.min(1, state.autoElapsed / dur);
          dom.autoplayBar.style.width = `${(ratio * 100).toFixed(2)}%`;
          dom.narrationTime.textContent = `${fmtTime(state.autoElapsed)} / ${fmtTime(dur)}`;
          dom.narrationTime.classList.add('visible');
          if (sl?.kind === 'part' && !state.userPinnedPlate) {
            const wantIdx = ratio < 0.34 ? 0 : (ratio < 0.67 ? 1 : 2);
            if (state.selectedPlate[sl.partSlug] !== wantIdx) {
              selectPartPlate(sl.partSlug, wantIdx, false);
            }
          }
          if (state.autoElapsed >= dur) {
            goTo(state.slide + 1);
          }
        }
      } else if (!state.speaking) {
        dom.narrationTime.classList.remove('visible');
      }

      requestAnimationFrame(tick);
    }

    // Boot
    resizeAmbient();
    buildPipRail();
    mountSlide(true);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.documentElement.classList.add('transitions-ready');
      });
    });
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
