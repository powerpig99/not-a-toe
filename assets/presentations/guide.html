<!DOCTYPE html>
<html lang="en" data-lang="en" data-surface="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not a ToE — Interactive Guide to the Living Book / 非万物之理 · 活书导览</title>
  <meta name="description" content="A 21-slide bilingual dynamic introduction to Not a ToE: A Non-Definitive Guide for the Mind. Explore the single prior, the orthogonal cut, the live synaptic lattice, all 14 parts, and the Index of Premises.">
  <link rel="canonical" href="__CANONICAL_URL__">
  <meta property="og:site_name" content="Not a ToE">
  <meta property="og:title" content="Not a ToE — Interactive Guide to the Living Book / 非万物之理 · 活书导览">
  <meta property="og:description" content="__GUIDE_OG_DESCRIPTION__">
  <meta property="og:type" content="website">
  <meta property="og:url" content="__CANONICAL_URL__">
  <meta property="og:image" content="__SOCIAL_IMAGE_URL__">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Not a ToE — Interactive Guide to the Living Book">
  <meta name="twitter:description" content="A 21-slide bilingual dynamic tour through the entire Not a ToE Living Book.">
  <meta name="twitter:image" content="__SOCIAL_IMAGE_URL__">
  <link rel="icon" href="__FAVICON_DATA_URI__" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    :root {
      --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --accent: #34b87c;
      --bg: #09090b;
      --bg-elev: rgba(244, 240, 232, 0.035);
      --bg-elev-hover: rgba(244, 240, 232, 0.07);
      --ink: #f4f0e8;
      --ink-soft: rgba(244, 240, 232, 0.72);
      --ink-muted: rgba(244, 240, 232, 0.46);
      --rule: rgba(244, 240, 232, 0.12);
      --rule-strong: rgba(244, 240, 232, 0.24);
      --chrome-bg: rgba(9, 9, 11, 0.72);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-surface="light"] {
      --bg: #f4f0e8;
      --bg-elev: rgba(21, 20, 18, 0.032);
      --bg-elev-hover: rgba(21, 20, 18, 0.068);
      --ink: #151412;
      --ink-soft: rgba(21, 20, 18, 0.72);
      --ink-muted: rgba(21, 20, 18, 0.48);
      --rule: rgba(21, 20, 18, 0.12);
      --rule-strong: rgba(21, 20, 18, 0.24);
      --chrome-bg: rgba(244, 240, 232, 0.78);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-size: clamp(13.5px, min(1.18vw, 1.92vh), 56px);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    html.transitions-ready, html.transitions-ready body {
      transition: background-color 0.65s var(--ease-out), color 0.55s var(--ease-out);
    }

    html.transitions-ready .topbar, html.transitions-ready .bottombar {
      transition: border-color 0.5s ease, background-color 0.55s ease;
    }

    /* Subtle tactile paper/archival grain + radial pigment wash */
    #atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 78% 64% at 74% 36%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 72%),
        radial-gradient(ellipse 56% 50% at 18% 82%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%);
      transition: opacity 0.65s ease;
    }

    html[data-surface="light"] #atmosphere {
      background:
        radial-gradient(ellipse 75% 60% at 76% 32%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%),
        radial-gradient(ellipse 52% 46% at 16% 84%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 68%);
    }

    #grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* 3-row Architectural Shell (Zero Floating Overlap) */
    #shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .topbar {
      flex-shrink: 0;
      height: 3.35rem;
      padding: 0 clamp(1rem, 3vw, 3.2rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid var(--rule);
      background: var(--chrome-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 20;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: var(--ink);
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 0.94rem;
      letter-spacing: 0.01em;
      white-space: nowrap;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .brand-link:hover { opacity: 1; }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.55rem;
      height: 1.55rem;
      border: 1px solid var(--rule-strong);
      border-radius: 0.25rem;
      font-family: var(--font-serif);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .topbar-sep {
      width: 1px;
      height: 0.9rem;
      background: var(--rule-strong);
      flex-shrink: 0;
    }

    .act-crumb {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .tool-btn {
      appearance: none;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      padding: 0.36rem 0.66rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .tool-btn:hover {
      background: var(--bg-elev-hover);
      border-color: var(--rule);
      color: var(--ink);
    }

    .tool-btn.active {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--accent);
    }

    .tool-btn.lang-btn {
      border-color: var(--rule);
      color: var(--ink);
      font-weight: 600;
    }

    .voice-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 0.72rem;
      width: 0.78rem;
      justify-content: center;
    }

    .voice-bars i {
      display: block;
      width: 2px;
      height: 36%;
      border-radius: 99px;
      background: currentColor;
      transition: height 0.2s ease, opacity 0.2s ease;
    }

    .voice-bars i:nth-child(2) { height: 72%; }
    .voice-bars i:nth-child(3) { height: 48%; }

    .tool-btn.muted .voice-bars i { height: 22% !important; opacity: 0.4; }

    @keyframes voiceWave {
      0%, 100% { height: 26%; }
      50% { height: 95%; }
    }

    .tool-btn.speaking .voice-bars i:nth-child(1) { animation: voiceWave 0.78s ease-in-out infinite; }
    .tool-btn.speaking .voice-bars i:nth-child(2) { animation: voiceWave 0.62s ease-in-out 0.14s infinite; }
    .tool-btn.speaking .voice-bars i:nth-child(3) { animation: voiceWave 0.86s ease-in-out 0.28s infinite; }

    .narration-time {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .narration-time.visible { opacity: 0.92; }

    /* MAIN STAGE */
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    #ambient-canvas.interactive {
      pointer-events: auto;
    }

    #slide-mount {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: clamp(1rem, 2.8vh, 2.4rem) clamp(1.25rem, 3.6vw, 4.5rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.48s var(--ease-out), transform 0.56s var(--ease-out);
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .slide.entering {
      opacity: 0;
      transform: translateY(0.85rem) scale(0.992);
    }

    .slide.pass-through {
      pointer-events: none;
    }

    .slide.pass-through a,
    .slide.pass-through button,
    .slide.pass-through input,
    .slide.pass-through .interactive-island {
      pointer-events: auto;
    }

    /* SHARED TYPOGRAPHY */
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.62rem;
      margin: 0 0 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .kicker-rule {
      width: 1.5rem;
      height: 1px;
      background: var(--accent);
      opacity: 0.75;
      display: inline-block;
    }

    .display-title {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 3.05rem;
      line-height: 1.15;
      letter-spacing: -0.022em;
      color: var(--ink);
      text-wrap: balance;
    }

    html[data-lang="zh"] .display-title {
      letter-spacing: 0.01em;
      line-height: 1.26;
    }

    .lead-prose {
      margin: 0.88rem 0 0;
      font-size: 1.04rem;
      line-height: 1.66;
      color: var(--ink-soft);
      max-width: 58ch;
      text-wrap: pretty;
    }

    html[data-lang="zh"] .lead-prose {
      line-height: 1.82;
    }

    /* =========================================================================
       SLIDE 1: HERO CINEMA COVER
       ========================================================================= */
    .hero-slide {
      padding: 0 !important;
      overflow: hidden !important;
    }

    .hero-backdrop {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      object-position: center 45%;
      opacity: 1;
      transform: scale(1.04);
      animation: heroDrift 32s ease-in-out infinite alternate;
      filter: saturate(0.92) contrast(1.04) brightness(0.84);
    }

    @keyframes heroDrift {
      0% { transform: scale(1.04) translate3d(0%, 0%, 0); }
      100% { transform: scale(1.11) translate3d(-1.4%, -1.0%, 0); }
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(96deg, rgba(9, 9, 11, 0.86) 0%, rgba(9, 9, 11, 0.54) 48%, rgba(9, 9, 11, 0.14) 100%),
        linear-gradient(180deg, rgba(9, 9, 11, 0.36) 0%, rgba(9, 9, 11, 0.04) 44%, rgba(9, 9, 11, 0.80) 100%);
    }

    .hero-frame {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      max-width: min(94vw, 92rem);
      margin: 0 auto;
      padding: clamp(1.6rem, 4.8vh, 4rem) clamp(1.4rem, 4vw, 4.5rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(244, 240, 232, 0.64);
    }

    .hero-center {
      max-width: 52rem;
      padding: 1rem 0;
    }

    .hero-title {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 4.55rem;
      line-height: 1.07;
      letter-spacing: -0.028em;
      color: #f6f2ea;
      text-shadow: 0 12px 44px rgba(0, 0, 0, 0.45);
    }

    html[data-lang="zh"] .hero-title {
      letter-spacing: 0.03em;
      line-height: 1.18;
    }

    .hero-sub {
      margin: 1.1rem 0 0;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.32rem;
      line-height: 1.6;
      color: rgba(244, 240, 232, 0.84);
      max-width: 54ch;
    }

    html[data-lang="zh"] .hero-sub {
      font-style: normal;
      line-height: 1.75;
    }

    .hero-actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.88rem;
    }

    .btn-primary {
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
      background: color-mix(in srgb, var(--accent) 18%, rgba(9, 9, 11, 0.5));
      color: #f6f2ea;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0.68rem 1.38rem;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.25s ease, transform 0.25s var(--ease-out), border-color 0.25s ease;
    }

    .btn-primary:hover {
      background: color-mix(in srgb, var(--accent) 30%, rgba(9, 9, 11, 0.6));
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-ghost {
      appearance: none;
      border: 1px solid var(--rule-strong);
      background: transparent;
      color: var(--ink-soft);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      padding: 0.62rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .btn-ghost:hover {
      background: var(--bg-elev-hover);
      border-color: var(--ink-soft);
      color: var(--ink);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.15rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(244, 240, 232, 0.18);
      max-width: 54rem;
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-num {
      font-family: var(--font-serif);
      font-size: 1.95rem;
      font-weight: 600;
      color: #f6f2ea;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .stat-lbl {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(244, 240, 232, 0.56);
    }

    /* =========================================================================
       ACT I: SPLIT EDITORIAL + INTERACTIVE INSTRUMENT SLIDES (Slides 2–5)
       ========================================================================= */
    .split-grid {
      width: 100%;
      max-width: min(94vw, 92rem);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: clamp(1.5rem, 4.2vw, 4.4rem);
      align-items: center;
    }

    .derivation-list {
      margin-top: 1.38rem;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--rule);
    }

    .derivation-row {
      padding: 0.82rem 0;
      border-bottom: 1px solid var(--rule);
      display: grid;
      grid-template-columns: minmax(7rem, 0.38fr) 1fr;
      gap: 0.88rem;
      align-items: baseline;
    }

    .derivation-term {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .derivation-desc {
      font-size: 0.89rem;
      line-height: 1.58;
      color: var(--ink-soft);
    }

    /* Slide 2: Multi-Center Wave Interference HUD */
    .prior-field-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 56vh;
      gap: 0.55rem;
      pointer-events: none;
    }

    .prior-hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      pointer-events: auto;
    }

    .prior-hint-pill {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      border: 1px solid var(--rule);
      padding: 0.34rem 0.8rem;
      border-radius: 999px;
      background: var(--chrome-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .micro-pill-btn {
      appearance: none;
      border: 1px solid var(--rule-strong);
      background: var(--chrome-bg);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      padding: 0.32rem 0.72rem;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .micro-pill-btn:hover {
      border-color: var(--accent);
      color: var(--ink);
      background: color-mix(in srgb, var(--accent) 12%, var(--chrome-bg));
    }

    .micro-pill-btn.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 20%, var(--chrome-bg));
      color: var(--accent);
      font-weight: 600;
    }

    /* Slide 3: Two Sides of One Coin (Interactive Möbius Loop & Severance Simulator) */
    .coin-layout {
      width: 100%;
      max-width: min(94vw, 88rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(0.68rem, 1.7vh, 1.25rem);
    }

    .coin-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.72rem 1.6rem;
    }

    .coin-header-copy {
      max-width: 48rem;
    }

    .coin-header .display-title {
      font-size: 2.6rem;
    }

    .coin-header .lead-prose {
      margin-top: 0.58rem;
      font-size: 0.96rem;
    }

    .coin-mode-bar {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.34rem;
      padding: 0.24rem;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--bg-elev);
    }

    .coin-mode-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.34rem 0.74rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .coin-mode-btn:hover {
      color: var(--ink);
      background: var(--bg-elev-hover);
    }

    .coin-mode-btn.active {
      background: color-mix(in srgb, var(--btn-tone, var(--accent)) 22%, transparent);
      border-color: color-mix(in srgb, var(--btn-tone, var(--accent)) 65%, transparent);
      color: var(--ink);
    }

    .coin-stage-box {
      position: relative;
      height: clamp(10.2rem, 23vh, 15.6rem);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(0.8rem, 2.6vw, 2.6rem);
      overflow: hidden;
      cursor: pointer;
    }

    .coin-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .coin-pole {
      position: relative;
      z-index: 2;
      max-width: 16.5rem;
      padding: 0.72rem 0.92rem;
      border-radius: 0.5rem;
      background: rgba(9, 9, 11, 0.56);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 240, 232, 0.09);
      pointer-events: none;
      transition: opacity 0.4s ease, border-color 0.4s ease, transform 0.4s var(--ease-out);
    }

    .coin-pole.right { text-align: right; }

    .coin-pole.dimmed {
      opacity: 0.34;
      transform: scale(0.97);
    }

    .coin-pole-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    .coin-pole-name {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 600;
      margin: 0;
    }

    .coin-pole-sub {
      margin: 0.28rem 0 0;
      font-size: 0.8rem;
      color: var(--ink-soft);
      line-height: 1.48;
    }

    .severance-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.05rem;
    }

    .severance-card {
      text-align: left;
      appearance: none;
      font: inherit;
      color: inherit;
      padding: 0.88rem 1.12rem;
      border: 1px solid var(--rule);
      border-top: 2px solid color-mix(in srgb, var(--card-tone, var(--accent)) 85%, transparent);
      border-radius: 0.48rem;
      background: var(--bg-elev);
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s var(--ease-out), box-shadow 0.25s ease;
    }

    .severance-card:hover {
      background: var(--bg-elev-hover);
      border-color: color-mix(in srgb, var(--card-tone, var(--accent)) 55%, var(--rule));
      transform: translateY(-1px);
    }

    .severance-card.active {
      border-color: color-mix(in srgb, var(--card-tone, var(--accent)) 85%, transparent);
      background: color-mix(in srgb, var(--card-tone, var(--accent)) 11%, var(--bg-elev));
      box-shadow: 0 10px 30px color-mix(in srgb, var(--card-tone, var(--accent)) 14%, transparent);
    }

    .severance-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.44rem;
    }

    .severance-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--card-tone, var(--accent));
      margin: 0;
      font-weight: 600;
    }

    .severance-cue {
      font-family: var(--font-mono);
      font-size: 0.61rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      border: 1px solid var(--rule);
      padding: 0.16rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .severance-card.active .severance-cue {
      color: var(--card-tone, var(--accent));
      border-color: color-mix(in srgb, var(--card-tone, var(--accent)) 55%, transparent);
    }

    .severance-body {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.58;
      color: var(--ink-soft);
    }

    /* Slide 4: Orthogonal Full-Range (-90° <-> 0° <-> +90°) Interactive Instrument */
    .ortho-panel {
      display: flex;
      flex-direction: column;
      gap: 0.72rem;
      padding: 1.18rem;
      border: 1px solid var(--rule);
      border-radius: 0.65rem;
      background: var(--bg-elev);
    }

    .ortho-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .ortho-regime {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 0.24rem 0.68rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--accent) 11%, transparent);
      color: var(--accent);
      font-weight: 600;
      transition: all 0.22s ease;
    }

    .ortho-regime.trapped {
      border-color: rgba(192, 57, 43, 0.55);
      background: rgba(192, 57, 43, 0.12);
      color: #c0392b;
    }

    .ortho-regime.partial {
      border-color: rgba(184, 122, 30, 0.5);
      background: rgba(184, 122, 30, 0.11);
      color: #a86c1c;
    }

    .ortho-presets {
      display: inline-flex;
      align-items: center;
      gap: 0.34rem;
      flex-wrap: wrap;
    }

    .ortho-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.8;
      cursor: grab;
      touch-action: none;
    }

    .ortho-canvas-wrap:active { cursor: grabbing; }

    .ortho-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ortho-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.82rem;
      padding-top: 0.62rem;
      border-top: 1px solid var(--rule);
    }

    .ortho-slider-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.24rem;
    }

    .ortho-slider {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .ortho-ticks {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
    }

    .ortho-readout {
      font-family: var(--font-mono);
      font-size: 0.73rem;
      color: var(--ink);
      min-width: 10.6rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Slide 5: Synaptic Chord Lattice */
    .lattice-wrap {
      position: relative;
      width: 100%;
      height: min(72vh, 42rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lattice-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .lattice-caption {
      position: absolute;
      bottom: 0.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.69rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      background: var(--chrome-bg);
      border: 1px solid var(--rule);
      padding: 0.32rem 0.78rem;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    .metric-trio {
      margin-top: 1.38rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.78rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
    }

    .metric-val {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .metric-lbl {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 0.2rem;
    }

    /* =========================================================================
       ACT II: 14 BESPOKE PART EXHIBITION SLIDES (3 Varied Museum Compositions)
       ========================================================================= */
    .part-shell {
      width: 100%;
      max-width: min(94vw, 94rem);
      margin: 0 auto;
    }

    /* Composition A (plate-right) & Composition C (plate-left) */
    .part-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr);
      gap: clamp(1.4rem, 3.8vw, 3.8rem);
      align-items: center;
    }

    .part-split.plate-left {
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
    }

    .part-split.plate-left .part-visual-col { order: -1; }

    /* Composition B (panorama-top: 21:9 cover plate + live interactive cut lab side by side) */
    .part-panorama {
      display: flex;
      flex-direction: column;
      gap: clamp(0.85rem, 2vh, 1.45rem);
    }

    .panorama-media-row {
      display: grid;
      grid-template-columns: minmax(0, 1.26fr) minmax(0, 1fr);
      gap: 0.95rem;
      align-items: stretch;
    }

    .panorama-media-row > * { min-width: 0; }

    .part-panorama .gallery-stage {
      aspect-ratio: 21 / 9;
      max-height: none;
    }

    .part-panorama .cut-lab {
      height: 100%;
    }

    .part-panorama .cut-lab-stage {
      aspect-ratio: auto;
      flex: 1;
      min-height: 11.5rem;
    }

    .panorama-body {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.15fr);
      gap: clamp(1.2rem, 3.4vw, 3.2rem);
      align-items: start;
    }

    /* Gallery Plate Frame (Museum 21:9 Artwork + Animated Architectural Emblem) */
    .part-visual-col {
      display: flex;
      flex-direction: column;
      gap: 0.56rem;
      min-width: 0;
    }

    .gallery-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      border-radius: 0.62rem;
      overflow: hidden;
      border: 1px solid var(--rule-strong);
      background:
        radial-gradient(ellipse at 35% 35%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 68%),
        var(--bg-elev);
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.22);
    }

    /* Bespoke Per-Part Interactive Explanatory Cut Lab */
    .cut-lab {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--rule-strong);
      border-radius: 0.62rem;
      background: var(--bg-elev);
      overflow: hidden;
      min-width: 0;
    }

    .cut-lab-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.42rem 0.72rem;
      border-bottom: 1px solid var(--rule);
      background: color-mix(in srgb, var(--accent) 5%, var(--bg-elev));
    }

    .cut-lab-title {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.63rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cut-lab-dot {
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
    }

    .cut-lab-toggle {
      appearance: none;
      border: 1px solid var(--rule-strong);
      background: transparent;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.56rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.22s ease;
    }

    .cut-lab-toggle:hover {
      border-color: var(--accent);
      color: var(--ink);
    }

    .cut-lab-toggle.boundary-on {
      border-color: color-mix(in srgb, var(--accent) 75%, transparent);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      font-weight: 600;
    }

    .cut-lab-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 7.2;
      cursor: pointer;
      touch-action: none;
    }

    .cut-lab-stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cut-lab-hint {
      position: absolute;
      left: 0.62rem;
      bottom: 0.46rem;
      font-family: var(--font-mono);
      font-size: 0.59rem;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      background: var(--chrome-bg);
      border: 1px solid var(--rule);
      padding: 0.16rem 0.52rem;
      border-radius: 999px;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    html[data-surface="light"] .gallery-stage {
      box-shadow: 0 18px 48px rgba(20, 18, 14, 0.12);
    }

    .gallery-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.65s var(--ease-out), transform 9s ease-out;
    }

    .gallery-img.active {
      opacity: 1;
      transform: scale(1.0);
    }

    .gallery-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9, 9, 11, 0.06) 0%, rgba(9, 9, 11, 0.04) 55%, rgba(9, 9, 11, 0.72) 100%);
      pointer-events: none;
    }

    .emblem-badge {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: rgba(9, 9, 11, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 240, 232, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.56rem;
      color: color-mix(in srgb, var(--accent) 52%, #f6f2ea);
      pointer-events: none;
    }

    .emblem-badge svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gallery-caption-bar {
      position: absolute;
      left: 0.9rem;
      right: 0.9rem;
      bottom: 0.78rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 2;
    }

    .gallery-essay-title {
      font-family: var(--font-serif);
      font-size: 0.92rem;
      color: #f6f2ea;
      text-decoration: none;
      line-height: 1.35;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
    }

    .gallery-essay-title:hover { text-decoration: underline; }

    .gallery-open-pill {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #f6f2ea;
      background: rgba(9, 9, 11, 0.62);
      border: 1px solid rgba(244, 240, 232, 0.26);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .gallery-open-pill:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #09090b;
    }

    /* 3-Plate Switcher Strip */
    .plate-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.44rem;
    }

    .plate-tab {
      appearance: none;
      text-align: left;
      padding: 0.44rem 0.62rem;
      border-radius: 0.42rem;
      border: 1px solid var(--rule);
      background: var(--bg-elev);
      color: var(--ink-soft);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.16rem;
      transition: border-color 0.22s ease, background 0.22s ease, color 0.22s ease;
      min-width: 0;
    }

    .plate-tab:hover {
      background: var(--bg-elev-hover);
      border-color: var(--rule-strong);
      color: var(--ink);
    }

    .plate-tab.active {
      border-color: color-mix(in srgb, var(--accent) 68%, transparent);
      background: color-mix(in srgb, var(--accent) 11%, var(--bg-elev));
      color: var(--ink);
    }

    .plate-tab-meta {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
    }

    .plate-tab.active .plate-tab-meta { color: var(--accent); }

    .plate-tab-name {
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.32;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Part Copy & Dual-Cut Spec */
    .part-title {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 2.65rem;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-wrap: balance;
    }

    html[data-lang="zh"] .part-title {
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    .part-epigraph {
      margin: 0.78rem 0 0;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.08rem;
      line-height: 1.62;
      color: var(--ink-soft);
      padding-left: 0.9rem;
      border-left: 2px solid color-mix(in srgb, var(--accent) 65%, transparent);
    }

    html[data-lang="zh"] .part-epigraph {
      font-style: normal;
      line-height: 1.75;
    }

    .dual-cut {
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.78rem;
    }

    .cut-box {
      padding: 0.84rem 0.98rem;
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      background: var(--bg-elev);
    }

    .cut-box.boundary {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--rule));
      background: color-mix(in srgb, var(--accent) 6%, var(--bg-elev));
    }

    .cut-label {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 0.4rem;
      font-weight: 600;
    }

    .cut-box.boundary .cut-label { color: var(--accent); }

    .cut-text {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.58;
      color: var(--ink-soft);
    }

    html[data-lang="zh"] .cut-text { line-height: 1.72; }

    .part-footer {
      margin-top: 1.15rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--rule);
    }

    .part-counts {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .part-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 0.4rem 0.86rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .part-cta:hover {
      background: var(--accent);
      color: #09090b;
    }

    /* =========================================================================
       SLIDE 20: INTERACTIVE INDEX OF PREMISES EXPLORER
       ========================================================================= */
    .index-shell {
      width: 100%;
      max-width: min(94vw, 90rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .index-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }

    .index-section-chips {
      display: flex;
      gap: 1.15rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--ink-soft);
    }

    .index-section-chips strong {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--ink);
      margin-right: 0.28rem;
    }

    .label-bar {
      display: flex;
      height: 0.34rem;
      border-radius: 999px;
      overflow: hidden;
      gap: 2px;
      background: var(--rule);
    }

    .label-bar-seg {
      height: 100%;
      opacity: 0.45;
      transition: opacity 0.25s ease;
      cursor: pointer;
    }

    .label-bar-seg.active, .label-bar-seg:hover { opacity: 1; }

    .label-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .label-pill {
      appearance: none;
      border: 1px solid var(--rule);
      background: var(--bg-elev);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.38rem 0.78rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
    }

    .label-pill:hover {
      border-color: var(--rule-strong);
      color: var(--ink);
    }

    .label-pill.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .label-pill-dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
    }

    .premise-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .premise-card {
      padding: 1rem 1.15rem;
      border: 1px solid var(--rule);
      border-radius: 0.5rem;
      background: var(--bg-elev);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.5rem;
      transition: border-color 0.2s ease, transform 0.2s var(--ease-out), background 0.2s ease;
    }

    .premise-card:hover {
      border-color: var(--rule-strong);
      background: var(--bg-elev-hover);
      transform: translateY(-2px);
    }

    .premise-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.65rem;
    }

      font-size: 0.65rem;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.9rem;

      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);

      font-family: var(--font-serif);
      font-size: 1.38rem;
      font-weight: 600;
      margin: 0.38rem 0 0.5rem;
      color: var(--ink);

      margin: 0;
      font-size: 0.87rem;
      line-height: 1.62;
      color: var(--ink-soft);
    }

    .mini-parts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.78rem;
    }

    .mini-part-pill {
      font-size: 0.72rem;
      padding: 0.26rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      text-decoration: none;
      background: var(--bg-elev);

      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;

      top: -1px;
      left: 0;
      height: 2px;
      width: 0%;

      display: flex;
      align-items: center;
      gap: 0.65rem;

      flex: 1;

      color: var(--ink);

      font-size: 0.78rem;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .pip-rail {
      display: flex;
      align-items: center;
      gap: 0.28rem;
      flex-shrink: 0;
    }

    .pip-gap {
      width: 0.65rem;
      height: 1px;
      background: var(--rule-strong);
      margin: 0 0.2rem;
    }

    .pip {
      appearance: none;
      border: none;
      padding: 0.5rem 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .pip span {
      display: block;
      width: 0.4rem;
      height: 0.26rem;
      border-radius: 999px;
      background: var(--rule-strong);
      transition: width 0.3s var(--ease-out), background-color 0.3s ease;

    .pip:hover span { background: var(--ink-soft); }

    .pip.active span {
      width: 1.45rem;
      background: var(--accent);
    }

    .nav-btns {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
      flex: 1;
    }

      width: 2rem;
      height: 2rem;
      border-radius: 50%;

      color: var(--ink);

      align-items: center;
      justify-content: center;

      border-color: var(--ink);

      opacity: 0.26;
      cursor: default;
    }

      opacity: 1;
      pointer-events: auto;
    }

    .overview-inner {
      width: 100%;
      max-width: min(94vw, 88rem);
      margin: 0 auto;
    }

    .overview-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;

      font-size: 1.5rem;
      margin: 0;

      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(244, 240, 232, 0.5);
      margin: 1.15rem 0 0.65rem;
    }

      display: grid;

      gap: 0.6rem;
    }

      text-align: left;
      padding: 0.72rem 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(244, 240, 232, 0.12);
      background: rgba(244, 240, 232, 0.035);
      color: #f4f0e8;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;

    .overview-item:hover {
      background: rgba(244, 240, 232, 0.08);
      border-color: rgba(244, 240, 232, 0.28);
      transform: translateY(-1px);
    }

      border-color: var(--item-accent, #34b87c);

      display: flex;
      justify-content: space-between;

      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      color: var(--item-accent, #34b87c);
    }

    .overview-item-name {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      line-height: 1.32;
    }

    /* Animated SVG Hairline Motion */
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slowPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    .svg-spin { transform-origin: 24px 24px; animation: slowSpin 28s linear infinite; }
    .svg-pulse { animation: slowPulse 4.2s ease-in-out infinite; }

    .way-meta-list {
      margin-top: 0.9rem;
      padding-top: 0.78rem;
      border-top: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .way-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-muted);

    .way-meta-row strong {
      font-family: var(--font-serif);
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .split-grid > *,
    .part-split > *,
    .panorama-body > *,
    .ways-grid > *,
    .severance-grid > *,
    .dual-cut > *,
    .premise-grid > * {

    }

    /* =========================================================================
       RESPONSIVE TUNING
       ========================================================================= */
    @media (max-width: 960px) {
      html { font-size: 15px; }
      .display-title { font-size: clamp(1.75rem, 6vw, 2.5rem); }
      .part-title { font-size: clamp(1.6rem, 5.5vw, 2.3rem); }
      .hero-title { font-size: clamp(2.2rem, 8vw, 3.4rem); }
      .split-grid,
      .part-split,
      .part-split.plate-left,
      .panorama-media-row,
      .panorama-body,
      .ways-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .part-split.plate-left .part-visual-col { order: 0; }
      .part-panorama .cut-lab-stage { aspect-ratio: 21 / 8; min-height: 180px; }
      .prior-field-col { min-height: 280px; }
      .slide { justify-content: flex-start; }
      .lattice-wrap { height: 340px; }
      .pip-rail { display: none; }
      .act-crumb, .topbar-sep { display: none; }
    }

    @media (max-width: 680px) {
      html { font-size: 14.5px; }
      .topbar { padding: 0 14px; }
      .bottombar { padding: 0 14px; }
      .slide { padding: 16px 16px 24px; }
      .hero-frame { padding: 20px 18px 24px; }
      .hero-top-meta { flex-wrap: wrap; gap: 6px; font-size: 0.64rem; }
      .hero-top-meta span:last-child { display: none; }
      .hero-title { font-size: clamp(2.1rem, 9.5vw, 2.8rem); }
      .hero-sub { font-size: 0.96rem; max-width: 100%; }
      .part-title { font-size: clamp(1.5rem, 6.8vw, 2rem); }
      .part-epigraph { font-size: 0.9rem; }
      .dual-cut,
      .severance-grid,
      .premise-grid {
        grid-template-columns: 1fr;
      }
      .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .plate-strip { grid-template-columns: 1fr; }
      .coin-stage-box { height: 140px; padding: 0 8px; }
      .tool-btn { padding: 5px 8px; }
      .tool-btn span.hide-sm { display: none; }
      #btn-fs { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-backdrop, .svg-spin, .svg-pulse { animation: none !important; }
      .slide { transition: opacity 0.2s ease; }
    }
  </style>
</head>

       ========================================================================= */
    const BREATH_PAUSE = 1.25;
    const narrator = new Audio();
    narrator.preload = 'auto';
    let audioPlayToken = 0;
    const preloadedAudio = new Set();

    function getTrack(slideIdx = state.slide, lang = state.lang) {
      const sl = SLIDES[slideIdx];
      if (!sl) return null;
      return BOOK_DATA.audio?.[sl.id]?.[lang] || null;
    }

    function preloadAudioFor(slideIdx, lang = state.lang) {
      const tr = getTrack(slideIdx, lang);
      if (!tr || !tr.url || preloadedAudio.has(tr.url)) return;
      preloadedAudio.add(tr.url);
      const a = new Audio();
      a.preload = 'auto';
      a.src = tr.url;
    }

    function fmtTime(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2, '0')}`;
    }

    function updateVoiceChrome() {
      const u = UI[state.lang];
      dom.lblVoice.textContent = state.narrationEnabled ? u.voiceOn : u.voiceOff;
      dom.btnVoice.classList.toggle('muted', !state.narrationEnabled);
      dom.btnVoice.classList.toggle('speaking', state.speaking && state.narrationEnabled);
      dom.btnVoice.classList.toggle('active', state.speaking && state.narrationEnabled);
      dom.icoAuto.textContent = state.autoplay ? '❚❚' : '▶';
      dom.lblAuto.textContent = state.autoplay ? u.autoOn : u.autoOff;
      dom.btnAuto.classList.toggle('active', state.autoplay);
    }

    function stopNarration() {
      audioPlayToken += 1;
      narrator.pause();
      try { narrator.currentTime = 0; } catch (_) {}
      state.speaking = false;
      state.audioEnded = false;
      state.audioFailed = false;
      state.postAudioPause = 0;
      dom.narrationTime.classList.remove('visible');
      updateVoiceChrome();
    }

    function startSlideNarration() {
      stopNarration();
      if (!state.narrationEnabled) return;
      const tr = getTrack(state.slide, state.lang);
      if (!tr || !tr.url) {
        state.audioFailed = true;
        return;
      }
      const token = ++audioPlayToken;
      state.audioEnded = false;
      state.audioFailed = false;
      state.postAudioPause = 0;
      narrator.src = tr.url;
      narrator.currentTime = 0;
      const p = narrator.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          if (token !== audioPlayToken) return;
          state.speaking = true;
          updateVoiceChrome();
        }).catch(() => {
          if (token !== audioPlayToken) return;
          state.speaking = false;
          state.audioFailed = true;
          updateVoiceChrome();
        });
      }
      preloadAudioFor(state.slide + 1, state.lang);
    }

    narrator.addEventListener('playing', () => {
      state.speaking = true;
      state.audioFailed = false;
      updateVoiceChrome();
    });

    narrator.addEventListener('pause', () => {
      if (!narrator.ended) {
        state.speaking = false;
        updateVoiceChrome();
      }
    });

    narrator.addEventListener('ended', () => {
      state.speaking = false;
      state.audioEnded = true;
      state.postAudioPause = 0;
      updateVoiceChrome();
      if (state.autoplay && state.slide === SLIDES.length - 1) {
        // Finished narrating final slide cleanly
        state.autoplay = false;
        dom.autoplayBar.style.width = '100%';
        updateVoiceChrome();
      }
    });

    narrator.addEventListener('error', () => {
      state.speaking = false;
      state.audioFailed = true;
      updateVoiceChrome();
    });

      state.selectedPlate[slug] = pIdx;

    /* =========================================================================
       SLIDE-SPECIFIC INTERACTIVE CANVASES (Slides 1–5, 6–19 Part Labs, 21)
       ========================================================================= */
    const ambCanvas = dom.ambientCanvas;
    const ambCtx = ambCanvas.getContext('2d');
    let ambW = 0, ambH = 0, ambDpr = 1;
    const remScale = () => Math.max(0.85, parseFloat(getComputedStyle(document.documentElement).fontSize) / 16);

    // Offscreen scalar wave-interference field buffer for Slide 2 (60 FPS smooth cymatics)
    const FIELD_W = 192;
    const FIELD_H = 144;
    const priorBuf = document.createElement('canvas');
    priorBuf.width = FIELD_W;
    priorBuf.height = FIELD_H;
    const priorBufCtx = priorBuf.getContext('2d');
    const priorImgData = priorBufCtx.createImageData(FIELD_W, FIELD_H);

    function getPriorFieldRect() {
      if (ambW > 960) {
        const fx = ambW * 0.455;
        const fw = ambW * 0.51;
        const fy = ambH * 0.07;
        const fh = ambH * 0.80;
        return { fx, fy, fw, fh };
      }
      return { fx: ambW * 0.05, fy: ambH * 0.44, fw: ambW * 0.90, fh: ambH * 0.48 };
    }

    function setPriorPreset(mode) {
      if (mode === '3') {
        state.priorSources = [
          { nx: 0.32, ny: 0.36, phase: 0 },
          { nx: 0.72, ny: 0.39, phase: 0.25 },
          { nx: 0.51, ny: 0.72, phase: 0.5 },
        ];
      } else {
        state.priorSources = [
          { nx: 0.34, ny: 0.43, phase: 0 },
          { nx: 0.69, ny: 0.57, phase: 0.45 },
        ];
      }
      state.priorWakes = [];
      dom.slideMount.querySelectorAll('[data-prior-preset]').forEach((b) => {
        b.classList.toggle('active', b.dataset.priorPreset === String(state.priorSources.length));
      });
    }

    function resizeAmbient() {
      const rect = dom.stage.getBoundingClientRect();
      ambW = Math.max(1, rect.width);
      ambH = Math.max(1, rect.height);
      ambDpr = Math.min(window.devicePixelRatio || 1, 2);
      ambCanvas.width = Math.round(ambW * ambDpr);
      ambCanvas.height = Math.round(ambH * ambDpr);
      ambCtx.setTransform(ambDpr, 0, 0, ambDpr, 0, 0);
    }

    function spawnWake(x, y) {
      state.priorWakes.push({ x, y, r: 6, maxR: Math.min(ambW, ambH) * 0.28, born: state.time });
      if (state.priorWakes.length > 5) state.priorWakes.shift();
    }

    let lastWakeSpawn = 0;
    ambCanvas.addEventListener('pointermove', (e) => {
      const sl = SLIDES[state.slide];
      const rect = ambCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (sl?.id === 'enter') {
        state.enterPointer = { x, y, inside: true };
        return;
      }
      if (sl?.id !== 'prior') return;

      const { fx, fy, fw, fh } = getPriorFieldRect();
      if (state.priorDragIdx >= 0) {
        const src = state.priorSources[state.priorDragIdx];
        if (src) {
          src.nx = Math.max(0.08, Math.min(0.92, (x - fx) / fw));
          src.ny = Math.max(0.10, Math.min(0.88, (y - fy) / fh));
        }
        ambCanvas.style.cursor = 'grabbing';
        return;
      }

      // Hover hit-test existing centers
      const hitR = 24 * remScale();
      let hov = -1;
      state.priorSources.forEach((src, i) => {
        const sx = fx + src.nx * fw;
        const sy = fy + src.ny * fh;
        if (Math.hypot(x - sx, y - sy) < hitR) hov = i;
      });
      state.priorHoverIdx = hov;
      ambCanvas.style.cursor = hov >= 0 ? 'grab' : (x >= fx ? 'crosshair' : 'default');

      if (hov < 0 && x >= fx && state.time - lastWakeSpawn > 0.34) {
        lastWakeSpawn = state.time;
        spawnWake(x, y);

    });

    ambCanvas.addEventListener('pointerdown', (e) => {

      for (let i = 0; i < state.priorSources.length; i++) {

      state.priorDragIdx = state.priorSources.length - 1;

    ambCanvas.addEventListener('pointerleave', () => {

    function drawAmbientFrame(dt) {
      ambCtx.clearRect(0, 0, ambW, ambH);
      const sl = SLIDES[state.slide];
      if (!sl) return;

      // Slide 2: Real 2D Multi-Center Wave Interference & Constructive Resonance Field
      if (sl.id === 'prior') {
        const s = remScale();
        const { fx, fy, fw, fh } = getPriorFieldRect();
        const t = state.time;

        ambCtx.save();
        ambCtx.strokeStyle = 'rgba(21, 20, 18, 0.065)';
        ambCtx.lineWidth = Math.max(1, 0.85 * s);
        ambCtx.beginPath();
        ambCtx.moveTo(fx + fw * 0.5, fy + 8); ambCtx.lineTo(fx + fw * 0.5, fy + fh - 8);

        for (let i = state.priorWakes.length - 1; i >= 0; i--) {
          state.priorWakes[i].r += 86 * dt;
          if (state.priorWakes[i].r > state.priorWakes[i].maxR) state.priorWakes.splice(i, 1);
        }

        // Compute world coordinates of each active center (with tiny organic breath when idle)
        const srcs = state.priorSources.map((src, idx) => {
          const driftX = state.priorDragIdx === idx ? 0 : Math.sin(t * 0.38 + idx * 2.1) * 0.012;
          const driftY = state.priorDragIdx === idx ? 0 : Math.cos(t * 0.31 + idx * 1.7) * 0.012;
          return {
            x: fx + (src.nx + driftX) * fw,
            y: fy + (src.ny + driftY) * fh,
            phase: src.phase || 0,
          };
        });

        // 1. Scalar 2D Wave Superposition Field (constructively reinforcing ridges + nodal valleys)
        const wavelength = Math.max(32, Math.min(fw, fh) * 0.145);
        const kWave = (Math.PI * 2) / wavelength;
        const omega = 2.65;
        const falloff = Math.min(fw, fh) * 0.52;
        const data = priorImgData.data;
        const nSrc = srcs.length;
        const normDiv = Math.max(1.35, Math.sqrt(nSrc));

        // Pre-map source coords into buffer space
        const bSrc = srcs.map((p) => ({
          bx: ((p.x - fx) / fw) * FIELD_W,
          by: ((p.y - fy) / fh) * FIELD_H,
          phase: p.phase,
        }));
        const bWakes = state.priorWakes.map((w) => ({
          bx: ((w.x - fx) / fw) * FIELD_W,
          by: ((w.y - fy) / fh) * FIELD_H,
          r: (w.r / fw) * FIELD_W,
          life: 1 - w.r / w.maxR,
        }));
        const scaleX = fw / FIELD_W;
        const scaleY = fh / FIELD_H;

        let ptr = 0;
        for (let gy = 0; gy < FIELD_H; gy++) {
          const ny = (gy / (FIELD_H - 1)) * 2 - 1;
          const wyMask = Math.max(0, 1 - ny * ny);
          for (let gx = 0; gx < FIELD_W; gx++) {
            const nx = (gx / (FIELD_W - 1)) * 2 - 1;
            const r2 = nx * nx + ny * ny;
            const edgeFade = r2 >= 1.15 ? 0 : Math.max(0, (1.15 - r2) / 1.15) * Math.min(1, wyMask * 2.2);

            if (edgeFade <= 0.002) {
              data[ptr] = 0; data[ptr + 1] = 0; data[ptr + 2] = 0; data[ptr + 3] = 0;
              ptr += 4;
              continue;
            }

            let psi = 0;
            for (let i = 0; i < nSrc; i++) {
              const dx = (gx - bSrc[i].bx) * scaleX;
              const dy = (gy - bSrc[i].by) * scaleY;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const att = 1 / (1 + dist / falloff);
              psi += Math.cos(kWave * dist - omega * t + bSrc[i].phase) * att;
            }
            for (let w = 0; w < bWakes.length; w++) {
              const wk = bWakes[w];
              const dx = (gx - wk.bx) * scaleX;
              const dy = (gy - wk.by) * scaleY;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const env = Math.exp(-Math.pow((dist - wk.r * scaleX) / (wavelength * 0.55), 2));
              psi += Math.cos(kWave * dist - omega * t * 1.3) * env * wk.life * 0.72;
            }

            const v = psi / normDiv;
            let R = 21, G = 20, B = 18, A = 0;
            if (v > 0.62) {
              // Strong constructive resonance: warm luminous gold-emerald crest!
              const boost = Math.min(1, (v - 0.62) / 0.65);
              R = Math.round(37 + boost * 168);
              G = Math.round(145 + boost * 22);
              B = Math.round(92 - boost * 32);
              A = Math.round((0.18 + boost * 0.34) * edgeFade * 255);
            } else if (v > 0.08) {
              // Positive wave crest: translucent jade emerald
              const f = (v - 0.08) / 0.54;
              R = 37; G = 133; B = 90;
              A = Math.round(f * 0.16 * edgeFade * 255);
            } else if (v < -0.14) {
              // Trough / destructive phase: delicate charcoal-ink tint
              const f = Math.min(1, (-v - 0.14) / 0.85);
              R = 26; G = 32; B = 38;
              A = Math.round(f * 0.12 * edgeFade * 255);
            }
            data[ptr] = R;
            data[ptr + 1] = G;
            data[ptr + 2] = B;
            data[ptr + 3] = A;
            ptr += 4;
          }
        }
        priorBufCtx.putImageData(priorImgData, 0, 0);
        ambCtx.imageSmoothingEnabled = true;
        ambCtx.drawImage(priorBuf, fx, fy, fw, fh);

        const ringCount = 6;
        const maxRingR = ringCount * wavelength;
        const allRings = srcs.map((src) => {
          const rings = [];
          const phaseFrac = (((omega * t - src.phase) / (Math.PI * 2)) % 1 + 1) % 1;
          for (let k = 0; k < ringCount; k++) {
            const r = (k + phaseFrac) * wavelength;
            if (r < 6 || r > maxRingR) continue;

            rings.push({ r, alpha });
            ambCtx.strokeStyle = `rgba(37, 133, 90, ${alpha.toFixed(3)})`;

            ambCtx.arc(src.x, src.y, r, 0, Math.PI * 2);
            ambCtx.stroke();
          }
          return rings;
        });

        let bestNode = null;
        let bestStrength = 0;
        for (let i = 0; i < srcs.length; i++) {
          for (let j = i + 1; j < srcs.length; j++) {
            const dx = srcs[j].x - srcs[i].x;
            const dy = srcs[j].y - srcs[i].y;
            const d = Math.hypot(dx, dy);
            if (d < 8) continue;
            const ux = dx / d;
            const uy = dy / d;
            for (const ri of allRings[i]) {

                if (h2 <= 0) continue;
