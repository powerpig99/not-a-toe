<!DOCTYPE html>
<html lang="en" data-lang="en" data-surface="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not a ToE — Interactive Guide to the Living Book / 非万物之理 · 活书导览</title>
  <meta name="description" content="A 21-slide bilingual dynamic introduction to Not a ToE: A Non-Definitive Guide for the Mind. Explore the single prior, the orthogonal cut, the live synaptic lattice, all 14 parts, and the Index of Premises.">

  <meta property="og:site_name" content="Not a ToE">
  <meta property="og:title" content="Not a ToE — Interactive Guide to the Living Book / 非万物之理 · 活书导览">
  <meta property="og:description" content="A bilingual dynamic introduction to the Living Book: 14 parts, 473 essays, 7,269 synaptic cross-links, and 597 traced premises.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="__CANONICAL_URL__">
  <meta property="og:image" content="__SOCIAL_IMAGE_URL__">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Not a ToE — Interactive Guide to the Living Book">
  <meta name="twitter:description" content="A 21-slide bilingual dynamic tour through the entire Not a ToE Living Book.">
  <meta name="twitter:image" content="__SOCIAL_IMAGE_URL__">
  <link rel="icon" href="__FAVICON_DATA_URI__" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    :root {
      --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --accent: #34b87c;
      --bg: #09090b;
      --bg-elev: rgba(244, 240, 232, 0.035);
      --bg-elev-hover: rgba(244, 240, 232, 0.07);
      --ink: #f4f0e8;
      --ink-soft: rgba(244, 240, 232, 0.72);
      --ink-muted: rgba(244, 240, 232, 0.46);
      --rule: rgba(244, 240, 232, 0.12);
      --rule-strong: rgba(244, 240, 232, 0.24);
      --chrome-bg: rgba(9, 9, 11, 0.72);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-surface="light"] {
      --bg: #f4f0e8;
      --bg-elev: rgba(21, 20, 18, 0.032);
      --bg-elev-hover: rgba(21, 20, 18, 0.068);
      --ink: #151412;
      --ink-soft: rgba(21, 20, 18, 0.72);
      --ink-muted: rgba(21, 20, 18, 0.48);
      --rule: rgba(21, 20, 18, 0.12);
      --rule-strong: rgba(21, 20, 18, 0.24);
      --chrome-bg: rgba(244, 240, 232, 0.78);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-size: clamp(13.5px, min(1.16vw, 1.88vh), 36px);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    html.transitions-ready, html.transitions-ready body {
      transition: background-color 0.65s var(--ease-out), color 0.55s var(--ease-out);
    }

    html.transitions-ready .topbar, html.transitions-ready .bottombar {
      transition: border-color 0.5s ease, background-color 0.55s ease;
    }

    /* Subtle tactile paper/archival grain + radial pigment wash */
    #atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 78% 64% at 74% 36%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 72%),
        radial-gradient(ellipse 56% 50% at 18% 82%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%);
      transition: opacity 0.65s ease;
    }

    html[data-surface="light"] #atmosphere {
      background:
        radial-gradient(ellipse 75% 60% at 76% 32%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%),
        radial-gradient(ellipse 52% 46% at 16% 84%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 68%);
    }

    #grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* 3-row Architectural Shell (Zero Floating Overlap) */
    #shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .topbar {
      flex-shrink: 0;
      height: 3.35rem;
      padding: 0 clamp(1rem, 3vw, 3.2rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid var(--rule);
      background: var(--chrome-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 20;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: var(--ink);
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 0.94rem;
      letter-spacing: 0.01em;
      white-space: nowrap;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .brand-link:hover { opacity: 1; }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.55rem;
      height: 1.55rem;
      border: 1px solid var(--rule-strong);
      border-radius: 0.25rem;
      font-family: var(--font-serif);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .topbar-sep {
      width: 1px;
      height: 0.9rem;
      background: var(--rule-strong);
      flex-shrink: 0;
    }

    .act-crumb {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .tool-btn {
      appearance: none;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      padding: 0.36rem 0.66rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .tool-btn:hover {
      background: var(--bg-elev-hover);
      border-color: var(--rule);
      color: var(--ink);
    }

    .tool-btn.active {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--accent);
    }

    .tool-btn.lang-btn {
      border-color: var(--rule);
      color: var(--ink);
      font-weight: 600;
    }

    /* MAIN STAGE */
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    #ambient-canvas.interactive {
      pointer-events: auto;
    }

    #slide-mount {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: clamp(1rem, 2.8vh, 2.4rem) clamp(1.25rem, 3.6vw, 4.5rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.48s var(--ease-out), transform 0.56s var(--ease-out);
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .slide.entering {
      opacity: 0;
      transform: translateY(0.85rem) scale(0.992);
    }

    .slide.pass-through {
      pointer-events: none;
    }

    .slide.pass-through a,
    .slide.pass-through button,
    .slide.pass-through input,
    .slide.pass-through .interactive-island {
      pointer-events: auto;
    }

    /* SHARED TYPOGRAPHY */
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.62rem;
      margin: 0 0 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .kicker-rule {
      width: 1.5rem;
      height: 1px;
      background: var(--accent);
      opacity: 0.75;
      display: inline-block;
    }

    .display-title {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 3.05rem;
      line-height: 1.15;
      letter-spacing: -0.022em;
      color: var(--ink);
      text-wrap: balance;
    }

    html[data-lang="zh"] .display-title {
      letter-spacing: 0.01em;
      line-height: 1.26;
    }

    .lead-prose {
      margin: 0.88rem 0 0;
      font-size: 1.04rem;
      line-height: 1.66;
      color: var(--ink-soft);
      max-width: 58ch;
      text-wrap: pretty;
    }

    html[data-lang="zh"] .lead-prose {
      line-height: 1.82;
    }

    /* =========================================================================
       SLIDE 1: HERO CINEMA COVER
       ========================================================================= */
    .hero-slide {
      padding: 0 !important;
      overflow: hidden !important;
    }

    .hero-backdrop {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      object-position: center 45%;
      opacity: 1;
      transform: scale(1.04);
      animation: heroDrift 32s ease-in-out infinite alternate;
      filter: saturate(0.92) contrast(1.04) brightness(0.84);
    }

    @keyframes heroDrift {
      0% { transform: scale(1.04) translate3d(0%, 0%, 0); }
      100% { transform: scale(1.11) translate3d(-1.4%, -1.0%, 0); }
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(96deg, rgba(9, 9, 11, 0.86) 0%, rgba(9, 9, 11, 0.54) 48%, rgba(9, 9, 11, 0.14) 100%),
        linear-gradient(180deg, rgba(9, 9, 11, 0.36) 0%, rgba(9, 9, 11, 0.04) 44%, rgba(9, 9, 11, 0.80) 100%);
    }

    .hero-frame {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      max-width: min(94vw, 92rem);
      margin: 0 auto;
      padding: clamp(1.6rem, 4.8vh, 4rem) clamp(1.4rem, 4vw, 4.5rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(244, 240, 232, 0.64);
    }

    .hero-center {
      max-width: 52rem;
      padding: 1rem 0;
    }

    .hero-title {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 4.55rem;
      line-height: 1.07;
      letter-spacing: -0.028em;
      color: #f6f2ea;
      text-shadow: 0 12px 44px rgba(0, 0, 0, 0.45);
    }

    html[data-lang="zh"] .hero-title {
      letter-spacing: 0.03em;
      line-height: 1.18;
    }

    .hero-sub {
      margin: 1.1rem 0 0;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.32rem;
      line-height: 1.6;
      color: rgba(244, 240, 232, 0.84);
      max-width: 54ch;
    }

    html[data-lang="zh"] .hero-sub {
      font-style: normal;
      line-height: 1.75;
    }

    .hero-actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.88rem;
    }

    .btn-primary {
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
      background: color-mix(in srgb, var(--accent) 18%, rgba(9, 9, 11, 0.5));
      color: #f6f2ea;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0.68rem 1.38rem;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.25s ease, transform 0.25s var(--ease-out), border-color 0.25s ease;
    }

    .btn-primary:hover {
      background: color-mix(in srgb, var(--accent) 30%, rgba(9, 9, 11, 0.6));
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-ghost {
      appearance: none;
      border: 1px solid var(--rule-strong);
      background: transparent;
      color: var(--ink-soft);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      padding: 0.62rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .btn-ghost:hover {
      background: var(--bg-elev-hover);
      border-color: var(--ink-soft);
      color: var(--ink);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.15rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(244, 240, 232, 0.18);
      max-width: 54rem;
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-num {
      font-family: var(--font-serif);
      font-size: 1.95rem;
      font-weight: 600;
      color: #f6f2ea;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .stat-lbl {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(244, 240, 232, 0.56);
    }

    /* =========================================================================
       ACT I: SPLIT EDITORIAL + INTERACTIVE INSTRUMENT SLIDES (Slides 2–5)
       ========================================================================= */
    .split-grid {
      width: 100%;
      max-width: min(94vw, 92rem);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: clamp(1.5rem, 4.2vw, 4.4rem);
      align-items: center;
    }

    .derivation-list {
      margin-top: 1.38rem;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--rule);
    }

    .derivation-row {
      padding: 0.82rem 0;
      border-bottom: 1px solid var(--rule);
      display: grid;
      grid-template-columns: minmax(7rem, 0.38fr) 1fr;
      gap: 0.88rem;
      align-items: baseline;
    }

    .derivation-term {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .derivation-desc {
      font-size: 0.89rem;
      line-height: 1.58;
      color: var(--ink-soft);
    }

    /* Slide 3: Two Sides of One Coin */
    .coin-layout {
      width: 100%;
      max-width: min(94vw, 88rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(1.1rem, 2.8vh, 2rem);
    }

    .coin-header {
      max-width: 54rem;
    }

    .coin-stage-box {
      position: relative;
      height: clamp(9.5rem, 24vh, 17rem);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(0.8rem, 3vw, 3rem);
    }

    .coin-pole {
      position: relative;
      z-index: 2;
      max-width: 17.5rem;
    }

    .coin-pole.right { text-align: right; }

    .coin-pole-tag {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.38rem;
    }

    .coin-pole-name {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0;
    }

    .coin-pole-sub {
      margin: 0.32rem 0 0;
      font-size: 0.84rem;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .coin-ribbon-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .severance-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.15rem;
    }

    .severance-card {
      padding: 1.15rem 1.3rem;
      border: 1px solid var(--rule);
      border-top: 2px solid color-mix(in srgb, var(--card-tone, var(--accent)) 85%, transparent);
      border-radius: 0.4rem;
      background: var(--bg-elev);
    }

    .severance-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--card-tone, var(--accent));
      margin: 0 0 0.5rem;
      font-weight: 600;
    }

    .severance-body {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.62;
      color: var(--ink-soft);
    }

    /* Slide 4: Orthogonal Interactive Instrument */
    .ortho-panel {
      display: flex;
      flex-direction: column;
      gap: 0.88rem;
      padding: 1.25rem;
      border: 1px solid var(--rule);
      border-radius: 0.62rem;
      background: var(--bg-elev);
    }

    .ortho-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      cursor: grab;
      touch-action: none;
    }

    .ortho-canvas-wrap:active { cursor: grabbing; }

    .ortho-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ortho-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.88rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--rule);
    }

    .ortho-slider {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .ortho-readout {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--ink);
      min-width: 8rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Slide 5: Synaptic Chord Lattice */
    .lattice-wrap {
      position: relative;
      width: 100%;
      height: min(72vh, 42rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lattice-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .lattice-caption {
      position: absolute;
      bottom: 0.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.69rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      background: var(--chrome-bg);
      border: 1px solid var(--rule);
      padding: 0.32rem 0.78rem;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    .metric-trio {
      margin-top: 1.38rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.78rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
    }

    .metric-val {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .metric-lbl {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 0.2rem;
    }

    /* =========================================================================
       ACT II: 14 BESPOKE PART EXHIBITION SLIDES (3 Varied Museum Compositions)
       ========================================================================= */
    .part-shell {
      width: 100%;
      max-width: min(94vw, 94rem);
      margin: 0 auto;
    }

    /* Composition A (plate-right) & Composition C (plate-left) */
    .part-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr);
      gap: clamp(1.4rem, 3.8vw, 3.8rem);
      align-items: center;
    }

    .part-split.plate-left {
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
    }

    .part-split.plate-left .part-visual-col { order: -1; }

    /* Composition B (panorama-top) */
    .part-panorama {
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 2.5vh, 1.85rem);
    }

    .part-panorama .gallery-stage {
      aspect-ratio: 21 / 8.2;
      max-height: 44vh;
    }

    .panorama-body {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.15fr);
      gap: clamp(1.3rem, 3.8vw, 3.5rem);
      align-items: start;
    }

    /* Gallery Plate Frame (Museum 21:9 Artwork + Animated Architectural Emblem) */
    .part-visual-col {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
    }

    .gallery-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.2;
      border-radius: 0.65rem;
      overflow: hidden;
      border: 1px solid var(--rule-strong);
      background:
        radial-gradient(ellipse at 35% 35%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 68%),
        var(--bg-elev);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
    }

    html[data-surface="light"] .gallery-stage {
      box-shadow: 0 18px 48px rgba(20, 18, 14, 0.12);
    }

    .gallery-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.65s var(--ease-out), transform 9s ease-out;
    }

    .gallery-img.active {
      opacity: 1;
      transform: scale(1.0);
    }

    .gallery-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9, 9, 11, 0.06) 0%, rgba(9, 9, 11, 0.04) 55%, rgba(9, 9, 11, 0.72) 100%);
      pointer-events: none;
    }

    .emblem-badge {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: rgba(9, 9, 11, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 240, 232, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.56rem;
      color: color-mix(in srgb, var(--accent) 52%, #f6f2ea);
      pointer-events: none;
    }

    .emblem-badge svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gallery-caption-bar {
      position: absolute;
      left: 0.9rem;
      right: 0.9rem;
      bottom: 0.78rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 2;
    }

    .gallery-essay-title {
      font-family: var(--font-serif);
      font-size: 0.92rem;
      color: #f6f2ea;
      text-decoration: none;
      line-height: 1.35;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
    }

    .gallery-essay-title:hover { text-decoration: underline; }

    .gallery-open-pill {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #f6f2ea;
      background: rgba(9, 9, 11, 0.62);
      border: 1px solid rgba(244, 240, 232, 0.26);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .gallery-open-pill:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #09090b;
    }

    /* 3-Plate Switcher Strip */
    .plate-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.52rem;
    }

    .plate-tab {
      appearance: none;
      text-align: left;
      padding: 0.56rem 0.72rem;
      border-radius: 0.45rem;
      border: 1px solid var(--rule);
      background: var(--bg-elev);
      color: var(--ink-soft);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      transition: border-color 0.22s ease, background 0.22s ease, color 0.22s ease;
      min-width: 0;
    }

    .plate-tab:hover {
      background: var(--bg-elev-hover);
      border-color: var(--rule-strong);
      color: var(--ink);
    }

    .plate-tab.active {
      border-color: color-mix(in srgb, var(--accent) 68%, transparent);
      background: color-mix(in srgb, var(--accent) 11%, var(--bg-elev));
      color: var(--ink);
    }

    .plate-tab-meta {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
    }

    .plate-tab.active .plate-tab-meta { color: var(--accent); }

    .plate-tab-name {
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.32;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Part Copy & Dual-Cut Spec */
    .part-title {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 2.65rem;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-wrap: balance;
    }

    html[data-lang="zh"] .part-title {
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    .part-epigraph {
      margin: 0.78rem 0 0;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.08rem;
      line-height: 1.62;
      color: var(--ink-soft);
      padding-left: 0.9rem;
      border-left: 2px solid color-mix(in srgb, var(--accent) 65%, transparent);
    }

    html[data-lang="zh"] .part-epigraph {
      font-style: normal;
      line-height: 1.75;
    }

    .dual-cut {
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.78rem;
    }

    .cut-box {
      padding: 0.84rem 0.98rem;
      border: 1px solid var(--rule);
      border-radius: 0.45rem;
      background: var(--bg-elev);
    }

    .cut-box.boundary {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--rule));
      background: color-mix(in srgb, var(--accent) 6%, var(--bg-elev));
    }

    .cut-label {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 0.4rem;
      font-weight: 600;
    }

    .cut-box.boundary .cut-label { color: var(--accent); }

    .cut-text {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.58;
      color: var(--ink-soft);
    }

    html[data-lang="zh"] .cut-text { line-height: 1.72; }

    .part-footer {
      margin-top: 1.15rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--rule);
    }

    .part-counts {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .part-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 0.4rem 0.86rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .part-cta:hover {
      background: var(--accent);
      color: #09090b;
    }

    /* =========================================================================
       SLIDE 20: INTERACTIVE INDEX OF PREMISES EXPLORER
       ========================================================================= */
    .index-shell {
      width: 100%;
      max-width: min(94vw, 90rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .index-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }

    .index-section-chips {
      display: flex;
      gap: 1.15rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--ink-soft);
    }

    .index-section-chips strong {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--ink);
      margin-right: 0.28rem;
    }

    .label-bar {
      display: flex;
      height: 0.34rem;
      border-radius: 999px;
      overflow: hidden;
      gap: 2px;
      background: var(--rule);
    }

    .label-bar-seg {
      height: 100%;
      opacity: 0.45;
      transition: opacity 0.25s ease;
      cursor: pointer;
    }

    .label-bar-seg.active, .label-bar-seg:hover { opacity: 1; }

    .label-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .label-pill {
      appearance: none;
      border: 1px solid var(--rule);
      background: var(--bg-elev);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.38rem 0.78rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
    }

    .label-pill:hover {
      border-color: var(--rule-strong);
      color: var(--ink);
    }

    .label-pill.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .label-pill-dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
    }

    .premise-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .premise-card {
      padding: 1rem 1.15rem;
      border: 1px solid var(--rule);
      border-radius: 0.5rem;
      background: var(--bg-elev);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.5rem;
      transition: border-color 0.2s ease, transform 0.2s var(--ease-out), background 0.2s ease;
    }

    .premise-card:hover {
      border-color: var(--rule-strong);
      background: var(--bg-elev-hover);
      transform: translateY(-2px);
    }

    .premise-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.65rem;
    }

    .premise-card-title {
      font-family: var(--font-serif);
      font-size: 1.04rem;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
    }

    .premise-card-meta {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .premise-card-body {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.58;
      color: var(--ink-soft);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================================================================
       SLIDE 21: THREE WAYS TO ENTER (CLOSING PORTAL)
       ========================================================================= */
    .portal-shell {
      width: 100%;
      max-width: min(94vw, 90rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(1.1rem, 2.8vh, 1.85rem);
    }

    .portal-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.12rem;
      color: var(--accent);
      margin: 0;
    }

    html[data-lang="zh"] .portal-quote { font-style: normal; }

    .ways-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.9fr 0.9fr;
      gap: 1rem;
    }

    .way-card {
      padding: 1.3rem 1.45rem;
      border: 1px solid var(--rule);
      border-radius: 0.65rem;
      background: rgba(9, 9, 11, 0.52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.9rem;
    }

    .way-num {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .way-title {
      font-family: var(--font-serif);
      font-size: 1.38rem;
      font-weight: 600;
      margin: 0.38rem 0 0.5rem;
      color: var(--ink);
    }

    .way-desc {
      margin: 0;
      font-size: 0.87rem;
      line-height: 1.62;
      color: var(--ink-soft);
    }

    .mini-parts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.78rem;
    }

    .mini-part-pill {
      font-size: 0.72rem;
      padding: 0.26rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      text-decoration: none;
      background: var(--bg-elev);
      transition: all 0.2s ease;
    }

    .mini-part-pill:hover {
      border-color: var(--accent);
      color: var(--ink);
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .portal-bottom {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--rule);
    }

    /* =========================================================================
       BOTTOM RAIL & 21-SLIDE SEGMENTED PIPS
       ========================================================================= */
    .bottombar {
      flex-shrink: 0;
      height: 3rem;
      padding: 0 clamp(1rem, 3vw, 3.2rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-top: 1px solid var(--rule);
      background: var(--chrome-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 20;
      position: relative;
    }

    #autoplay-bar {
      position: absolute;
      top: -1px;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--accent);
      transition: width 0.12s linear;
    }

    .slide-meta {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      flex: 1;
    }

    .slide-num {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .slide-label {
      font-size: 0.78rem;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pip-rail {
      display: flex;
      align-items: center;
      gap: 0.28rem;
      flex-shrink: 0;
    }

    .pip-gap {
      width: 0.65rem;
      height: 1px;
      background: var(--rule-strong);
      margin: 0 0.2rem;
    }

    .pip {
      appearance: none;
      border: none;
      padding: 0.5rem 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .pip span {
      display: block;
      width: 0.4rem;
      height: 0.26rem;
      border-radius: 999px;
      background: var(--rule-strong);
      transition: width 0.3s var(--ease-out), background-color 0.3s ease;
    }

    .pip:hover span { background: var(--ink-soft); }

    .pip.active span {
      width: 1.45rem;
      background: var(--accent);
    }

    .nav-btns {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
      flex: 1;
    }

    .nav-circle {
      appearance: none;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      border: 1px solid var(--rule-strong);
      background: transparent;
      color: var(--ink);
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .nav-circle:hover:not(:disabled) {
      background: var(--bg-elev-hover);
      border-color: var(--ink);
    }

    .nav-circle:disabled {
      opacity: 0.26;
      cursor: default;
    }

    /* =========================================================================
       21-SLIDE VISUAL OVERVIEW DRAWER (O Key)
       ========================================================================= */
    #overview-drawer {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(9, 9, 11, 0.86);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      color: #f4f0e8;
      display: flex;
      flex-direction: column;
      padding: clamp(1.25rem, 3vw, 2.8rem);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s var(--ease-out);
      overflow-y: auto;
    }

    #overview-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .overview-inner {
      width: 100%;
      max-width: min(94vw, 88rem);
      margin: 0 auto;
    }

    .overview-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(244, 240, 232, 0.14);
      margin-bottom: 1.4rem;
    }

    .overview-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      margin: 0;
    }

    .overview-group-title {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(244, 240, 232, 0.5);
      margin: 1.15rem 0 0.65rem;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(14.5rem, 1fr));
      gap: 0.6rem;
    }

    .overview-item {
      appearance: none;
      text-align: left;
      padding: 0.72rem 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(244, 240, 232, 0.12);
      background: rgba(244, 240, 232, 0.035);
      color: #f4f0e8;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .overview-item:hover {
      background: rgba(244, 240, 232, 0.08);
      border-color: rgba(244, 240, 232, 0.28);
      transform: translateY(-1px);
    }

    .overview-item.current {
      border-color: var(--item-accent, #34b87c);
      background: color-mix(in srgb, var(--item-accent, #34b87c) 15%, rgba(244, 240, 232, 0.04));
    }

    .overview-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      color: var(--item-accent, #34b87c);
    }

    .overview-item-name {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      line-height: 1.32;
    }

    /* Animated SVG Hairline Motion */
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slowPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    .svg-spin { transform-origin: 24px 24px; animation: slowSpin 28s linear infinite; }
    .svg-pulse { animation: slowPulse 4.2s ease-in-out infinite; }

    .way-meta-list {
      margin-top: 0.9rem;
      padding-top: 0.78rem;
      border-top: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .way-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
    }

    .way-meta-row strong {
      font-family: var(--font-serif);
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .split-grid > *,
    .part-split > *,
    .panorama-body > *,
    .ways-grid > *,
    .severance-grid > *,
    .dual-cut > *,
    .premise-grid > * {
      min-width: 0;
    }

    /* =========================================================================
       RESPONSIVE TUNING
       ========================================================================= */
    @media (max-width: 960px) {
      html { font-size: 15px; }
      .display-title { font-size: clamp(1.75rem, 6vw, 2.5rem); }
      .part-title { font-size: clamp(1.6rem, 5.5vw, 2.3rem); }
      .hero-title { font-size: clamp(2.2rem, 8vw, 3.4rem); }
      .split-grid,
      .part-split,
      .part-split.plate-left,
      .panorama-body,
      .ways-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .part-split.plate-left .part-visual-col { order: 0; }
      .slide { justify-content: flex-start; }
      .lattice-wrap { height: 340px; }
      .pip-rail { display: none; }
      .act-crumb, .topbar-sep { display: none; }
    }

    @media (max-width: 680px) {
      html { font-size: 14.5px; }
      .topbar { padding: 0 14px; }
      .bottombar { padding: 0 14px; }
      .slide { padding: 16px 16px 24px; }
      .hero-frame { padding: 20px 18px 24px; }
      .hero-top-meta { flex-wrap: wrap; gap: 6px; font-size: 0.64rem; }

        helm: `<g class="svg-spin"><circle cx="24" cy="24" r="11" ${s}/><line x1="24" y1="6" x2="24" y2="42" ${s} opacity="0.6"/><line x1="6" y1="24" x2="42" y2="24" ${s} opacity="0.6"/></g><circle cx="24" cy="24" r="3" fill="currentColor"/>`,
      };
      return `<svg viewBox="0 0 48 48" aria-hidden="true">${shapes[kind] || shapes.orthogonal}</svg>`;
    }

    /* =========================================================================
       21-SLIDE SEQUENCE DEFINITION
       ========================================================================= */
    const SLIDES = [
      {
        id: 'cover', act: 1, surface: 'dark', accent: '#34b87c', duration: 9.5,
        shortTitle: { en: 'Not a Theory of Everything', zh: '非万物之理' },
      },
      {
        id: 'prior', act: 1, surface: 'light', accent: '#25855a', duration: 11.5,
        shortTitle: { en: 'The Single Prior', zh: '唯一不可化约的先验' },
      },
      {
        id: 'coin', act: 1, surface: 'dark', accent: '#d4a853', duration: 11.5,
        shortTitle: { en: 'First-Person & Causality', zh: '第一人称与因果' },
      },
      {
        id: 'orthogonal', act: 1, surface: 'light', accent: '#25855a', duration: 12.0,
        shortTitle: { en: 'The Orthogonal Cut', zh: '正交切分' },
      },
      {
        id: 'lattice', act: 1, surface: 'dark', accent: '#34b87c', duration: 13.0,
        shortTitle: { en: 'The Living Book Lattice', zh: '活书突触晶格' },
      },
      ...(BOOK_DATA.parts || []).map((part) => {
        const spec = PART_SPECS[part.slug] || { surface: 'dark', layout: 'plate-right', accent: '#34b87c', emblem: 'orthogonal' };
        return {
          id: `part-${part.slug}`,
          kind: 'part',
          partSlug: part.slug,
          act: 2,
          surface: spec.surface,
          accent: spec.accent,
          duration: 10.5,
          shortTitle: {
            en: `${part.labelEn} · ${part.titleEn}`,
            zh: `${part.labelZh} · ${part.titleZh}`,
          },
        };
      }),
      {
        id: 'index', act: 3, surface: 'light', accent: '#2563eb', duration: 13.0,
        shortTitle: { en: 'Index of Premises', zh: '前提索引' },
      },
      {
        id: 'enter', act: 3, surface: 'dark', accent: '#34b87c', duration: 999,
        shortTitle: { en: 'Three Ways to Enter', zh: '三种进入方式' },
      },
    ];

    /* =========================================================================
       APPLICATION STATE
       ========================================================================= */
    const params = new URLSearchParams(location.search);
    const initLang = params.get('lang') === 'zh'
      ? 'zh'
      : params.get('lang') === 'en'
        ? 'en'
        : ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');

    const initSlide = (() => {
      const h = location.hash.replace(/^#/, '');
      if (!h) return 0;
      const byId = SLIDES.findIndex((s) => s.id === h);
      if (byId >= 0) return byId;
      const num = parseInt(h, 10);
      if (!Number.isNaN(num)) return Math.max(0, Math.min(SLIDES.length - 1, num - 1));
      return 0;
    })();

    const state = {
      lang: initLang,
      slide: initSlide,
      autoplay: false,
      autoElapsed: 0,
      overviewOpen: false,
      // Per-part selected cover index (0..2)
      selectedPlate: Object.fromEntries((BOOK_DATA.parts || []).map((p) => [p.slug, 0])),
      // Slide 4 orthogonal angle (0..90 deg)
      orthoAngle: 90,
      orthoTarget: 90,
      orthoDragging: false,
      // Slide 5 lattice interactive state
      latticeHover: -1,
      latticePulses: [],
      // Slide 2 ripple pool
      ripples: [],
      // Slide 20 active premise label index
      activeLabelIdx: 0,
      time: 0,
    };

    const dom = {
      brandName: document.getElementById('brand-name'),
      actCrumb: document.getElementById('act-crumb'),
      btnLang: document.getElementById('btn-lang'),
      btnOverview: document.getElementById('btn-overview'),
      lblOverview: document.getElementById('lbl-overview'),
      btnAuto: document.getElementById('btn-auto'),
      lblAuto: document.getElementById('lbl-auto'),
      btnFs: document.getElementById('btn-fs'),
      stage: document.getElementById('stage'),
      ambientCanvas: document.getElementById('ambient-canvas'),
      slideMount: document.getElementById('slide-mount'),
      autoplayBar: document.getElementById('autoplay-bar'),
      slideNum: document.getElementById('slide-num'),
      slideLabel: document.getElementById('slide-label'),
      pipRail: document.getElementById('pip-rail'),
      btnPrev: document.getElementById('btn-prev'),
      btnNext: document.getElementById('btn-next'),
      overviewDrawer: document.getElementById('overview-drawer'),
      overviewTitle: document.getElementById('overview-title'),
      overviewContent: document.getElementById('overview-content'),
      btnCloseOverview: document.getElementById('btn-close-overview'),
      lblClose: document.getElementById('lbl-close'),
    };

    /* =========================================================================
       HELPERS & PRELOADING
       ========================================================================= */
    const esc = (s) => String(s ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');

    const preloaded = new Set();
    function preloadUrl(url) {
      if (!url || preloaded.has(url)) return;
      preloaded.add(url);
      const img = new Image();
      img.decoding = 'async';
      img.src = url;
    }

    function preloadAdjacent(idx) {
      [idx - 1, idx, idx + 1, idx + 2].forEach((i) => {
        if (i < 0 || i >= SLIDES.length) return;
        const sl = SLIDES[i];
        if (sl.id === 'cover') preloadUrl(BOOK_DATA.heroCoverUrl);
        if (sl.kind === 'part') {
          const part = PARTS_BY_SLUG.get(sl.partSlug);
          if (part && part.featured) part.featured.forEach((f) => preloadUrl(f.coverUrl));
        }
      });
    }

    function fmtNum(n) {
      return Number(n || 0).toLocaleString('en-US');
    }

    /* =========================================================================
       SLIDE HTML TEMPLATES
       ========================================================================= */
    function renderSlideHtml(sl) {
      const L = state.lang;
      const u = UI[L];

      if (sl.id === 'cover') {
        const title = L === 'zh' ? '非万物之理' : 'Not a Theory of Everything';
        const sub = L === 'zh'
          ? '非定论的心智指南——一个心智如实溯源与体验实在的数字化记忆。'
          : 'A Non-Definitive Guide for the Mind — the digitized memory of a Mind tracing and experiencing reality as is.';
        return `
          <section class="slide hero-slide">
            <img class="hero-backdrop" id="hero-bg" src="${esc(BOOK_DATA.heroCoverUrl)}" alt="" loading="eager" decoding="async">
            <div class="hero-scrim"></div>
            <div class="hero-frame">
              <div class="hero-top-meta">
                <span>${esc(u.coverDate)}</span>
                <span>${esc(u.coverHint)}</span>
              </div>
              <div class="hero-center">
                <p class="kicker"><span class="kicker-rule"></span>${L === 'zh' ? '活书全景导览' : 'INTERACTIVE MONOGRAPH TOUR'}</p>
                <h1 class="hero-title">${esc(title)}</h1>
                <p class="hero-sub">${esc(sub)}</p>
                <div class="hero-actions">
                  <button class="btn-primary" type="button" data-action="next">${esc(u.beginTour)}</button>
                  <button class="btn-ghost" type="button" data-action="jump-parts">${esc(u.jumpParts)}</button>

                </div>
              </div>
              <div class="hero-stats">
                <div class="stat-cell"><span class="stat-num">${fmtNum(BOOK_DATA.partCount)}</span><span class="stat-lbl">${esc(u.statParts)}</span></div>
                <div class="stat-cell"><span class="stat-num">${fmtNum(BOOK_DATA.postCount)}</span><span class="stat-lbl">${esc(u.statEssays)}</span></div>
                <div class="stat-cell"><span class="stat-num">${fmtNum(BOOK_DATA.linkCount)}</span><span class="stat-lbl">${esc(u.statLinks)}</span></div>
                <div class="stat-cell"><span class="stat-num">${fmtNum(BOOK_DATA.premiseCount)}</span><span class="stat-lbl">${esc(u.statPremises)}</span></div>
              </div>
            </div>
          </section>`;
      }

      if (sl.id === 'prior') {
        const rows = L === 'zh'
          ? [
              ['离散与连续', '每一次区分划出真实边界；下一次行动在先前痕迹塑就的场域中再次划定。'],
              ['中心与痕迹', '有界即有位。先前塑就后来，从不倒流——这便是时间之箭与因果方向。'],
              ['别无第二重地基', '其后一切概念皆为可修订的推导，而非冻结在活边缘之上的教条。'],
            ]
          : [
              ['Discreteness & Continuity', 'Each cut draws a real boundary; the next act draws again inside a field shaped by earlier acts.'],
              ['Center & Trace', 'Boundedness entails location. Earlier acts shape later ones, never the reverse: the arrow of time.'],
              ['No Second Ground', 'Every concept that follows is a revisable derivation, never a doctrine frozen above the living edge.'],
            ];
        return `
          <section class="slide pass-through">
            <div class="split-grid">
              <div class="interactive-island">
                <p class="kicker"><span class="kicker-rule"></span>${L === 'zh' ? '01 · 唯一不可化约的先验' : '01 · THE SINGLE IRREDUCIBLE PRIOR'}</p>
                <h1 class="display-title">${L === 'zh' ? '自我区分的活动正在发生——无因，不息。' : 'Self-distinguishing activity occurs — uncaused, unceasing.'}</h1>
                <p class="lead-prose">${L === 'zh'
                  ? '这不是等待外部证实的假说。任何否认都已在施演它——区分真与假、此说与彼说。它之下别无地基，也无需地基。'
                  : 'This is not a hypothesis waiting for outside proof. Denying it already performs it: distinguishing true from false, this claim from that one. No ground lies beneath it, and none is required.'}</p>
                <div class="derivation-list">
                  ${rows.map(([t, d]) => `<div class="derivation-row"><span class="derivation-term">${esc(t)}</span><span class="derivation-desc">${esc(d)}</span></div>`).join('')}
                </div>
              </div>
              <div style="display:flex;align-items:flex-end;justify-content:center;min-height:46vh;">
                <span style="font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.1em;color:var(--ink-muted);border:1px solid var(--rule);padding:6px 14px;border-radius:999px;background:var(--chrome-bg);">${esc(u.rippleHint)}</span>
              </div>
            </div>
          </section>`;
      }

      if (sl.id === 'coin') {
        return `
          <section class="slide">
            <div class="coin-layout">
              <div class="coin-header">
                <p class="kicker"><span class="kicker-rule"></span>${L === 'zh' ? '02 · 一体两面' : '02 · TWO SIDES OF ONE COIN'}</p>
                <h1 class="display-title">${L === 'zh' ? '第一人称视角与因果，是同一枚硬币的两面。' : 'First-person perspective and causality are two sides of one coin.'}</h1>
                <p class="lead-prose">${L === 'zh'
                  ? '在每个具体当下，心智登记有限的一组区分；因果则是向过往之因与未来之果无尽敞开的潜能。所有混乱皆生于将两者强行撕裂。'
                  : 'At every concrete moment, the Mind registers a finite set of distinctions; causality is the open potential extending endlessly into past causes and future effects. Incoherence begins the moment the two are severed.'}</p>
              </div>

              <div class="coin-stage-box">
                <div class="coin-pole">
                  <div class="coin-pole-tag">${L === 'zh' ? '当下切面' : 'PRESENT SLICE'}</div>
                  <h2 class="coin-pole-name">${L === 'zh' ? '第一人称视角' : 'First-Person Look'}</h2>
                  <p class="coin-pole-sub">${L === 'zh' ? '开放、高维、每刻有限却永不封闭的觉知现场。' : 'Open, ultra-high-dimensional awareness — finite at each instant, never sealed.'}</p>
                </div>

                <svg class="coin-ribbon-svg" viewBox="0 0 900 200" preserveAspectRatio="none" aria-hidden="true">
                  <defs>
                    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#34b87c" stop-opacity="0.85"/>
                      <stop offset="50%" stop-color="#d4a853" stop-opacity="0.95"/>
                      <stop offset="100%" stop-color="#4f9cf0" stop-opacity="0.85"/>
                    </linearGradient>
                  </defs>
                  <path d="M240,100 C330,22 410,178 450,100 C490,22 570,178 660,100" fill="none" stroke="url(#coinGrad)" stroke-width="1.6" opacity="0.85"/>
                  <path d="M240,100 C330,178 410,22 450,100 C490,178 570,22 660,100" fill="none" stroke="url(#coinGrad)" stroke-width="1.1" stroke-dasharray="4 6" opacity="0.5"/>
                  <circle cx="450" cy="100" r="5" fill="#d4a853" class="svg-pulse"/>
                  <circle cx="450" cy="100" r="24" fill="none" stroke="#d4a853" stroke-width="0.8" opacity="0.32"/>
                </svg>

                <div class="coin-pole right">
                  <div class="coin-pole-tag">${L === 'zh' ? '痕迹不对称' : 'TRACE ASYMMETRY'}</div>
                  <h2 class="coin-pole-name">${L === 'zh' ? '活态因果' : 'Living Causality'}</h2>
                  <p class="coin-pole-sub">${L === 'zh' ? '每一次 +1 皆穿越不可逆摩擦与能耗代价。' : 'Every +1 is an irreversible intervention paying real energy costs in friction.'}</p>
                </div>
              </div>

              <div class="severance-grid">
                <div class="severance-card" style="--card-tone:#e05a5a;">
                  <p class="severance-title">${L === 'zh' ? '割裂之一 · 剥离第一人称的因果' : 'SEVERANCE A · CAUSALITY WITHOUT FIRST PERSON'}</p>
                  <p class="severance-body">${L === 'zh'
                    ? '催生抽干观察者的发条宇宙、封闭的万物之理幻想、推卸责任的决定论宿命，以及人造的“意识难问题”。'
                    : 'Breeds an imaginary clockwork cosmos devoid of an observer, closed Theory of Everything fantasies, deterministic fatalism, and the artificial "hard problem of consciousness."'}</p>
                </div>
                <div class="severance-card" style="--card-tone:#d4a853;">
                  <p class="severance-title">${L === 'zh' ? '割裂之二 · 脱离因果的第一人称' : 'SEVERANCE B · FIRST PERSON WITHOUT CAUSALITY'}</p>
                  <p class="severance-body">${L === 'zh'
                    ? '令觉知脱离现实摩擦跌入贫瘠虚空——滋生唯我论、自我缠绕的情绪死循环，以及不付能耗代价的空想。'
                    : 'Unmoors awareness from real friction into a sterile void — producing solipsism, meta-emotional loops, and magical thinking expecting outcomes without paying energy costs.'}</p>
                </div>
              </div>
            </div>
          </section>`;
      }

      if (sl.id === 'orthogonal') {
        return `
          <section class="slide">
            <div class="split-grid">
              <div>
                <p class="kicker"><span class="kicker-rule"></span>${L === 'zh' ? '03 · 溯源之法' : '03 · THE METHOD'}</p>
                <h1 class="display-title">${L === 'zh' ? '不是反万物之理，而是正交切分。' : 'Not an Anti-ToE. An orthogonal cut.'}</h1>
                <p class="lead-prose">${L === 'zh'
                  ? '“反”仍困在同一条一维坐标轴上，寄生于它所反对的对象。正交维度的内积为零（u · v = 0）：打开新的自由度，而不摧毁低维中依然好用的脚手架。'
                  : 'An "anti" stance remains trapped on the same one-dimensional axis, parasitic on what it opposes. Orthogonal dimensions have inner product zero (u · v = 0): opening new degrees of freedom without destroying useful lower-dimensional scaffolding.'}</p>
                <div class="dual-cut" style="margin-top:22px;">
                  <div class="cut-box">
                    <p class="cut-label">${esc(u.usefulWithin)}</p>
                    <p class="cut-text">${L === 'zh'
                      ? '物理、数学、经济学与制度在其前提范围内高度有效；切分从不宣判它们“错误”。'

                  </div>
                  <div class="cut-box boundary">
                    <p class="cut-label">${esc(u.boundaryBegins)}</p>
                    <p class="cut-text">${L === 'zh'
                      ? '把每一项信念追溯回其所依赖的前提：前提所在之处，正是它不再普适的边界。'
                      : 'Tracing each belief back to its foundational premise locates the exact boundary where universality ends.'}</p>
                  </div>
                </div>
              </div>

              <div class="ortho-panel">
                <div class="ortho-canvas-wrap" id="ortho-wrap">
                  <canvas id="ortho-canvas"></canvas>
                </div>
                <div class="ortho-controls">
                  <input class="ortho-slider" id="ortho-slider" type="range" min="0" max="90" step="1" value="${Math.round(state.orthoAngle)}" aria-label="Orthogonal angle">
                  <span class="ortho-readout" id="ortho-readout">θ = 90° · u·v = 0.00</span>
                </div>

              </div>
            </div>
          </section>`;
      }

      if (sl.id === 'lattice') {
        const pairTotal = (BOOK_DATA.partCount * (BOOK_DATA.partCount - 1)) / 2;
        let connectedPairs = 0;
        for (let i = 0; i < BOOK_DATA.partCount; i++) {
          for (let j = i + 1; j < BOOK_DATA.partCount; j++) {
            if ((BOOK_DATA.partMatrix?.[i]?.[j] || 0) > 0) connectedPairs++;
          }
        }
        return `
          <section class="slide">
            <div class="split-grid">
              <div>
                <p class="kicker"><span class="kicker-rule"></span>${L === 'zh' ? '04 · 外化记忆晶格' : '04 · EXTERNALIZED MEMORY LATTICE'}</p>
                <h1 class="display-title">${L === 'zh' ? '清醒切分，突触互联，睡眠重绘。' : 'Waking cuts. Synaptic links. Sleep consolidation.'}</h1>
                <p class="lead-prose">${L === 'zh'
                  ? '这不是一部写完即凝固的静态论著，也不是按日期堆叠的博客。每一篇随笔是在具体摩擦中落下的清醒切分，篇间相对链接是突触，每一次新的识见都会沿链接回传，重绘早先痕迹，使整座记忆随心智前行保持逻辑自洽。'

                  <div>

      if (sl.kind === 'part') {

        const pIdx = state.selectedPlate[part.slug] || 0;
        const featured = part.featured || [];
        const activeEssay = featured[pIdx] || featured[0];
        const label = L === 'zh' ? part.labelZh : part.labelEn;
        const title = L === 'zh' ? part.titleZh : part.titleEn;
        const epigraph = L === 'zh' ? part.subZh : part.subEn;

          <div class="part-visual-col">

              <div class="emblem-badge">${renderEmblemSvg(spec.emblem)}</div>

        if (spec.layout === 'panorama-top') {

            <section class="slide">
              <div class="part-shell part-panorama">

      if (sl.id === 'index') {

      }

      if (sl.id === 'enter') {
        const sections = BOOK_DATA.indexStats?.sections || [];
        const labels = BOOK_DATA.indexStats?.labels || [];
        const total = BOOK_DATA.premiseCount || 1;
        return `

                <h1 class="display-title" style="margin-top:10px;">${L === 'zh'
                  ? '进入这部活书的三种路径。'

              </div>

              <div class="ways-grid">
                <div class="way-card">
                  <div>

                    <h2 class="way-title">${L === 'zh' ? '十四卷目录' : 'The Fourteen Parts'}</h2>
                    <p class="way-desc">${L === 'zh'
                      ? '从目录进入某一种被普遍奉为真理的信念，随笔依写作顺序排列，每一卷都保留着溯源展开的先后。'
                      : 'Enter any commonly held belief from the contents; essays stay in the order written so each part preserves how the tracing unfolded.'}</p>
                    <div class="mini-parts">
                      ${(BOOK_DATA.parts || []).map((p) => {
                        const sh = PART_SHORT[p.slug] || { en: p.labelEn, zh: p.labelZh };
                        return `<a class="mini-part-pill" href="${esc(p.url)}">${esc(sh[L])}</a>`;

                    </div>
                  </div>
                  <a class="part-cta" href="../#contents">${esc(u.way1Btn)}</a>
                </div>

                <div class="way-card">
                  <div>
                    <span class="way-num">${L === 'zh' ? '路径 02 · 按名阅读' : 'WAY 02 · BY NAME'}</span>
                    <h2 class="way-title">${L === 'zh' ? '前提索引' : 'Index of Premises'}</h2>
                    <p class="way-desc">${L === 'zh'
                      ? `直接查找 ${fmtNum(BOOK_DATA.premiseCount)} 个人物、理论与概念，一行看清各自前提止于何处，并跳转全部关联随笔。`
                      : `Look up ${fmtNum(BOOK_DATA.premiseCount)} figures, theories, and concepts to see where each premise ends, with direct links to every tracing essay.`}</p>
                    <div class="label-bar" style="margin-top:14px;" aria-hidden="true">
                      ${labels.map((lb) => `<div class="label-bar-seg active" style="width:${((lb.count / total) * 100).toFixed(2)}%;background:${LABEL_COLORS[lb.key] || '#34b87c'};"></div>`).join('')}
                    </div>
                    <div class="way-meta-list">
                      ${sections.map((s) => `<div class="way-meta-row"><span>${esc(L === 'zh' ? s.zh : s.en)}</span><strong>${s.count}</strong></div>`).join('')}

                      : `Browse all ${fmtNum(BOOK_DATA.postCount)} essays chronologically and watch this digitized memory grow, page by page, since February 2026.`}</p>
                    <div class="way-meta-list">
                      <div class="way-meta-row"><span>${L === 'zh' ? '起点' : 'Origin'}</span><strong>${L === 'zh' ? '2026 年 2 月' : 'Feb 2026'}</strong></div>
                      <div class="way-meta-row"><span>${L === 'zh' ? '随笔总数' : 'Essays'}</span><strong>${fmtNum(BOOK_DATA.postCount)}</strong></div>
                      <div class="way-meta-row"><span>${L === 'zh' ? '语言排版' : 'Editions'}</span><strong>${L === 'zh' ? '中英双语' : 'EN / 中文'}</strong></div>
                    </div>
                  </div>
