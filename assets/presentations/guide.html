                </div>
              </div>

              <div class="portal-bottom">
                <span style="font-family:var(--font-mono);font-size:0.72rem;color:var(--ink-muted);letter-spacing:0.08em;">
                  ${fmtNum(BOOK_DATA.partCount)} ${esc(u.statParts)} · ${fmtNum(BOOK_DATA.postCount)} ${esc(u.statEssays)} · ${fmtNum(BOOK_DATA.linkCount)} ${esc(u.statLinks)} · ${fmtNum(BOOK_DATA.premiseCount)} ${esc(u.statPremises)}
                </span>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                  <button class="btn-ghost" type="button" data-action="overview">${esc(u.openOverview)}</button>
                  <button class="btn-ghost" type="button" data-action="replay">${esc(u.replay)}</button>
                </div>
              </div>
            </div>
          </section>`;
      }

      return '';
    }

    /* =========================================================================
       SLIDE-SPECIFIC INTERACTIVE CANVASES (Slide 2, Slide 4, Slide 5, Slide 21)
       ========================================================================= */
    const ambCanvas = dom.ambientCanvas;
    const ambCtx = ambCanvas.getContext('2d');
    let ambW = 0, ambH = 0, ambDpr = 1;
    const remScale = () => Math.max(0.85, parseFloat(getComputedStyle(document.documentElement).fontSize) / 16);

    function resizeAmbient() {
      const rect = dom.stage.getBoundingClientRect();
      ambW = Math.max(1, rect.width);
      ambH = Math.max(1, rect.height);
      ambDpr = Math.min(window.devicePixelRatio || 1, 2);
      ambCanvas.width = Math.round(ambW * ambDpr);
      ambCanvas.height = Math.round(ambH * ambDpr);
      ambCtx.setTransform(ambDpr, 0, 0, ambDpr, 0, 0);
    }

    function spawnRipple(x, y, strong = false) {
      state.ripples.push({
        x, y,
        r: 4,
        maxR: strong ? Math.min(ambW, ambH) * 0.44 : Math.min(ambW, ambH) * 0.28,
        speed: strong ? 72 : 52,
        alpha: strong ? 0.55 : 0.34,
        born: state.time,
      });
      if (state.ripples.length > 26) state.ripples.shift();
    }

    let lastRippleSpawn = 0;
    ambCanvas.addEventListener('pointermove', (e) => {
      if (SLIDES[state.slide]?.id !== 'prior') return;
      if (state.time - lastRippleSpawn < 0.28) return;
      const rect = ambCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (x > ambW * 0.38) {
        lastRippleSpawn = state.time;
        spawnRipple(x, y, false);
      }
    });

    ambCanvas.addEventListener('pointerdown', (e) => {
      if (SLIDES[state.slide]?.id !== 'prior') return;
      const rect = ambCanvas.getBoundingClientRect();
      spawnRipple(e.clientX - rect.left, e.clientY - rect.top, true);
    });

    function drawAmbientFrame(dt) {
      ambCtx.clearRect(0, 0, ambW, ambH);
      const sl = SLIDES[state.slide];
      if (!sl) return;

      // Slide 2: Self-Distinguishing Ripple & Cartographic Field (Light Paper)
      if (sl.id === 'prior') {
        const cx = ambW > 960 ? ambW * 0.72 : ambW * 0.5;
        const cy = ambH > 600 ? ambH * 0.5 : ambH * 0.65;

        // Delicate cartographic registration lines
        ambCtx.save();
        ambCtx.strokeStyle = 'rgba(21, 20, 18, 0.065)';
        ambCtx.lineWidth = 1;
        ambCtx.beginPath();
        ambCtx.moveTo(cx, 24); ambCtx.lineTo(cx, ambH - 24);
        ambCtx.moveTo(ambW * 0.45, cy); ambCtx.lineTo(ambW - 24, cy);
        ambCtx.stroke();

        // Living steady concentric waves from center
        const maxRad = Math.min(ambW * 0.36, ambH * 0.44);
        for (let i = 0; i < 6; i++) {
          const phase = ((state.time * 0.22 + i / 6) % 1);
          const r = 10 + phase * maxRad;
          const a = (1 - phase) * 0.32;
          ambCtx.strokeStyle = `rgba(37, 133, 90, ${a.toFixed(3)})`;
          ambCtx.lineWidth = 1.1;
          ambCtx.beginPath();
          ambCtx.arc(cx, cy, r, 0, Math.PI * 2);
          ambCtx.stroke();
        }

        // Core living locus dot
        const s = remScale();
        ambCtx.fillStyle = '#25855a';
        ambCtx.beginPath();
        ambCtx.arc(cx, cy, 4 * s, 0, Math.PI * 2);
        ambCtx.fill();

        // User-drawn discrete trace ripples
        for (let i = state.ripples.length - 1; i >= 0; i--) {
          const rp = state.ripples[i];
          rp.r += rp.speed * dt;
          const p = rp.r / rp.maxR;
          if (p >= 1) { state.ripples.splice(i, 1); continue; }
          const a = rp.alpha * (1 - p) * (1 - p);
          ambCtx.strokeStyle = `rgba(21, 20, 18, ${(a * 0.85).toFixed(3)})`;
          ambCtx.lineWidth = 1;
          ambCtx.beginPath();
          ambCtx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ambCtx.stroke();
          if (rp.r > 22) {
            ambCtx.strokeStyle = `rgba(37, 133, 90, ${(a * 0.55).toFixed(3)})`;
            ambCtx.beginPath();
            ambCtx.arc(rp.x, rp.y, rp.r * 0.62, 0, Math.PI * 2);
            ambCtx.stroke();
          }
        }
        ambCtx.restore();
      }

      // Slide 21: Serene Orbital Constellation behind Closing Portal
      if (sl.id === 'enter') {
        const cx = ambW * 0.5;
        const cy = ambH * 0.48;
        const R = Math.min(ambW, ambH) * 0.42;
        ambCtx.save();
        ambCtx.strokeStyle = 'rgba(244, 240, 232, 0.045)';
        ambCtx.lineWidth = 1;
        [0.45, 0.72, 1.0].forEach((k) => {
          ambCtx.beginPath();
          ambCtx.arc(cx, cy, R * k, 0, Math.PI * 2);
          ambCtx.stroke();
        });
        const count = BOOK_DATA.partCount || 14;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + state.time * 0.04;
          const x = cx + Math.cos(ang) * R;
          const y = cy + Math.sin(ang) * R * 0.62;
          ambCtx.fillStyle = 'rgba(52, 184, 124, 0.35)';
          ambCtx.beginPath();
          ambCtx.arc(x, y, 2.2, 0, Math.PI * 2);
          ambCtx.fill();
        }
        ambCtx.restore();
      }
    }

    // Slide 4: Orthogonal 0° <-> 90° Projection Instrument
    function drawOrthoInstrument(dt) {
      const c = document.getElementById('ortho-canvas');
      if (!c) return;
      const rect = c.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // Smooth spring toward target angle
      state.orthoAngle += (state.orthoTarget - state.orthoAngle) * Math.min(1, dt * 8);
      const deg = state.orthoAngle;
      const rad = (deg * Math.PI) / 180;
      const dot = Math.cos(rad);
      const lift = Math.sin(rad);

      const readout = document.getElementById('ortho-readout');
      if (readout) readout.textContent = `θ = ${Math.round(deg)}° · u·v = ${Math.abs(dot) < 0.005 ? '0.00' : dot.toFixed(2)}`;
      const slider = document.getElementById('ortho-slider');
      if (slider && !state.orthoDragging) slider.value = String(Math.round(deg));

      const cx = w * 0.5;
      const cy = h * 0.64;
      const axisLen = Math.min(w * 0.36, h * 0.52);

      // Isometric lower plane + subtle translucent orthogonal sheet rising with lift
      ctx.save();
      const py = 12 + lift * 28;
      ctx.strokeStyle = 'rgba(21, 20, 18, 0.09)';
      ctx.lineWidth = 1;
      for (let g = -3; g <= 3; g++) {
        const f = g / 3;
        ctx.beginPath();
        ctx.moveTo(cx - axisLen + f * 36, cy + f * py);
        ctx.lineTo(cx + axisLen + f * 36, cy + f * py);
        ctx.stroke();
      }

      // Vertical translucent orthogonal plane opened when lifting off the 1D line
      const vx = cx + Math.cos(rad) * axisLen * 0.88;
      const vy = cy - Math.sin(rad) * (h * 0.46);
      if (lift > 0.05) {
        const grad = ctx.createLinearGradient(cx, cy, cx, vy);
        grad.addColorStop(0, `rgba(37, 133, 90, ${(0.03 * lift).toFixed(3)})`);
        grad.addColorStop(1, `rgba(37, 133, 90, ${(0.11 * lift).toFixed(3)})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx - axisLen * 0.55, cy);
        ctx.lineTo(cx + axisLen * 0.55, cy);
        ctx.lineTo(vx + axisLen * 0.55, vy);
        ctx.lineTo(vx - axisLen * 0.55, vy);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = `rgba(37, 133, 90, ${(0.22 * lift).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // 1D Horizontal Axis (ToE <-> Anti-ToE)
      ctx.strokeStyle = 'rgba(21, 20, 18, 0.42)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - axisLen, cy);
      ctx.lineTo(cx + axisLen, cy);
      ctx.stroke();

      // Axis end markers
      ctx.fillStyle = 'rgba(21, 20, 18, 0.65)';
      ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(state.lang === 'zh' ? '反万物之理 (-1)' : 'ANTI-ToE (-1)', cx - axisLen, cy + 24);
      ctx.textAlign = 'right';
      ctx.fillText(state.lang === 'zh' ? '万物之理 (+1)' : 'ToE (+1)', cx + axisLen, cy + 24);

      // Right-angle arc / square indicator
      ctx.strokeStyle = 'rgba(37, 133, 90, 0.42)';
      ctx.lineWidth = 1.1;
      if (deg > 84) {
        ctx.strokeRect(cx, cy - 14, 14, 14);
      } else {
        ctx.beginPath();
        ctx.arc(cx, cy, 34, -rad, 0);
        ctx.stroke();
      }

      // Projection drop line onto horizontal axis (vanishes at 90°!)
      if (Math.abs(vx - cx) > 2) {
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(192, 57, 43, 0.45)';
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx, cy);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Orthogonal vector shaft
      ctx.strokeStyle = '#25855a';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(vx, vy);
      ctx.stroke();

      // Living tip node
      ctx.fillStyle = '#25855a';
      ctx.beginPath();
      ctx.arc(vx, vy, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(37, 133, 90, 0.28)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(vx, vy, 12 + Math.sin(state.time * 2.5) * 2.5, 0, Math.PI * 2);
      ctx.stroke();

      // Label at tip
      ctx.fillStyle = '#151412';
      ctx.font = '600 12px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(
        state.lang === 'zh' ? '非万物之理（正交切分）' : 'Not a ToE (Orthogonal Cut)',
        vx,
        vy - 18,
      );

      // Origin dot
      ctx.fillStyle = '#151412';
      ctx.beginPath();
      ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Slide 5: Real 14-Part / 7,269-Synapse Interactive Chord Constellation
    function drawLatticeCanvas(dt) {
      const c = document.getElementById('lattice-canvas');
      if (!c) return;
      const rect = c.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const parts = BOOK_DATA.parts || [];
      const mat = BOOK_DATA.partMatrix || [];
      const N = parts.length;
      if (!N) return;

      const cx = w * 0.5;
      const cy = h * 0.48;
      const R = Math.min(w, h) * 0.36;

      // Subtle outer orbital hairlines
      ctx.strokeStyle = 'rgba(244, 240, 232, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();

      const nodes = parts.map((p, i) => {
        const ang = -Math.PI / 2 + (i / N) * Math.PI * 2;
        return {
          p, i, ang,
          x: cx + Math.cos(ang) * R,
          y: cy + Math.sin(ang) * R,
          accent: PART_SPECS[p.slug]?.accent || '#34b87c',
        };
      });

      // Compute max weight for clean visual scaling
      let maxW = 1;
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          if ((mat[i]?.[j] || 0) > maxW) maxW = mat[i][j];
        }
      }

      const hov = state.latticeHover;

      // Draw real synaptic chords
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const weight = mat[i]?.[j] || 0;
          if (!weight) continue;
          const norm = Math.sqrt(weight / maxW);
          const isHot = hov === i || hov === j;
          const alpha = hov >= 0
            ? (isHot ? 0.25 + norm * 0.65 : 0.035)
            : (0.06 + norm * 0.28);
          ctx.strokeStyle = isHot
            ? (nodes[hov].accent)
            : `rgba(244, 240, 232, ${alpha.toFixed(3)})`;
          ctx.globalAlpha = isHot ? alpha : 1;
          ctx.lineWidth = isHot ? (0.8 + norm * 2.2) : (0.5 + norm * 1.1);
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.quadraticCurveTo(cx, cy, nodes[j].x, nodes[j].y);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // Draw active sleep-consolidation pulses traveling along real chords
      for (let k = state.latticePulses.length - 1; k >= 0; k--) {
        const pulse = state.latticePulses[k];
        pulse.t += dt * 0.72;
        if (pulse.t < 0) continue;
        if (pulse.t >= 1) { state.latticePulses.splice(k, 1); continue; }
        const a = nodes[pulse.src];
        const b = nodes[pulse.dst];
        const t = pulse.t;
        const inv = 1 - t;
        const px = inv * inv * a.x + 2 * inv * t * cx + t * t * b.x;
        const py = inv * inv * a.y + 2 * inv * t * cy + t * t * b.y;
        ctx.fillStyle = a.accent;
        ctx.globalAlpha = Math.sin(t * Math.PI);
        ctx.beginPath();
        ctx.arc(px, py, 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Draw 14 Part nodes + crisp radial domain labels
      nodes.forEach((n) => {
        const isHov = hov === n.i;
        const r = 4.2 + Math.sqrt(n.p.count) * 0.85;
        ctx.fillStyle = isHov ? n.accent : '#09090b';
        ctx.strokeStyle = n.accent;
        ctx.lineWidth = isHov ? 2.4 : 1.5;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const lx = cx + Math.cos(n.ang) * (R + r + 15);
        const ly = cy + Math.sin(n.ang) * (R + r + 15);
        ctx.fillStyle = isHov ? '#f4f0e8' : 'rgba(244, 240, 232, 0.78)';
        ctx.font = isHov ? '600 11.5px -apple-system, sans-serif' : '500 10.5px -apple-system, sans-serif';
        ctx.textBaseline = 'middle';
        const cosA = Math.cos(n.ang);
        ctx.textAlign = Math.abs(cosA) < 0.18 ? 'center' : (cosA > 0 ? 'left' : 'right');
        const sh = PART_SHORT[n.p.slug] || { en: n.p.labelEn, zh: n.p.labelZh };
        const tag = `${sh[state.lang]} · ${n.p.count}`;
        ctx.fillText(tag, lx, ly);
      });

      // Store node coordinates for hover/click hit-testing
      c._nodes = nodes;
    }

    function triggerLatticePulse(srcIdx) {
      const mat = BOOK_DATA.partMatrix || [];
      const N = (BOOK_DATA.parts || []).length;
      for (let j = 0; j < N; j++) {
        if (j === srcIdx) continue;
        if ((mat[srcIdx]?.[j] || 0) > 0) {
          state.latticePulses.push({ src: srcIdx, dst: j, t: -Math.random() * 0.25 });
        }
      }
    }

    /* =========================================================================
       MOUNT SLIDE, BIND INTERACTIONS & UPDATE CHROME
       ========================================================================= */
    function mountSlide(instant = false) {
      const sl = SLIDES[state.slide];
      const L = state.lang;
      const u = UI[L];

      // Update surface & domain pigment
      document.documentElement.dataset.lang = L;
      document.documentElement.lang = L === 'zh' ? 'zh-CN' : 'en';
      document.documentElement.dataset.surface = sl.surface;
      document.documentElement.style.setProperty('--accent', sl.accent);

      // Ambient canvas interactive only on Slide 2 (Prior ripple field)
      ambCanvas.classList.toggle('interactive', sl.id === 'prior');

      // Update Topbar & Bottombar
      dom.brandName.textContent = u.brand;
      dom.btnLang.textContent = u.langToggle;
      dom.lblOverview.textContent = u.overview;
      dom.lblAuto.textContent = state.autoplay ? u.autoOn : u.autoOff;
      dom.lblClose.textContent = u.close;
      dom.actCrumb.textContent = sl.act === 1 ? u.act1 : (sl.act === 2 ? u.act2 : u.act3);
      dom.slideNum.textContent = `${String(state.slide + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
      dom.slideLabel.textContent = sl.shortTitle[L];
      dom.btnPrev.disabled = state.slide === 0;
      dom.btnNext.disabled = state.slide === SLIDES.length - 1;

      // Update hash quietly
      const nextHash = `#${sl.id}`;
      if (location.hash !== nextHash) {
        history.replaceState(null, '', `${location.pathname}${location.search}${nextHash}`);
      }

      // Render slide HTML
      dom.slideMount.innerHTML = renderSlideHtml(sl);
      const slideEl = dom.slideMount.querySelector('.slide');
      if (slideEl && !instant) {
        slideEl.classList.add('entering');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => slideEl.classList.remove('entering'));
        });
      }

      // Bind Slide 4 Orthogonal Slider & Drag
      if (sl.id === 'orthogonal') {
        const slider = document.getElementById('ortho-slider');
        const wrap = document.getElementById('ortho-wrap');
        if (slider) {
          slider.addEventListener('pointerdown', () => { state.orthoDragging = true; });
          slider.addEventListener('pointerup', () => { state.orthoDragging = false; });
          slider.addEventListener('input', () => {
            state.orthoTarget = Number(slider.value);
          });
        }
        if (wrap) {
          let startX = 0;
          let startAngle = state.orthoTarget;
          wrap.addEventListener('pointerdown', (e) => {
            state.orthoDragging = true;
            startX = e.clientX;
            startAngle = state.orthoTarget;
            wrap.setPointerCapture(e.pointerId);
          });
          wrap.addEventListener('pointermove', (e) => {
            if (!state.orthoDragging) return;
            const delta = (e.clientX - startX) * 0.45;
            state.orthoTarget = Math.max(0, Math.min(90, startAngle + delta));
            if (slider) slider.value = String(Math.round(state.orthoTarget));
          });
          wrap.addEventListener('pointerup', () => { state.orthoDragging = false; });
        }
      }

      // Bind Slide 5 Synaptic Lattice Hover & Click
      if (sl.id === 'lattice') {
        const c = document.getElementById('lattice-canvas');
        const cap = document.getElementById('lattice-caption');
        if (c) {
          const pickNode = (e) => {
            const rect = c.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const nodes = c._nodes || [];
            let best = -1, bestDist = 26;
            for (const n of nodes) {
              const d = Math.hypot(mx - n.x, my - n.y);
              if (d < bestDist) { bestDist = d; best = n.i; }
            }
            return best;
          };
          c.addEventListener('pointermove', (e) => {
            const hit = pickNode(e);
            state.latticeHover = hit;
            if (cap) {
              if (hit >= 0) {
                const p = BOOK_DATA.parts[hit];
                cap.textContent = L === 'zh'
                  ? `${p.labelZh} · ${p.titleZh}（${p.count} 篇 · ${p.inLinks} 条入链）· 点击发射整合波`
                  : `${p.labelEn} · ${p.titleEn} (${p.count} essays · ${p.inLinks} incoming links) · Click to pulse`;
              } else {
                cap.textContent = u.latticeHint;
              }
            }
          });
          c.addEventListener('pointerleave', () => {
            state.latticeHover = -1;
            if (cap) cap.textContent = u.latticeHint;
          });
          c.addEventListener('click', (e) => {
            const hit = pickNode(e);
            triggerLatticePulse(hit >= 0 ? hit : Math.floor(Math.random() * BOOK_DATA.partCount));
          });
          // Initial graceful consolidation wave from Method (Part 0)
          setTimeout(() => {
            if (SLIDES[state.slide]?.id === 'lattice') triggerLatticePulse(0);
          }, 550);
        }
      }

      // Update Pips & Preload adjacent covers
      updatePips();
      preloadAdjacent(state.slide);
      state.autoElapsed = 0;
      dom.autoplayBar.style.width = '0%';
    }

    /* =========================================================================
       PIP RAIL & OVERVIEW DRAWER
       ========================================================================= */
    function buildPipRail() {
      dom.pipRail.innerHTML = '';
      SLIDES.forEach((sl, idx) => {
        if (idx > 0 && SLIDES[idx - 1].act !== sl.act) {
          const gap = document.createElement('span');
          gap.className = 'pip-gap';
          dom.pipRail.appendChild(gap);
        }
        const btn = document.createElement('button');
        btn.className = 'pip';
        btn.type = 'button';
        btn.dataset.idx = String(idx);
        btn.innerHTML = '<span></span>';
        btn.addEventListener('click', () => goTo(idx));
        dom.pipRail.appendChild(btn);
      });
    }

    function updatePips() {
      const L = state.lang;
      dom.pipRail.querySelectorAll('.pip').forEach((btn) => {
        const idx = Number(btn.dataset.idx);
        btn.classList.toggle('active', idx === state.slide);
        btn.title = `${String(idx + 1).padStart(2, '0')} · ${SLIDES[idx].shortTitle[L]}`;
        btn.setAttribute('aria-label', btn.title);
      });
    }

    function renderOverview() {
      const L = state.lang;
      const u = UI[L];
      dom.overviewTitle.textContent = u.overviewTitle;
      const groups = [
        { title: u.act1, items: SLIDES.map((s, i) => ({ s, i })).filter((x) => x.s.act === 1) },
        { title: u.act2, items: SLIDES.map((s, i) => ({ s, i })).filter((x) => x.s.act === 2) },
        { title: u.act3, items: SLIDES.map((s, i) => ({ s, i })).filter((x) => x.s.act === 3) },
      ];
      dom.overviewContent.innerHTML = groups.map((g) => `
        <div class="overview-group-title">${esc(g.title)}</div>
        <div class="overview-grid">
          ${g.items.map(({ s, i }) => {
            const p = s.partSlug ? PARTS_BY_SLUG.get(s.partSlug) : null;
            const meta = p ? `${p.count} ${u.essaysUnit}` : `${String(i + 1).padStart(2, '0')}`;
            return `
              <button class="overview-item${i === state.slide ? ' current' : ''}" type="button" data-jump-idx="${i}" style="--item-accent:${s.accent};">
                <span class="overview-item-top">
                  <span>${String(i + 1).padStart(2, '0')}</span>
                  <span>${esc(meta)}</span>
                </span>
                <span class="overview-item-name">${esc(s.shortTitle[L])}</span>
              </button>`;
          }).join('')}
        </div>
      `).join('');
    }

    function setOverview(open) {
      state.overviewOpen = open;
      if (open) renderOverview();
      dom.overviewDrawer.classList.toggle('open', open);
      dom.overviewDrawer.setAttribute('aria-hidden', open ? 'false' : 'true');
      dom.btnOverview.classList.toggle('active', open);
    }

    /* =========================================================================
       NAVIGATION & DELEGATED INTERACTIONS
       ========================================================================= */
    function goTo(idx) {
      const target = Math.max(0, Math.min(SLIDES.length - 1, idx));
      if (target === state.slide) return;
      state.slide = target;
      mountSlide(false);
    }

    function toggleLang() {
      state.lang = state.lang === 'en' ? 'zh' : 'en';
      const url = new URL(location.href);
      url.searchParams.set('lang', state.lang);
      history.replaceState(null, '', url.toString());
      mountSlide(true);
      if (state.overviewOpen) renderOverview();
    }

    function toggleAutoplay() {
      state.autoplay = !state.autoplay;
      dom.btnAuto.classList.toggle('active', state.autoplay);
      dom.lblAuto.textContent = state.autoplay ? UI[state.lang].autoOn : UI[state.lang].autoOff;
      if (!state.autoplay) dom.autoplayBar.style.width = '0%';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    // Delegated clicks inside slide mount
    dom.slideMount.addEventListener('click', (e) => {
      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        const act = actionBtn.dataset.action;
        if (act === 'next') goTo(state.slide + 1);
        if (act === 'jump-parts') goTo(5);
        if (act === 'overview') setOverview(true);
        if (act === 'replay') goTo(0);
        return;
      }

      // Part 3-plate cover switcher
      const plateBtn = e.target.closest('[data-plate-idx]');
      if (plateBtn) {
        const slug = plateBtn.dataset.partSlug;
        const pIdx = Number(plateBtn.dataset.plateIdx);
        state.selectedPlate[slug] = pIdx;
        const part = PARTS_BY_SLUG.get(slug);
        const essay = part?.featured?.[pIdx];
        dom.slideMount.querySelectorAll('.gallery-img').forEach((img) => {
          img.classList.toggle('active', Number(img.dataset.plateImg) === pIdx);
        });
        dom.slideMount.querySelectorAll('.plate-tab').forEach((tab) => {
          tab.classList.toggle('active', Number(tab.dataset.plateIdx) === pIdx);
        });
        const link = document.getElementById('active-essay-link');
        const openBtn = document.getElementById('active-essay-btn');
        if (essay && link) {
          link.href = essay.url;
          link.textContent = state.lang === 'zh' ? essay.titleZh : essay.titleEn;
        }
        if (essay && openBtn) openBtn.href = essay.url;
        return;
      }

      // Slide 20 Index of Premises label filter
      const labelEl = e.target.closest('[data-label-idx]');
      if (labelEl) {
        state.activeLabelIdx = Number(labelEl.dataset.labelIdx);
        mountSlide(true);
      }
    });

    dom.overviewContent.addEventListener('click', (e) => {
      const item = e.target.closest('[data-jump-idx]');
      if (!item) return;
      const idx = Number(item.dataset.jumpIdx);
      setOverview(false);
      goTo(idx);
    });

    dom.btnLang.addEventListener('click', toggleLang);
    dom.btnOverview.addEventListener('click', () => setOverview(!state.overviewOpen));
    dom.btnCloseOverview.addEventListener('click', () => setOverview(false));
    dom.btnAuto.addEventListener('click', toggleAutoplay);
    dom.btnFs.addEventListener('click', toggleFullscreen);
    dom.btnPrev.addEventListener('click', () => goTo(state.slide - 1));
    dom.btnNext.addEventListener('click', () => goTo(state.slide + 1));

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape' && state.overviewOpen) { setOverview(false); return; }
      if (e.key === 'o' || e.key === 'O' || e.key === 'g' || e.key === 'G') { setOverview(!state.overviewOpen); return; }
      if (state.overviewOpen) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); goTo(state.slide + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(state.slide - 1); }
      else if (e.key === 'Home') { goTo(0); }
      else if (e.key === 'End') { goTo(SLIDES.length - 1); }
      else if (e.key === 'l' || e.key === 'L') { toggleLang(); }
      else if (e.key === 'a' || e.key === 'A') { toggleAutoplay(); }
      else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
    });

    // Touch swipe navigation on mobile
    let touchX = 0, touchY = 0;
    dom.stage.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });
    dom.stage.addEventListener('touchend', (e) => {
      if (!touchX || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      touchX = 0;
      if (Math.abs(dx) > 54 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) goTo(state.slide + 1);
        else goTo(state.slide - 1);
      }
    }, { passive: true });

    window.addEventListener('resize', resizeAmbient);

    /* =========================================================================
       ANIMATION LOOP
       ========================================================================= */
    let lastTs = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - lastTs) / 1000);
      lastTs = now;
      state.time += dt;

      drawAmbientFrame(dt);
      const sl = SLIDES[state.slide];
      if (sl?.id === 'orthogonal') drawOrthoInstrument(dt);
      if (sl?.id === 'lattice') drawLatticeCanvas(dt);

      if (state.autoplay && !state.overviewOpen && state.slide < SLIDES.length - 1) {
        state.autoElapsed += dt;
        const dur = sl?.duration || 10;
        dom.autoplayBar.style.width = `${Math.min(100, (state.autoElapsed / dur) * 100)}%`;
        if (state.autoElapsed >= dur) {
          goTo(state.slide + 1);
        }
      }

      requestAnimationFrame(tick);
    }

    // Boot
    resizeAmbient();
    buildPipRail();
    mountSlide(true);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.documentElement.classList.add('transitions-ready');
      });
    });
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
