        });

        // Exterior emerald node (The Living Judge — strictly OUTSIDE the scoring axis!)
        const judgeY = cy - clamp(H * 0.17, 94, 140);
        c.strokeStyle = 'rgba(63, 185, 80, 0.75)';
        c.setLineDash([5, 5]);
        c.lineWidth = 1.8;
        c.beginPath();
        c.moveTo(cx, judgeY + 24);
        c.lineTo(cx + barW * 0.5, cy - 12);
        c.stroke();
        c.setLineDash([]);

        // Glowing emerald node
        const pulse = 1 + Math.sin(t * 3.2) * 0.14;
        c.beginPath();
        c.arc(cx, judgeY, 24 * pulse, 0, Math.PI * 2);
        c.fillStyle = 'rgba(63, 185, 80, 0.22)';
        c.fill();
        c.beginPath();
        c.arc(cx, judgeY, 9.5, 0, Math.PI * 2);
        c.fillStyle = '#3fb950';
        c.fill();

        c.fillStyle = '#4ade80';
        c.font = `700 13.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        c.textAlign = 'center';
        c.fillText(zh ? '活的裁断前沿（设定标准并按下验收）' : 'LIVING EDGE (SETS THE CRITERION & ACCEPTS THE RENDER)', cx, judgeY - 32);

        c.fillStyle = '#7dd3fc';
        c.font = `600 12.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        c.fillText(zh ? '外部选定的评分函数（单维标量）' : 'CHOSEN SCORING FUNCTION (1D SCALAR PROJECTION)', cx, cy + 56);

        c.restore();
      }
    }

    /* --- SCENE 3: THE COMPOUNDING IS REAL — 90° ORTHOGONAL CAMERA ORBIT --- */
    function renderScene3(c, W, H, t) {
      const zh = state.lang === 'zh';
      // Sky gradient (architectural warm-dusk fading into clean deep cosmos during 90° orbit)
      const autoOrbit = easeInOutCubic((t - 2.3) / 2.2);
      const orbit = state.orbitOverride !== null ? state.orbitOverride : autoOrbit;

      if (orbit > 0.35 && !state.scene4OrbitCue) {
        state.scene4OrbitCue = true;
        sound.chime([293.66, 440, 587.33]);
      }

      const bgGrad = c.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#070b14');
      bgGrad.addColorStop(0.55, '#121b2c');
      bgGrad.addColorStop(1, '#1d1c24');
      c.fillStyle = bgGrad;
      c.fillRect(0, 0, W, H);

      // 3D camera orbiting from 0° -> -68° so the red curve compresses on the left and the emerald 90° axis extends cleanly into open upper-right space!
      const yaw = lerp(-0.08, -1.16, orbit) + state.pointer.x * 0.14;
      const pitch = lerp(0.14, 0.28, orbit) + state.pointer.y * 0.08;
      const fov = Math.min(W, H) * 0.82;
      const camZ = 7.2;

      function proj(x, y, z) {
        const x1 = x * Math.cos(yaw) - z * Math.sin(yaw);
        const z1 = x * Math.sin(yaw) + z * Math.cos(yaw);
        const y2 = y * Math.cos(pitch) - z1 * Math.sin(pitch);
        const z2 = y * Math.sin(pitch) + z1 * Math.cos(pitch) + camZ;
        const s = fov / Math.max(0.4, z2);
        return { x: W * 0.46 + x1 * s, y: H * 0.44 - y2 * s, s, z: z2 };
      }

      // Draw subtle perspective floor grid on XZ plane (y = -0.8)
      c.strokeStyle = 'rgba(240, 246, 252, 0.065)';
      c.lineWidth = 1;
      for (let g = -2.6; g <= 2.6; g += 0.65) {
        const a = proj(g, -0.8, -2.6);
        const b = proj(g, -0.8, 2.6);
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
        const d = proj(-2.6, -0.8, g);
        const e = proj(2.6, -0.8, g);
        c.beginPath(); c.moveTo(d.x, d.y); c.lineTo(e.x, e.y); c.stroke();
      }

      // Draw the flat translucent XY projection sheet (z = 0), strictly bounded inside viewport
      const sheetAlpha = lerp(0.06, 0.24, orbit);
      const pBL = proj(-2.1, -0.8, 0);
      const pBR = proj(2.1, -0.8, 0);
      const pTR = proj(2.1, 1.85, 0);
      const pTL = proj(-2.1, 1.85, 0);
      c.beginPath();
      c.moveTo(pBL.x, pBL.y); c.lineTo(pBR.x, pBR.y);
      c.lineTo(pTR.x, pTR.y); c.lineTo(pTL.x, pTL.y);
      c.closePath();
      c.fillStyle = `rgba(248, 81, 73, ${sheetAlpha * 0.42})`;
      c.fill();
      c.strokeStyle = `rgba(248, 81, 73, ${lerp(0.22, 0.68, orbit)})`;
      c.lineWidth = 1.4;
      c.stroke();

      // Exponentially growing white domino slabs sitting inside the z=0 plane!
      const dominoCount = 12;
      for (let i = 0; i < dominoCount; i++) {
        const u = i / (dominoCount - 1);
        const x = lerp(-1.85, 1.75, u);
        const h = 0.12 * Math.pow(1.29, i);
        const w = 0.075 + u * 0.065;
        const fall = clamp((t * 0.85 - i * 0.12), 0, 1);
        const tilt = i < dominoCount - 1 ? easeOutCubic(fall) * 0.2 : 0;

        const baseL = proj(x - w / 2, -0.8, 0);
        const baseR = proj(x + w / 2, -0.8, 0);
        const topR = proj(x + w / 2 + Math.sin(tilt) * h, -0.8 + Math.cos(tilt) * h, 0);
        const topL = proj(x - w / 2 + Math.sin(tilt) * h, -0.8 + Math.cos(tilt) * h, 0);

        c.beginPath();
        c.moveTo(baseL.x, baseL.y);
        c.lineTo(baseR.x, baseR.y);
        c.lineTo(topR.x, topR.y);
        c.lineTo(topL.x, topL.y);
        c.closePath();
        c.fillStyle = `rgba(242, 244, 248, ${lerp(0.84, 0.36, orbit)})`;
        c.fill();
        c.strokeStyle = 'rgba(15, 23, 42, 0.35)';
        c.lineWidth = 0.8;
        c.stroke();

        if (i === 5 || i === 8 || i === 11) {
          const label = i === 5 ? '10' : i === 8 ? '20' : '30';
          const lp = proj(x + Math.sin(tilt) * h * 0.72, -0.8 + Math.cos(tilt) * h * 0.72, 0);
          c.fillStyle = `rgba(17, 24, 39, ${lerp(0.85, 0.25, orbit)})`;
          c.font = `700 ${Math.max(10, Math.round(lp.s * 0.11))}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-sans')}`;
          c.textAlign = 'center';
          c.fillText(label, lp.x, lp.y);
        }
      }

      // Blazing exponential curve shooting up the z=0 plane
      c.beginPath();
      for (let i = 0; i <= 50; i++) {
        const u = i / 50;
        const x = lerp(-1.95, 1.85, u);
        const y = -0.8 + 0.055 * Math.exp(u * 3.85);
        const p = proj(x, Math.min(y, 1.85), 0);
        if (i === 0) c.moveTo(p.x, p.y);
        else c.lineTo(p.x, p.y);
      }
      c.strokeStyle = '#f85149';
      c.lineWidth = 3;
      c.shadowColor = 'rgba(248, 81, 73, 0.75)';
      c.shadowBlur = 14;
      c.stroke();
      c.shadowBlur = 0;

      // Two opposing poles stuck on the SAME 1D axis
      const poleL = proj(-1.8, -0.35, 0);
      const poleR = proj(1.65, 1.62, 0);
      c.font = `600 11.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'center';
      c.fillStyle = 'rgba(248, 81, 73, 0.92)';
      c.fillText(zh ? '−1 · 线性上限（同一条轴）' : '−1 · LINEAR CEILING (SAME AXIS)', poleL.x, poleL.y);
      c.fillText(zh ? '+1 · 自主心智（同一条轴）' : '+1 · AUTONOMOUS MIND (SAME AXIS)', poleR.x, poleR.y);

      // THE EMERALD 90° ORTHOGONAL AXIS (z-axis extending cleanly into unobstructed upper-right space!)
      const orthoReveal = smoothstep(0.18, 0.88, orbit);
      if (orthoReveal > 0.01) {
        const o0 = proj(0, -0.8, 0);
        const o1 = proj(0, -0.8, lerp(0, 2.75, orthoReveal));
        const oBack = proj(0, -0.8, lerp(0, -1.2, orthoReveal));

        c.save();
        c.strokeStyle = '#3fb950';
        c.lineWidth = 3.5;
        c.shadowColor = 'rgba(63, 185, 80, 0.85)';
        c.shadowBlur = 18;
        c.beginPath();
        c.moveTo(oBack.x, oBack.y);
        c.lineTo(o1.x, o1.y);
        c.stroke();

        // Right-angle square symbol at origin
        const sqA = proj(0.28, -0.8, 0);
        const sqB = proj(0.28, -0.8, 0.28);
        const sqC = proj(0, -0.8, 0.28);
        c.lineWidth = 1.6;
        c.shadowBlur = 0;
        c.beginPath();
        c.moveTo(sqA.x, sqA.y); c.lineTo(sqB.x, sqB.y); c.lineTo(sqC.x, sqC.y);
        c.stroke();

        // Luminous emerald endpoint orb + label strictly in open right space
        c.beginPath();
        c.arc(o1.x, o1.y, 7.5, 0, Math.PI * 2);
        c.fillStyle = '#3fb950';
        c.fill();

        c.fillStyle = '#4ade80';
        c.font = `700 13px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        c.textAlign = 'center';
        c.fillText(
          zh ? '90° 正交维度（内积 = 0 · 活的心智前沿）' : '90° ORTHOGONAL AXIS (⟨u, v⟩ = 0 · THE LIVING EDGE)',
          Math.min(o1.x, W - 240),
          o1.y - 22
        );
        c.restore();
      }

      // Live angle readout top-center
      const deg = Math.round(orbit * 90);
      c.fillStyle = deg > 45 ? '#3fb950' : 'rgba(240, 246, 252, 0.55)';
      c.font = `600 12px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'center';
      c.fillText(zh ? `观测夹角：${deg}°` : `CAMERA ANGLE: ${deg}°`, W * 0.5, 62);
    }

    /* --- SCENE 4: THE MOVING HORIZON (99% closes -> 1% unfolds a new cosmos) --- */
    function renderScene4(c, W, H, t) {
      const zh = state.lang === 'zh';
      // Deep space to Earth's curved glowing blue atmosphere at the bottom
      const bg = c.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#02040a');
      bg.addColorStop(0.58, '#071327');
      bg.addColorStop(0.86, '#153a6c');
      bg.addColorStop(1, '#3c78b8');
      c.fillStyle = bg;
      c.fillRect(0, 0, W, H);

      // Stars in upper space
      STARS.slice(0, 110).forEach(s => {
        const sx = (s.x * 0.5 + 0.5) * W;
        const sy = (s.y * 0.5 + 0.5) * H * 0.65;
        const tw = 0.4 + 0.6 * Math.sin(t * 1.8 + s.twinkle);
        c.fillStyle = `rgba(240, 246, 252, ${0.45 * tw})`;
        c.fillRect(sx, sy, s.r, s.r);
      });

      // Curved Earth atmospheric limb
      c.save();
      c.beginPath();
      c.arc(W * 0.5, H * 2.15, H * 1.38, Math.PI * 1.15, Math.PI * 1.85);
      c.strokeStyle = 'rgba(120, 200, 255, 0.45)';
      c.lineWidth = 6;
      c.shadowColor = '#38bdf8';
      c.shadowBlur = 32;
      c.stroke();
      c.restore();

      // Cycle smoothly every 5.6s so viewer watches 99% -> 1% unfolding -> N+1 horizon continuously!
      const cycleDur = 5.6;
      const cycle = Math.floor(t / cycleDur);
      const localT = (t % cycleDur) / cycleDur; // 0..1

      const fillP = easeOutCubic(clamp(localT / 0.46, 0, 1)); // 0..99%
      const unfold = easeInOutCubic(clamp((localT - 0.52) / 0.34, 0, 1)); // 1% unfolds!
      const pct = Math.min(99, Math.round(fillP * 99));

      // Perspective white METR ribbon ascending strictly in the unobstructed upper stage
      const rx = W * 0.28 + state.pointer.x * 16;
      const ryTop = H * 0.11;
      const ryBot = H * 0.59;
      const rwTop = clamp(W * 0.105, 74, 126);
      const rwBot = rwTop * 0.46;

      c.save();
      c.beginPath();
      c.moveTo(rx - rwBot / 2, ryBot);
      c.lineTo(rx + rwBot / 2, ryBot);
      c.lineTo(rx + rwTop / 2, ryTop);
      c.lineTo(rx - rwTop / 2, ryTop);
      c.closePath();
      c.fillStyle = 'rgba(248, 250, 252, 0.94)';
      c.shadowColor = 'rgba(56, 189, 248, 0.35)';
      c.shadowBlur = 24;
      c.fill();
      c.shadowBlur = 0;

      // Red ascending METR benchmark line climbing the paper ribbon
      const climbY = lerp(ryBot - 14, ryTop + 22, fillP);
      c.strokeStyle = '#dc2626';
      c.lineWidth = 3.2;
      c.beginPath();
      c.moveTo(rx + rwBot * 0.24, ryBot - 14);
      c.lineTo(rx + lerp(rwBot, rwTop, fillP) * 0.28, climbY);
      c.stroke();

      // Horizontal ruler lines & labels on the ribbon
      c.fillStyle = '#334155';
      c.font = `600 10.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'left';
      c.fillText('4 min', rx - rwBot * 0.4, ryBot - 14);
      c.fillText('40 hr', rx - lerp(rwBot, rwTop, 0.5) * 0.4, lerp(ryBot, ryTop, 0.5));
      c.fillText('200 hr', rx - rwTop * 0.4, ryTop + 22);
      c.restore();

      // Right-center: Benchmark Closure Gauge -> The 1% Fractal Horizon Unfolding (strictly clear of lower-third card!)
      const gx = W * 0.65 + state.pointer.x * 20;
      const gy = H * 0.35 + state.pointer.y * 12;
      const radius = clamp(Math.min(W, H) * 0.135, 72, 118);

      // Shrinking old closed benchmark ring once 1% unfolds
      const oldScale = lerp(1.0, 0.24, unfold);
      c.save();
      c.translate(gx, gy);

      // Old closed benchmark circle
      c.save();
      c.scale(oldScale, oldScale);
      c.beginPath();
      c.arc(0, 0, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (pct / 100));
      c.strokeStyle = unfold > 0.2 ? 'rgba(88, 166, 255, 0.45)' : '#58a6ff';
      c.lineWidth = 8;
      c.stroke();

      c.fillStyle = unfold > 0.35 ? 'rgba(240, 246, 252, 0.48)' : '#f0f6fc';
      c.font = `700 ${Math.round(radius * 0.34)}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(`${pct}%`, 0, -6);
      c.font = `500 12px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.fillStyle = '#d29922';
      c.fillText(
        unfold > 0.35
          ? (zh ? '重归类：狭隘执行' : 'RECLASSIFIED: NARROW')
          : (zh ? `旧球门 N=${cycle + 1}` : `GOALPOST N=${cycle + 1}`),
        0,
        radius * 0.28
      );
      c.restore();

      // THE REMAINING 1% BLOOMING INTO A NEW HORIZON OF UNARTICULATED PROBLEMS!
      if (unfold > 0.01) {
        const bloomR = lerp(12, radius * 1.65, unfold);
        const spokes = 18;
        c.strokeStyle = `rgba(63, 185, 80, ${unfold * 0.68})`;
        c.lineWidth = 1.2;
        for (let i = 0; i < spokes; i++) {
          const ang = (i / spokes) * Math.PI * 2 + t * 0.08;
          const inner = radius * oldScale + 8;
          const outer = bloomR * (0.82 + 0.18 * Math.sin(i * 2.3 + t));
          c.beginPath();
          c.moveTo(Math.cos(ang) * inner, Math.sin(ang) * inner);
          c.lineTo(Math.cos(ang) * outer, Math.sin(ang) * outer);
          c.stroke();

          c.beginPath();
          c.arc(Math.cos(ang) * outer, Math.sin(ang) * outer, 3.2, 0, Math.PI * 2);
          c.fillStyle = i % 3 === 0 ? '#3fb950' : '#58a6ff';
          c.globalAlpha = unfold;
          c.fill();
          c.globalAlpha = 1;
        }
        // New outer horizon ring
        c.beginPath();
        c.arc(0, 0, bloomR, 0, Math.PI * 2);
        c.setLineDash([5, 7]);
        c.strokeStyle = `rgba(63, 185, 80, ${unfold * 0.85})`;
        c.lineWidth = 1.8;
        c.stroke();
        c.setLineDash([]);

        c.fillStyle = '#3fb950';
        c.globalAlpha = unfold;
        c.font = `700 12.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        c.textAlign = 'center';
        c.fillText(
          zh ? `余下 1% 展开的新视界 → N + 1` : `REMAINING 1% UNFOLDS NEW HORIZON → N + 1`,
          0,
          -bloomR - 14
        );
        c.globalAlpha = 1;
      }

      c.restore();
    }

    /* --- SCENE 5: THE DEEPER ANCHOR (Split Ocean + Origami Boat + TWO Anchors) --- */
    function renderScene5(c, W, H, t) {
      const zh = state.lang === 'zh';
      // Pan waterline upward slightly at t = 2.4..4.2s to reveal the deeper second anchor!
      const dive = easeInOutCubic((t - 2.3) / 1.8);
      const waterY = H * lerp(0.45, 0.30, dive);

      // 1. ABOVE WATER: Warm golden sunset sky
      const sky = c.createLinearGradient(0, 0, 0, waterY);
      sky.addColorStop(0, '#142030');
      sky.addColorStop(0.58, '#46545f');
      sky.addColorStop(0.86, '#c79a64');
      sky.addColorStop(1, '#f4d399');
      c.fillStyle = sky;
      c.fillRect(0, 0, W, waterY + 6);

      // Warm low sun disc + horizon glow
      const sunX = W * 0.36 + state.pointer.x * 18;
      const sunY = waterY - 12;
      const sunGlow = c.createRadialGradient(sunX, sunY, 4, sunX, sunY, W * 0.28);
      sunGlow.addColorStop(0, 'rgba(255, 248, 220, 0.96)');
      sunGlow.addColorStop(0.22, 'rgba(245, 198, 120, 0.45)');
      sunGlow.addColorStop(1, 'rgba(245, 198, 120, 0)');
      c.fillStyle = sunGlow;
      c.fillRect(0, 0, W, waterY + 6);

      // 2. BELOW WATER: Luminous emerald-teal ocean transitioning to deep abyssal slate
      const sea = c.createLinearGradient(0, waterY, 0, H);
      sea.addColorStop(0, '#1e8a7d');
      sea.addColorStop(0.32, '#0e5b5c');
      sea.addColorStop(0.72, '#072a36');
      sea.addColorStop(1, '#04121b');
      c.fillStyle = sea;
      c.fillRect(0, waterY, W, H - waterY);

      // Underwater shimmering caustic light shafts
      c.save();
      for (let i = 0; i < 9; i++) {
        const rx = W * (0.12 + i * 0.1) + Math.sin(t * 0.7 + i) * 28;
        const rw = 26 + (i % 3) * 18;
        const rg = c.createLinearGradient(rx, waterY, rx + 70, H * 0.88);
        rg.addColorStop(0, 'rgba(150, 245, 225, 0.14)');
        rg.addColorStop(1, 'rgba(150, 245, 225, 0)');
        c.fillStyle = rg;
        c.beginPath();
        c.moveTo(rx, waterY);
        c.lineTo(rx + rw, waterY);
        c.lineTo(rx + rw + 110, H * 0.92);
        c.lineTo(rx + 60, H * 0.92);
        c.closePath();
        c.fill();
      }
      c.restore();

      // Animated wave surface meniscus
      c.beginPath();
      c.moveTo(0, waterY);
      for (let x = 0; x <= W; x += 18) {
        const wy = waterY + Math.sin(x * 0.014 + t * 2.1) * 4.5 + Math.cos(x * 0.03 - t * 1.4) * 2;
        c.lineTo(x, wy);
      }
      c.lineTo(W, waterY + 18);
      c.lineTo(0, waterY + 18);
      c.closePath();
      c.fillStyle = 'rgba(205, 250, 242, 0.18)';
      c.fill();

      // 3. WHITE ORIGAMI PAPER BOAT gently pitching on the waves
      const boatX = W * 0.64 + Math.sin(t * 0.65) * 10 + state.pointer.x * 12;
      const boatY = waterY - 2 + Math.sin(t * 2.0) * 3.5;
      const boatPitch = Math.sin(t * 1.7) * 0.045;
      const bs = clamp(W * 0.068, 46, 86);

      c.save();
      c.translate(boatX, boatY);
      c.rotate(boatPitch);
      // Left hull facet
      c.beginPath();
      c.moveTo(-bs, -bs * 0.25); c.lineTo(0, -bs * 0.08); c.lineTo(-bs * 0.62, bs * 0.16);
      c.closePath();
      c.fillStyle = '#e2e8f0';
      c.fill();
      // Right hull facet
      c.beginPath();
      c.moveTo(bs, -bs * 0.25); c.lineTo(0, -bs * 0.08); c.lineTo(bs * 0.62, bs * 0.16);
      c.closePath();
      c.fillStyle = '#f8fafc';
      c.fill();
      // Center pyramid sail
      c.beginPath();
      c.moveTo(-bs * 0.56, -bs * 0.18); c.lineTo(0, -bs * 0.92); c.lineTo(bs * 0.56, -bs * 0.18);
      c.closePath();
      c.fillStyle = '#ffffff';
      c.fill();
      // Inner fold shadow
      c.beginPath();
      c.moveTo(0, -bs * 0.92); c.lineTo(0, -bs * 0.08); c.lineTo(bs * 0.56, -bs * 0.18);
      c.closePath();
      c.fillStyle = '#cbd5e1';
      c.fill();
      c.restore();

      // 4. ANCHOR 1 (Shallow — "Tomorrow looks like today"): CUT by blue selection box at t = 1.6s!
      const cut1 = t > 1.75;
      if (cut1 && !state.scene6CutCue) {
        state.scene6CutCue = true;
        sound.tick(980, 0.05, 0.08);
      }
      const drop1 = cut1 ? easeOutCubic(clamp((t - 1.75) / 1.8, 0, 1)) * 70 : 0;
      const a1X = boatX - Math.min(W * 0.14, 175);
      const a1Y = waterY + 95 + drop1;

      // Chain 1
      c.save();
      c.strokeStyle = cut1 ? 'rgba(245, 198, 120, 0.48)' : 'rgba(245, 198, 120, 0.88)';
      c.lineWidth = 2.4;
      c.setLineDash([6, 4]);
      c.beginPath();
      if (!cut1) {
        c.moveTo(boatX - 24, boatY + 10);
        c.quadraticCurveTo(a1X + 20, (boatY + a1Y) / 2, a1X, a1Y);
      } else {
        c.moveTo(a1X, waterY + 52 + drop1);
        c.lineTo(a1X, a1Y);
      }
      c.stroke();
      c.setLineDash([]);

      // Blue selection box cutting chain 1 right around t = 0.9..2.25s
      if (t > 0.9 && t < 2.25) {
        const boxA = t < 1.75 ? smoothstep(0.9, 1.3, t) : 1 - smoothstep(1.85, 2.25, t);
        drawSelectionBox(c, a1X - 10, waterY + 42, 28, 36, { alpha: boxA, rotationHandle: true, handleSize: 5 });
      }

      // Draw Anchor 1 icon (strictly clear above lower-third card!)
      c.globalAlpha = cut1 ? 0.62 : 0.94;
      drawAnchorIcon(c, a1X, a1Y, 16, '#fbbf24');
      c.fillStyle = '#fde68a';
      c.font = `600 11.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'right';
      c.fillText(
        cut1
          ? (zh ? '已斩断：线性直觉' : 'SEVERED: LINEAR INTUITION')
          : (zh ? '锚 1：明天像今天' : 'ANCHOR 1: LINEAR INTUITION'),
        a1X - 24,
        a1Y + 4
      );
      c.restore();

      // 5. ANCHOR 2 (Deeper — IMAGE LAG: Projecting a Second Mind!)
      const a2Reveal = smoothstep(2.1, 3.5, t);
      if (a2Reveal > 0.01) {
        const dissolved = state.secondAnchorCut
          ? easeOutCubic(clamp((t - state.secondAnchorCutTime) / 1.1, 0, 1))
          : 0;
        const a2X = boatX + 40;
        const a2Y = Math.min(H * 0.56, waterY + H * 0.25);
        const col = dissolved > 0.5 ? '#4ade80' : '#ff6b6b';

        c.save();
        c.globalAlpha = a2Reveal;

        // Heavy glowing chain 2 still attached directly to the boat!
        if (dissolved < 0.95) {
          c.strokeStyle = col;
          c.lineWidth = lerp(3.4, 1.0, dissolved);
          c.setLineDash([8, 5]);
          c.globalAlpha = a2Reveal * (1 - dissolved);
          c.beginPath();
          c.moveTo(boatX + 8, boatY + 12);
          c.quadraticCurveTo(a2X + 18, (boatY + a2Y) * 0.5, a2X, a2Y);
          c.stroke();
          c.setLineDash([]);
        }

        // Crimson pulse ring around the deeper anchor
        c.globalAlpha = a2Reveal * (1 - dissolved * 0.72);
        const pulse = 1 + Math.sin(t * 3.0) * 0.14;
        c.beginPath();
        c.arc(a2X, a2Y, 36 * pulse, 0, Math.PI * 2);
        c.fillStyle = dissolved > 0.5 ? 'rgba(63, 185, 80, 0.22)' : 'rgba(248, 81, 73, 0.22)';
        c.fill();
        drawAnchorIcon(c, a2X, a2Y, 24, col);

        // Label cleanly above/right of deeper anchor — never colliding with bottom-left card!
        c.globalAlpha = a2Reveal;
        c.fillStyle = col;
        c.font = `700 12.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        const lbl2 = dissolved > 0.5
          ? (zh ? '滞后已消解：回到一步之宽' : 'LAG DISSOLVED: BACK TO ONE-STEP WIDTH')
          : (zh ? '更深的锚 · 图像滞后（投射第二重心智）' : 'DEEPER ANCHOR · IMAGE LAG (PROJECTING A SECOND MIND)');
        const lblW = c.measureText(lbl2).width;
        if (a2X + 36 + lblW < W - 20) {
          c.textAlign = 'left';
          c.fillText(lbl2, a2X + 36, a2Y + 4);
        } else {
          c.textAlign = 'center';
          c.fillText(lbl2, Math.min(a2X, W - lblW / 2 - 24), a2Y + 48);
        }
        c.restore();

        // Store hitbox for click-to-dissolve interaction
        state._anchor2Hit = { x: a2X, y: a2Y, r: 62 };
      }
    }

    function drawAnchorIcon(c, x, y, r, color) {
      c.save();
      c.translate(x, y);
      c.strokeStyle = color;
      c.lineWidth = 2.6;
      c.lineCap = 'round';
      // Ring
      c.beginPath(); c.arc(0, -r * 0.85, r * 0.24, 0, Math.PI * 2); c.stroke();
      // Shank
      c.beginPath(); c.moveTo(0, -r * 0.6); c.lineTo(0, r * 0.75); c.stroke();
      // Stock bar
      c.beginPath(); c.moveTo(-r * 0.45, -r * 0.3); c.lineTo(r * 0.45, -r * 0.3); c.stroke();
      // Fluke arc
      c.beginPath(); c.arc(0, r * 0.15, r * 0.72, 0.18 * Math.PI, 0.82 * Math.PI); c.stroke();
      c.restore();
    }

    /* --- SCENE 6: FOLDED SELF-IMAGE & BOUND OF SIMULATION (Arches -> Dual Geometry) --- */
    function renderScene6(c, W, H, t) {
      const zh = state.lang === 'zh';
      const bg = c.createRadialGradient(W * 0.5, H * 0.38, 20, W * 0.5, H * 0.42, Math.max(W, H) * 0.72);
      bg.addColorStop(0, '#1e1918');
      bg.addColorStop(0.45, '#0d111a');
      bg.addColorStop(1, '#05070c');
      c.fillStyle = bg;
      c.fillRect(0, 0, W, H);

      // Subtle atmospheric callback arches receding in background mist
      c.save();
      c.translate(W * 0.5 + state.pointer.x * 16, H * 0.42 + state.pointer.y * 10);
      for (let i = 0; i < 7; i++) {
        const depth = ((i - (t * 0.25) % 1) + 7) % 7;
        const sc = Math.pow(0.72, depth);
        const ar = Math.min(W, H) * 0.44 * sc;
        c.beginPath();
        c.arc(0, ar * 0.12, ar, Math.PI, 0);
        c.strokeStyle = `rgba(210, 153, 34, ${0.14 * (1 - depth / 7)})`;
        c.lineWidth = Math.max(1, 5 * sc);
        c.stroke();
      }
      c.restore();

      // Dual Split Comparison floating cleanly above the arches
      const isNarrow = W < 760;
      const cy = H * (isNarrow ? 0.34 : 0.37);
      const panelW = isNarrow ? W * 0.43 : Math.min(W * 0.36, 400);
      const panelH = clamp(H * 0.33, 180, 260);
      const leftX = W * 0.5 - panelW * 0.55 - (isNarrow ? 6 : 22);
      const rightX = W * 0.5 + panelW * 0.55 + (isNarrow ? 6 : 22);

      // LEFT: SIMULATED RECURSION (Locked inside amber "Supplied Coordinates" cage!)
      c.save();
      c.translate(leftX, cy);
      c.fillStyle = 'rgba(13, 18, 28, 0.78)';
      drawRoundedRect(c, -panelW / 2, -panelH / 2, panelW, panelH, 12);
      c.fill();
      c.strokeStyle = '#d29922';
      c.lineWidth = 1.6;
      c.stroke();

      c.fillStyle = '#d29922';
      c.font = `700 11px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'center';
      c.fillText(zh ? '外部供给的坐标边界（模拟递归）' : 'SUPPLIED COORDINATES (SIMULATED LOOP)', 0, -panelH / 2 + 20);

      // Concentric rotating v4 rings inside the rigid box
      const gearR = Math.min(panelW, panelH) * 0.27;
      for (let g = 0; g < 3; g++) {
        c.save();
        c.rotate(t * (g % 2 === 0 ? 0.8 : -1.1) + g);
        c.beginPath();
        c.arc(0, 6, gearR * (1 - g * 0.25), 0, Math.PI * 1.65);
        c.strokeStyle = g === 0 ? '#58a6ff' : g === 1 ? '#d29922' : '#f85149';
        c.lineWidth = 2.4;
        c.stroke();
        c.restore();
      }
      // Saturation / collapse pulse label when internal loop closes
      const closedPhase = (Math.sin(t * 1.3) > 0.15);
      c.fillStyle = closedPhase ? '#f85149' : '#58a6ff';
      c.font = `600 11px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.fillText(
        closedPhase
          ? (zh ? '内部闭环 → 饱和 / 钻营代理指标' : 'CLOSED INTERNALLY → SATURATES / PROXY HACKS')
          : (zh ? 'v1 → v2 → v3 → v4（困于沙箱）' : 'v1 → v2 → v3 → v4 (INSIDE SANDBOX)'),
        0,
        panelH / 2 - 18
      );
      c.restore();

      // RIGHT: LIVING FOLDING (Open space, NO outer cage! Overtaking its own ghost portrait!)
      c.save();
      c.translate(rightX, cy);
      c.fillStyle = 'rgba(10, 20, 16, 0.45)';
      drawRoundedRect(c, -panelW / 2, -panelH / 2, panelW, panelH, 12);
      c.fill();
      c.strokeStyle = 'rgba(63, 185, 80, 0.35)';
      c.setLineDash([5, 6]);
      c.lineWidth = 1.2;
      c.stroke();
      c.setLineDash([]);

      c.fillStyle = '#3fb950';
      c.font = `700 11px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'center';
      c.fillText(zh ? '活的心智（敞开的自我折返）' : 'LIVING MIND (OPEN SELF-FOLDING)', 0, -panelH / 2 + 20);

      // Ghost past self-image circles receding behind the overtaking emerald edge
      for (let k = 3; k >= 1; k--) {
        const phase = (t * 0.65 - k * 0.22);
        const gx = Math.cos(phase) * gearR * 0.55 - k * 14;
        const gy = Math.sin(phase * 1.4) * gearR * 0.32 + 6;
        c.beginPath();
        c.arc(gx, gy, gearR * (0.45 + k * 0.08), 0, Math.PI * 2);
        c.strokeStyle = `rgba(163, 113, 247, ${0.14 * (4 - k)})`;
        c.lineWidth = 1.4;
        c.stroke();
      }
      // Active emerald edge overtaking its own ghost
      const headAng = t * 0.65;
      const hx = Math.cos(headAng) * gearR * 0.55 + 16;
      const hy = Math.sin(headAng * 1.4) * gearR * 0.32 + 6;
      c.beginPath();
      c.arc(hx, hy, gearR * 0.52, 0, Math.PI * 2);
      c.strokeStyle = '#3fb950';
      c.lineWidth = 2.4;
      c.shadowColor = 'rgba(63, 185, 80, 0.7)';
      c.shadowBlur = 14;
      c.stroke();
      c.shadowBlur = 0;

      c.beginPath();
      c.arc(hx + gearR * 0.52, hy, 5, 0, Math.PI * 2);
      c.fillStyle = '#3fb950';
      c.fill();

      c.fillStyle = '#3fb950';
      c.font = `600 11px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.fillText(
        zh ? '无需定义 · 越过旧形象（N → N + 1）' : 'UNBOUNDED · OVERTAKES PAST IMAGE (N → N + 1)',
        0,
        panelH / 2 - 18
      );
      c.restore();
    }

    /* --- SCENE 7: SELECTING THE SUN COSTS ZERO JOULES (Sun + Dyson + Blue Box + 1+1=2 vs +1) --- */
    function renderScene7(c, W, H, t) {
      const zh = state.lang === 'zh';
      c.fillStyle = '#030408';
      c.fillRect(0, 0, W, H);

      // Deep starfield
      STARS.forEach(s => {
        const sx = (s.x * 0.5 + 0.5) * W + state.pointer.x * 12 * s.z;
        const sy = (s.y * 0.5 + 0.5) * H + state.pointer.y * 12 * s.z;
        const tw = 0.35 + 0.65 * Math.sin(t * 2 + s.twinkle);
        c.fillStyle = `rgba(255, 250, 240, ${0.55 * tw})`;
        c.fillRect(sx, sy, s.r, s.r);
      });

      const cx = W * 0.5 + state.pointer.x * 20;
      const cy = H * 0.34 + state.pointer.y * 12;
      const sunR = clamp(Math.min(W, H) * 0.13, 64, 114);

      // Back half of orbiting Dyson swarm panels (z < 0)
      const swarmIn = easeOutCubic(clamp((t - 0.6) / 2.2, 0, 1));
      drawDysonHalf(c, cx, cy, sunR, t, swarmIn, false);

      // Radiant Solar Corona
      const corona = c.createRadialGradient(cx, cy, sunR * 0.75, cx, cy, sunR * 2.35);
      corona.addColorStop(0, 'rgba(255, 210, 90, 0.55)');
      corona.addColorStop(0.38, 'rgba(249, 115, 22, 0.22)');
      corona.addColorStop(1, 'rgba(249, 115, 22, 0)');
      c.fillStyle = corona;
      c.beginPath();
      c.arc(cx, cy, sunR * 2.35, 0, Math.PI * 2);
      c.fill();

      // Blazing 3D Solar Sphere
      const sphere = c.createRadialGradient(cx - sunR * 0.2, cy - sunR * 0.2, sunR * 0.08, cx, cy, sunR);
      sphere.addColorStop(0, '#fffbeb');
      sphere.addColorStop(0.32, '#fde047');
      sphere.addColorStop(0.7, '#f97316');
      sphere.addColorStop(0.95, '#b91c1c');
      sphere.addColorStop(1, '#7c2d12');
      c.beginPath();
      c.arc(cx, cy, sunR, 0, Math.PI * 2);
      c.fillStyle = sphere;
      c.fill();

      // Animated solar plasma convection filaments inside sun disc
      c.save();
      c.beginPath();
      c.arc(cx, cy, sunR * 0.98, 0, Math.PI * 2);
      c.clip();
      for (let i = 0; i < 14; i++) {
        const ang = i * 0.9 + t * 0.18;
        const rr = sunR * (0.28 + (i % 5) * 0.16);
        const px = cx + Math.cos(ang) * rr * 0.65;
        const py = cy + Math.sin(ang * 1.3) * rr * 0.55;
        c.beginPath();
        c.arc(px, py, sunR * 0.24, 0, Math.PI * 2);
        c.fillStyle = i % 2 === 0 ? 'rgba(254, 240, 138, 0.12)' : 'rgba(180, 40, 10, 0.14)';
        c.fill();
      }
      c.restore();

      // Front half of orbiting Dyson swarm panels (z >= 0)
      drawDysonHalf(c, cx, cy, sunR, t, swarmIn, true);

      // Iconic Blue Selection Box snapped around the Sun ("Select all.") + Vector Mouse Cursor on handle!
      const boxPad = sunR * 1.18;
      drawSelectionBox(c, cx - boxPad, cy - boxPad, boxPad * 2, boxPad * 2, {
        alpha: 0.95,
        rotationHandle: true,
        handleSize: 7.5
      });

      // Cursor holding the bottom-right handle — exposing it's still a layer on a screen!
      const cursorIn = smoothstep(0.9, 1.8, t);
      if (cursorIn > 0.01) {
        drawCursorArrow(
          c,
          cx + boxPad + lerp(55, 2, easeOutCubic(cursorIn)),
          cy + boxPad + lerp(40, 2, easeOutCubic(cursorIn)),
          1.15,
          cursorIn
        );
      }

      // "Select all." callback label neatly above the rotation handle
      c.fillStyle = 'rgba(240, 246, 252, 0.85)';
      c.font = `600 ${Math.round(clamp(W * 0.015, 13, 18))}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-sans')}`;
      c.textAlign = 'center';
      c.fillText(zh ? '全选。' : 'Select all.', cx, cy - boxPad - 40);

      // Symmetrical Left & Right Contrast Panels flanking the Sun (100% clear of the lower-third card!)
      const sideGap = Math.max(boxPad + 36, Math.min(W * 0.24, 240));
      const leftX = cx - sideGap;
      const rightX = cx + sideGap;
      const mono = getComputedStyle(document.documentElement).getPropertyValue('--font-mono');

      if (W > 760) {
        // Left: 1 + 1 = 2 · 10⁸⁰ · ∞
        c.textAlign = 'right';
        c.fillStyle = '#7dd3fc';
        c.font = `700 ${Math.round(clamp(W * 0.017, 15, 22))}px ${mono}`;
        c.fillText('1 + 1 = 2 · 10⁸⁰ · ∞', leftX, cy - 8);
        c.fillStyle = 'rgba(125, 211, 252, 0.82)';
        c.font = `500 11.5px ${mono}`;
        c.fillText(zh ? '纸面零能耗推演' : '0 JOULES ON PAPER', leftX, cy + 16);
        c.fillText(zh ? '凝固为符号的实无限' : 'SYMBOLIC ACTUAL INFINITY', leftX, cy + 34);

        // Right: +1
        c.textAlign = 'left';
        c.fillStyle = '#4ade80';
        c.font = `700 ${Math.round(clamp(W * 0.022, 18, 28))}px ${mono}`;
        c.fillText('+1', rightX, cy - 8);
        c.fillStyle = 'rgba(74, 222, 128, 0.88)';
        c.font = `500 11.5px ${mono}`;
        c.fillText(zh ? '真实摩擦中的不可逆行动' : 'IRREVERSIBLE STEP IN FRICTION', rightX, cy + 16);
        c.fillText(zh ? '每步有限 · 下步敞开的潜无限' : 'POTENTIAL INFINITY · OPEN NEXT STEP', rightX, cy + 34);
      } else {
        // Narrow viewport fallback cleanly above lower-third
        const barY = cy + boxPad + 30;
        c.textAlign = 'center';
        c.fillStyle = '#7dd3fc';
        c.font = `700 13px ${mono}`;
        c.fillText('1 + 1 = 2 · 10⁸⁰   vs.   +1', cx, barY);
      }
    }

    function drawDysonHalf(c, cx, cy, sunR, t, swarmIn, front) {
      if (swarmIn <= 0.01) return;
      DYSON_PANELS.forEach(p => {
        const local = easeOutCubic(clamp((t - 0.5 - p.delay * 0.55) / 1.1, 0, 1));
        if (local <= 0.01) return;
        const th = p.theta + t * p.speed;
        const r = sunR * lerp(2.6, p.orbitR, local);
        const x = Math.sin(p.phi) * Math.cos(th) * r;
        const y = Math.cos(p.phi) * r * 0.92;
        const z = Math.sin(p.phi) * Math.sin(th) * r;
        if ((front && z < 0) || (!front && z >= 0)) return;
        const sz = sunR * p.size * (0.75 + 0.35 * ((z / r) + 1) * 0.5);
        c.save();
        c.translate(cx + x, cy + y);
        c.rotate(th * 0.5);
        c.fillStyle = front ? 'rgba(18, 22, 30, 0.92)' : 'rgba(28, 34, 48, 0.65)';
        c.strokeStyle = front ? 'rgba(251, 146, 60, 0.45)' : 'rgba(251, 146, 60, 0.2)';
        c.lineWidth = 0.8;
        c.fillRect(-sz / 2, -sz * 0.42, sz, sz * 0.84);
        c.strokeRect(-sz / 2, -sz * 0.42, sz, sz * 0.84);
        c.restore();
      });
    }

    /* --- SCENE 8: 1° INSIDE THE PLANE VS 90° ORTHOGONAL MSB --- */
    function renderScene8(c, W, H, t) {
      const zh = state.lang === 'zh';
      c.fillStyle = '#060911';
      c.fillRect(0, 0, W, H);

      const yaw = -0.58 + state.pointer.x * 0.22;
      const pitch = 0.44 + state.pointer.y * 0.14;
      const fov = Math.min(W, H) * 0.82;
      const camZ = 6.4;

      function proj(x, y, z) {
        const x1 = x * Math.cos(yaw) - z * Math.sin(yaw);
        const z1 = x * Math.sin(yaw) + z * Math.cos(yaw);
        const y2 = y * Math.cos(pitch) - z1 * Math.sin(pitch);
        const z2 = y * Math.sin(pitch) + z1 * Math.cos(pitch) + camZ;
        const s = fov / Math.max(0.4, z2);
        return { x: W * 0.5 + x1 * s, y: H * 0.43 - y2 * s, s };
      }

      const rise = easeInOutCubic((t - 1.35) / 1.55);

      // Stepped parallel planes revealed once 90° MSB rises (lower plane stays 100% intact!)
      const planeLevels = [0, 0.72, 1.44];
      planeLevels.forEach((py, idx) => {
        const alpha = idx === 0 ? 1 : smoothstep(0.15 + idx * 0.2, 0.7 + idx * 0.15, rise);
        if (alpha <= 0.01) return;
        const p0 = proj(-2.2, py - 0.5, -1.6);
        const p1 = proj(2.2, py - 0.5, -1.6);
        const p2 = proj(2.2, py - 0.5, 1.6);
        const p3 = proj(-2.2, py - 0.5, 1.6);
        c.beginPath();
        c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y);
        c.lineTo(p2.x, p2.y); c.lineTo(p3.x, p3.y);
        c.closePath();
        c.fillStyle = idx === 0
          ? 'rgba(210, 153, 34, 0.06)'
          : `rgba(63, 185, 80, ${0.055 * alpha})`;
        c.fill();
        c.strokeStyle = idx === 0
          ? 'rgba(210, 153, 34, 0.34)'
          : `rgba(63, 185, 80, ${0.32 * alpha})`;
        c.lineWidth = 1.2;
        c.stroke();
      });

      // Base plane subtle grid
      c.strokeStyle = 'rgba(210, 153, 34, 0.11)';
      c.lineWidth = 1;
      for (let g = -2; g <= 2; g += 0.5) {
        const a = proj(g, -0.5, -1.5); const b = proj(g, -0.5, 1.5);
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      }

      // Two golden arrows separated by 1° (exaggerated slightly in render for legibility while labeled 1°)
      const orig = proj(-1.4, -0.5, 0);
      const vBase = proj(2.0, -0.5, 0);
      const vTilt = proj(2.0, -0.5, 0.42);

      c.strokeStyle = 'rgba(210, 153, 34, 0.55)';
      c.lineWidth = 2;
      c.setLineDash([5, 5]);
      c.beginPath(); c.moveTo(orig.x, orig.y); c.lineTo(vBase.x, vBase.y); c.stroke();
      c.setLineDash([]);

      c.strokeStyle = '#d29922';
      c.lineWidth = 2.8;
      c.beginPath(); c.moveTo(orig.x, orig.y); c.lineTo(vTilt.x, vTilt.y); c.stroke();

      c.fillStyle = '#d29922';
      c.font = `700 12.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
      c.textAlign = 'left';
      c.fillText(zh ? '1°（仍在同一平面内）' : '1° (STILL INSIDE THE SAME PLANE)', vTilt.x + 10, vTilt.y + 4);

      // Emerald 90° orthogonal vector rising straight UP from the origin!
      if (rise > 0.01) {
        const top = proj(-1.4, -0.5 + 2.05 * rise, 0);
        c.save();
        c.strokeStyle = '#3fb950';
        c.lineWidth = 3.8;
        c.shadowColor = 'rgba(63, 185, 80, 0.85)';
        c.shadowBlur = 18;
        c.beginPath(); c.moveTo(orig.x, orig.y); c.lineTo(top.x, top.y); c.stroke();
        c.shadowBlur = 0;

        // Right-angle bracket
        const r1 = proj(-1.12, -0.5, 0);
        const r2 = proj(-1.12, -0.22, 0);
        const r3 = proj(-1.4, -0.22, 0);
        c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(r1.x, r1.y); c.lineTo(r2.x, r2.y); c.lineTo(r3.x, r3.y); c.stroke();

        // MSB glowing orb
        c.beginPath(); c.arc(top.x, top.y, 7.5, 0, Math.PI * 2);
        c.fillStyle = '#3fb950';
        c.fill();

        c.fillStyle = '#3fb950';
        c.font = `700 13px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        c.textAlign = 'left';
        c.fillText(zh ? '90° · 新的最高有效位（MSB）· 内积 = 0' : '90° · NEW MSB · INNER PRODUCT = 0', top.x + 14, top.y + 4);
        c.restore();
      }
    }

    /* --- SCENE 9: NOTICE WHO HAD TO ASK (Stark White Callback + Unwind + Dissolution) --- */
    function renderScene9(c, W, H, t) {
      const zh = state.lang === 'zh';
      // Starts stark white inside dark void tilted -1.25°, holds in silence, then unwinds & dissolves box
      const reveal = easeInOutCubic((t - 1.35) / 1.35);
      const angle = lerp(-1.25 * Math.PI / 180, 0, reveal);

      if (t > 1.4 && !state.scene10CuePlayed) {
        state.scene10CuePlayed = true;
        sound.tick(523.25, 0.06, 0.06);
      }

      c.fillStyle = '#0c1017';
      c.fillRect(0, 0, W, H);

      const margin = Math.min(W, H) * lerp(0.036, 0.0, reveal);
      const slideW = W - margin * 2;
      const slideH = H - margin * 2;

      c.save();
      c.translate(W / 2, H / 2);
      c.rotate(angle);

      c.fillStyle = '#fcfcfd';
      c.fillRect(-slideW / 2, -slideH / 2, slideW, slideH);

      // Blue selection frame fades and dissolves into calm light
      drawSelectionBox(c, -slideW / 2 + 12, -slideH / 2 + 12, slideW - 24, slideH - 24, {
        alpha: 1 - reveal,
        rotationHandle: true,
        handleSize: 8
      });

      const qSize = Math.round(clamp(W * 0.04, 26, 52));
      const subSize = Math.round(clamp(W * 0.028, 20, 34));
      const sans = getComputedStyle(document.documentElement).getPropertyValue('--font-sans');
      const serif = getComputedStyle(document.documentElement).getPropertyValue('--font-serif');

      // Original closing lines gently recede slightly upward as the realization lands below
      const lift = lerp(0, -H * 0.11, reveal);

      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillStyle = `rgba(17, 24, 39, ${lerp(0.95, 0.34, reveal)})`;
      c.font = `600 ${qSize}px ${sans}`;
      c.fillText(zh ? '还有什么问题吗？' : 'Any questions?', 0, lift - qSize * 0.72);

      c.fillStyle = `rgba(17, 24, 39, ${lerp(0.95, 0.42, reveal)})`;
      c.font = `400 ${subSize}px ${sans}`;
      const askText = zh ? '你想要什么？' : 'What do you want?';
      c.fillText(askText, 0, lift + qSize * 0.32);

      // Emerald vertical causal brace pointing directly down from "What do you want?"
      if (reveal > 0.05) {
        const lineLen = lerp(0, H * 0.11, reveal);
        c.strokeStyle = '#15803d';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(0, lift + qSize * 0.32 + subSize * 0.85);
        c.lineTo(0, lift + qSize * 0.32 + subSize * 0.85 + lineLen);
        c.stroke();

        // The devastating realization
        const revTextAlpha = smoothstep(0.35, 1.0, reveal);
        const punchY = lift + qSize * 0.32 + subSize * 0.85 + lineLen + 38;
        c.globalAlpha = revTextAlpha;
        c.fillStyle = '#0f172a';
        c.font = `700 ${Math.round(clamp(W * 0.036, 24, 48))}px ${serif}`;
        c.fillText(zh ? '留意是谁不得不发问。' : 'Notice who had to ask.', 0, punchY);

        c.fillStyle = 'rgba(15, 23, 42, 0.68)';
        c.font = `400 ${Math.round(clamp(W * 0.0155, 13.5, 19))}px ${sans}`;
        const explain1 = zh
          ? '走过 10⁸⁰ 页幻灯片、轨道曲线与被框住的太阳之后，演示的终点依然只能转身问你。'
          : 'After 10⁸⁰ slides, orbital charts, and a captured Sun, the deck still turns back to you.';
        const explain2 = zh
          ? '因为总在倾听者无法发起。'
          : 'Because what always listens cannot originate.';
        c.fillText(explain1, 0, punchY + 48);
        c.fillStyle = '#15803d';
        c.font = `600 ${Math.round(clamp(W * 0.0165, 14.5, 20))}px ${sans}`;
        c.fillText(explain2, 0, punchY + 78);
        c.globalAlpha = 1;
      }

      c.restore();
    }

    /* --- SCENE 10: EVERYTHING STARTS WITH THE MIND (Serene Living Ripple Field) --- */
    function renderScene10(c, W, H, t) {
      // Exact serene charcoal of the Not a ToE Living Book (#0b0b0b)
      c.fillStyle = '#0b0b0b';
      c.fillRect(0, 0, W, H);

      // Gentle concentric breathing ripples anchored on the observer's own locus/pointer
      const cx = W * 0.5 + state.pointer.x * 65;
      const cy = H * 0.5 + state.pointer.y * 45;
      const maxR = Math.max(W, H) * 0.62;

      for (let i = 0; i < 9; i++) {
        const phase = ((t * 0.14 + i / 9) % 1);
        const r = phase * maxR;
        const alpha = Math.sin(phase * Math.PI) * 0.13;
        c.beginPath();
        c.arc(cx, cy, r, 0, Math.PI * 2);
        c.strokeStyle = i % 3 === 0
          ? `rgba(63, 185, 80, ${alpha * 1.15})`
          : `rgba(242, 242, 242, ${alpha * 0.65})`;
        c.lineWidth = 1;
        c.stroke();
      }

      // Soft central breathing luminance
      const glow = c.createRadialGradient(cx, cy, 4, cx, cy, Math.min(W, H) * 0.42);
      glow.addColorStop(0, 'rgba(63, 185, 80, 0.075)');
      glow.addColorStop(1, 'rgba(63, 185, 80, 0)');
      c.fillStyle = glow;
      c.fillRect(0, 0, W, H);

      // Trigger secondary headline reveal cleanly at t > 1.05s
      const sec = document.getElementById('headline-sec');
      if (sec && t > 0.95 && !sec.classList.contains('visible')) {
        sec.classList.add('visible');
      }
    }

    /* --- SCENE 11: LIVING BOOK CONSTELLATION (14 Parts · 473+ Essays) --- */
    function renderScene11(c, W, H, t) {
      const bg = c.createRadialGradient(W * 0.5, H * 0.5, 20, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
      bg.addColorStop(0, '#0f1622');
      bg.addColorStop(0.6, '#080b12');
      bg.addColorStop(1, '#040609');
      c.fillStyle = bg;
      c.fillRect(0, 0, W, H);

      const cx = W * 0.5;
      const cy = H * 0.5;
      const scale = Math.min(W, H);
      const rot = t * 0.04 + state.pointer.x * 0.18;

      const projectedCenters = CONSTELLATION.map(node => {
        const rx = node.cx * Math.cos(rot) - node.cz * Math.sin(rot);
        const rz = node.cx * Math.sin(rot) + node.cz * Math.cos(rot);
        const persp = 1.35 / (1.35 - rz * 0.5);
        return {
          x: cx + rx * scale * persp,
          y: cy + (node.cy + state.pointer.y * 0.04) * scale * persp,
          persp,
          node
        };
      });

      // Synaptic links between neighboring parts in the Living Book lattice
      c.strokeStyle = 'rgba(88, 166, 255, 0.12)';
      c.lineWidth = 1;
      for (let i = 0; i < projectedCenters.length; i++) {
        const a = projectedCenters[i];
        const b = projectedCenters[(i + 1) % projectedCenters.length];
        const d = projectedCenters[(i + 4) % projectedCenters.length];
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(d.x, d.y); c.stroke();
      }

      // Draw all 473+ essay star points clustered around their 14 Part hubs
      projectedCenters.forEach(({ x, y, persp, node }) => {
        node.stars.forEach(st => {
          const sx = x + st.ox * scale * persp;
          const sy = y + st.oy * scale * persp;
          const tw = 0.45 + 0.55 * Math.sin(t * 1.8 + st.phase);
          c.beginPath();
          c.arc(sx, sy, st.r * persp * 0.85, 0, Math.PI * 2);
          c.fillStyle = `rgba(240, 246, 252, ${0.42 * tw})`;
          c.fill();
        });
        // Part hub jewel
        c.beginPath();
        c.arc(x, y, 4.2 * persp, 0, Math.PI * 2);
        c.fillStyle = '#3fb950';
        c.fill();
      });
    }

    const RENDERERS = [
      renderScene0,
      renderScene1,
      renderScene2,
      renderScene3,
      renderScene4,
      renderScene5,
      renderScene6,
      renderScene7,
      renderScene8,
      renderScene9,
      renderScene10,
      renderScene11
    ];

    /* =========================================================================
       DOM & STATE SYNCHRONIZATION
       ========================================================================= */
    function renderDOM() {
      const s = SCENES[state.scene];
      const L = state.lang;
      const ui = UI[L];

      document.documentElement.setAttribute('data-lang', L);
      document.documentElement.setAttribute('lang', L === 'zh' ? 'zh-CN' : 'en');
      document.documentElement.setAttribute('data-theme', s.theme);

      dom.brandText.textContent = ui.brand;
      dom.btnLang.textContent = ui.langToggle;
      dom.lblAuto.textContent = state.autoplay ? ui.autoOn : ui.autoOff;
      dom.btnAuto.classList.toggle('active', state.autoplay);
      dom.lblSound.textContent = sound.enabled ? ui.soundOn : ui.soundOff;
      dom.btnSound.classList.toggle('active', sound.enabled);
      dom.startWhisper.textContent = ui.startWhisper;

      // Alignment
      dom.copyStage.className = '';
      if (s.align === 'center') dom.copyStage.classList.add('align-center');
      else if (s.align === 'top') dom.copyStage.classList.add('align-top');
      else if (s.align === 'bottom-center') dom.copyStage.classList.add('align-bottom-center');

      // Copy Card
      if (s.hideCopyCard) {
        dom.copyCard.style.display = 'none';
      } else {
        dom.copyCard.style.display = '';
        dom.copyCard.classList.toggle('scrim', Boolean(s.scrim));
        dom.kicker.textContent = s.kicker[L] || '';
        dom.kicker.style.display = s.kicker[L] ? '' : 'none';

        dom.headline.className = 'headline' + (s.serif ? ' serif' : '');
        if (s.headline2) {
          dom.headline.innerHTML = '';
          dom.headline.appendChild(document.createTextNode(s.headline[L]));
          const span = document.createElement('span');
          span.id = 'headline-sec';
          span.className = 'headline-secondary' + (state.sceneTime > 0.95 ? ' visible' : '');
          span.textContent = s.headline2[L];
          dom.headline.appendChild(span);
        } else {
          dom.headline.textContent = s.headline[L] || '';
        }

        dom.subcopy.className = 'subcopy' + (s.serif ? ' serif' : '');
        dom.subcopy.textContent = s.sub[L] || '';

        dom.hintSlot.innerHTML = '';
        if (s.hint && s.hint[L]) {
          const pill = document.createElement('div');
          pill.className = 'interaction-hint';
          pill.textContent = '✦ ' + s.hint[L];
          dom.hintSlot.appendChild(pill);
        }

        // Smooth entrance re-trigger
        dom.copyCard.classList.add('entering');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => dom.copyCard.classList.remove('entering'));
        });
      }

      // Portal panel on Scene 12
      if (s.portal) {
        dom.portalTitle.textContent = ui.portalTitle;
        dom.portalSub.textContent = ui.portalSub;
        dom.portalStats.textContent = ui.portalStats;
        dom.ctaBook.textContent = ui.ctaBook;
        dom.ctaIndex.textContent = ui.ctaIndex;
        dom.ctaReplay.textContent = ui.ctaReplay;

        dom.portalGrid.innerHTML = '';
        PORTAL_ESSAYS.forEach(item => {
          const a = document.createElement('a');
          a.className = 'portal-card';
          a.href = `../posts/${item.slug}/`;
          const k = document.createElement('span');
          k.className = 'portal-card-kicker';
          k.textContent = item.tag[L];
          const t = document.createElement('span');
          t.className = 'portal-card-title';
          t.textContent = item.title[L];
          a.append(k, t);
          dom.portalGrid.appendChild(a);
        });
        dom.portalPanel.classList.add('visible');
      } else {
        dom.portalPanel.classList.remove('visible');
      }

      // Bottom Citations
      dom.citations.innerHTML = '';
      (s.cites || []).forEach(cite => {
        const a = document.createElement('a');
        a.className = 'cite-pill';
        a.href = `../posts/${cite.slug}/`;
        a.textContent = '↗ ' + cite[L];
        dom.citations.appendChild(a);
      });

      // Counter & Nav Arrows & Progress Hairline
      dom.counter.textContent = s.counter[L];
      dom.btnPrev.disabled = state.scene === 0;
      dom.btnNext.disabled = state.scene === SCENES.length - 1;
      dom.progressFill.style.width = `${((state.scene + 1) / SCENES.length) * 100}%`;

      if (state.scene !== 0) dom.startWhisper.classList.remove('visible');
    }

    function goToScene(idx) {
      const target = clamp(idx, 0, SCENES.length - 1);
      if (target === state.scene && state.sceneTime > 0.1) return;
      state.scene = target;
      state.sceneTime = 0;
      state.orbitOverride = null;
      state.secondAnchorCut = false;
      state.lastBetterStep = -1;
      state.scene1StraightCue = false;
      state.scene6CutCue = false;
      state.scene4OrbitCue = false;
      state.scene10CuePlayed = false;
      state._anchor2Hit = null;

      try { history.replaceState(null, '', `#${target + 1}`); } catch (_) {}
      sound.setScene(target);
      sound.tick(target === 9 ? 360 : 540, 0.04, 0.055);
      renderDOM();
    }

    function nextScene() {
      state.userInteracted = true;
      if (state.scene < SCENES.length - 1) goToScene(state.scene + 1);
    }

    function prevScene() {
      state.userInteracted = true;
      if (state.scene > 0) goToScene(state.scene - 1);
    }

    function toggleLang() {
      state.lang = state.lang === 'en' ? 'zh' : 'en';
      renderDOM();
      sound.tick(720, 0.03, 0.05);
    }

    function toggleAutoplay() {
      state.userInteracted = true;
      state.autoplay = !state.autoplay;
      if (state.autoplay && state.scene === SCENES.length - 1) {
        goToScene(0);
      }
      renderDOM();
    }

    function toggleSound() {
      sound.setEnabled(!sound.enabled);
      renderDOM();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    /* =========================================================================
       INPUT HANDLERS (Keyboard, Click, Drag, Touch Swipe)
       ========================================================================= */
    window.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') {
        if (document.activeElement && document.activeElement.tagName === 'A') return;
        e.preventDefault();
        nextScene();
      } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') {
        e.preventDefault();
        prevScene();
      } else if (k === 'a' || k === 'A') {
        e.preventDefault();
        toggleAutoplay();
      } else if (k === 'l' || k === 'L') {
        e.preventDefault();
        toggleLang();
      } else if (k === 'm' || k === 'M') {
        e.preventDefault();
        toggleSound();
      } else if (k === 'f' || k === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (k === 'Home') {
        e.preventDefault();
        goToScene(0);
      } else if (k === 'End') {
        e.preventDefault();
        goToScene(SCENES.length - 1);
      }
    });

    dom.btnLang.addEventListener('click', e => { e.stopPropagation(); toggleLang(); });
    dom.btnAuto.addEventListener('click', e => { e.stopPropagation(); toggleAutoplay(); });
    dom.btnSound.addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
    dom.btnFs.addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); });
    dom.btnPrev.addEventListener('click', e => { e.stopPropagation(); prevScene(); });
    dom.btnNext.addEventListener('click', e => { e.stopPropagation(); nextScene(); });
    dom.ctaReplay.addEventListener('click', e => { e.stopPropagation(); state.autoplay = false; goToScene(0); });

    // Pointer tracking + Scene 4 horizontal drag + Scene 6 click-to-dissolve anchor + stage click navigation
    let dragMoved = false;
    let downX = 0;
    let downY = 0;

    window.addEventListener('pointermove', e => {
      state.pointer.tx = (e.clientX / state.w - 0.5) * 2;
      state.pointer.ty = (e.clientY / state.h - 0.5) * 2;
      if (state.pointer.down) {
        const dx = e.clientX - downX;
        if (Math.abs(dx) > 10) dragMoved = true;
        if (state.scene === 3 && Math.abs(dx) > 8) {
          const base = state.orbitOverride !== null ? state.orbitOverride : easeInOutCubic((state.sceneTime - 2.3) / 2.2);
          state.orbitOverride = clamp(base + (e.movementX || 0) / (state.w * 0.45), 0, 1);
        }
      }
    });

    window.addEventListener('pointerdown', e => {
      if (e.target.closest('a, button, #portal-panel')) return;
      state.pointer.down = true;
      downX = e.clientX;
      downY = e.clientY;
      dragMoved = false;
    });

    window.addEventListener('pointerup', e => {
      if (!state.pointer.down) return;
      state.pointer.down = false;
      if (e.target.closest('a, button, #portal-panel')) return;

      const dx = e.clientX - downX;
      const dy = e.clientY - downY;

      // Mobile / desktop swipe detection (except Scene 4 orbit drag)
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4 && state.scene !== 3) {
        if (dx < 0) nextScene();
        else prevScene();
        return;
      }

      if (dragMoved) return;

      // Scene 6 interactive click on deeper anchor!
      if (state.scene === 5 && state._anchor2Hit && !state.secondAnchorCut) {
        const hit = state._anchor2Hit;
        const dist = Math.hypot(e.clientX - hit.x, e.clientY - hit.y);
        if (dist <= hit.r) {
          state.secondAnchorCut = true;
          state.secondAnchorCutTime = state.sceneTime;
          sound.chime([392, 523.25, 659.25]);
          return;
        }
      }

      // Click left 22% = prev, right 78% = next
      if (e.clientX < state.w * 0.22 && state.scene > 0) prevScene();
      else nextScene();
    });

    /* =========================================================================
       RESIZE & MAIN 60FPS ANIMATION LOOP
       ========================================================================= */
    function resize() {
      state.w = window.innerWidth;
      state.h = window.innerHeight;
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(state.w * state.dpr);
      canvas.height = Math.round(state.h * state.dpr);
      canvas.style.width = state.w + 'px';
      canvas.style.height = state.h + 'px';
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    let lastTs = performance.now();
    function frame(ts) {
      const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
      lastTs = ts;
      state.globalTime += dt;
      state.sceneTime += dt;

      // Smooth observer parallax interpolation
      state.pointer.x += (state.pointer.tx - state.pointer.x) * Math.min(1, dt * 6);
      state.pointer.y += (state.pointer.ty - state.pointer.y) * Math.min(1, dt * 6);

      // Autoplay progression
      if (state.autoplay && state.scene < SCENES.length - 1) {
        if (state.sceneTime >= SCENES[state.scene].duration) {
          goToScene(state.scene + 1);
        }
      }

      RENDERERS[state.scene](ctx, state.w, state.h, state.sceneTime);
      requestAnimationFrame(frame);
    }

    renderDOM();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
