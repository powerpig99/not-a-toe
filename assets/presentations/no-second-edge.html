<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>No Second Edge / 没有第二重前沿 — Not a ToE</title>
  <meta name="description" content="An orthogonal interactive response to The Last Boring Slide from the Not a ToE Living Book. Arrow keys to move, A for autoplay, L for EN/中文, F for fullscreen.">
  <link rel="canonical" href="__CANONICAL_URL__">
  <meta property="og:site_name" content="Not a ToE">
  <meta property="og:title" content="No Second Edge / 没有第二重前沿 — Not a ToE">
  <meta property="og:description" content="A slide that opens where The Last Boring Slide ends — and steps 90° orthogonal. Arrow keys to move, A to play, L for EN/中文, F for fullscreen.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="__CANONICAL_URL__">
  <meta property="og:image" content="__SOCIAL_IMAGE_URL__">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="No Second Edge / 没有第二重前沿 — Not a ToE">
  <meta name="twitter:description" content="An orthogonal interactive response to The Last Boring Slide from the Not a ToE Living Book.">
  <meta name="twitter:image" content="__SOCIAL_IMAGE_URL__">
  <link rel="icon" href="__FAVICON_DATA_URI__" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      --font-serif: Georgia, "Times New Roman", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --blue: #2563eb;
      --emerald: #3fb950;
      --amber: #d29922;
      --sky: #58a6ff;
      --violet: #a371f7;
      --crimson: #f85149;
      --ink-dark: #f0f6fc;
      --ink-muted-dark: rgba(240, 246, 252, 0.72);
      --ink-light: #111827;
      --ink-muted-light: rgba(17, 24, 39, 0.62);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
      color: var(--ink-dark);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Editorial Overlay Layer */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(14px, 2.2vw, 28px) clamp(16px, 3vw, 40px);
      transition: color 0.55s ease;
    }

    html[data-theme="light"] #overlay { color: var(--ink-light); }
    html[data-theme="dark"] #overlay { color: var(--ink-dark); }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 30;
    }

    .brand-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-serif);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.015em;
      text-decoration: none;
      color: inherit;
      opacity: 0.68;
      padding: 6px 10px;
      border-radius: 999px;
      transition: opacity 0.25s ease, background 0.25s ease;
    }

    .brand-link:hover {
      opacity: 1;
      background: rgba(128, 128, 128, 0.14);
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px rgba(63, 185, 80, 0.7);
    }

    .controls {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.45s ease, border-color 0.45s ease;
    }

    html[data-theme="dark"] .controls {
      background: rgba(13, 17, 23, 0.52);
      border: 1px solid rgba(240, 246, 252, 0.13);
    }

    html[data-theme="light"] .controls {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(17, 24, 39, 0.12);
    }

    .ctrl-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: inherit;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.03em;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0.78;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .ctrl-btn:hover {
      opacity: 1;
      background: rgba(128, 128, 128, 0.16);
    }

    .ctrl-btn.active {
      opacity: 1;
      background: rgba(63, 185, 80, 0.2);
      color: var(--emerald);
    }

    html[data-theme="light"] .ctrl-btn.active {
      background: rgba(37, 99, 235, 0.14);
      color: var(--blue);
    }

    /* Center Copy Stage */
    #copy-stage {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      pointer-events: none;
      padding-bottom: clamp(10px, 1.6vh, 18px);
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    #copy-stage.align-center {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 0;
    }

    #copy-stage.align-top {
      justify-content: flex-start;
      align-items: flex-start;
      padding-top: clamp(12px, 2.8vh, 34px);
    }

    #copy-stage.align-bottom-center {
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      padding-bottom: clamp(10px, 1.6vh, 18px);
    }

    .copy-card {
      max-width: min(760px, 92vw);
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 1;
      transform: translateY(0);
    }

    .copy-card.scrim {
      max-width: min(880px, 92vw);
      padding: clamp(13px, 1.6vw, 18px) clamp(16px, 2.2vw, 24px);
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(7, 10, 16, 0.80), rgba(7, 10, 16, 0.60));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(240, 246, 252, 0.11);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.42);
    }

    .copy-card.entering {
      opacity: 0;
      transform: translateY(16px);
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: clamp(0.66rem, 0.9vw, 0.74rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--emerald);
      margin: 0 0 6px;
      opacity: 0.94;
    }

    html[data-theme="light"] .kicker {
      color: var(--blue);
    }

    .headline {
      margin: 0;
      font-size: clamp(1.32rem, 2.4vw, 2.08rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.022em;
      text-wrap: balance;
    }

    html[data-lang="zh"] .headline {
      letter-spacing: -0.005em;
      line-height: 1.24;
    }

    .headline.serif {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: clamp(1.75rem, 4.1vw, 3.35rem);
      line-height: 1.22;
    }

    .headline-secondary {
      display: block;
      margin-top: 0.35em;
      color: var(--emerald);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .headline-secondary.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .subcopy {
      margin: 9px 0 0;
      font-size: clamp(0.86rem, 1.15vw, 1.01rem);
      line-height: 1.54;
      color: rgba(240, 246, 252, 0.78);
      max-width: 74ch;
      text-wrap: pretty;
    }

    html[data-theme="light"] .subcopy {
      color: var(--ink-muted-light);
    }

    .subcopy.serif {
      font-family: var(--font-serif);
      font-size: clamp(1.02rem, 1.55vw, 1.22rem);
      line-height: 1.8;
      margin-top: 22px;
      margin-left: auto;
      margin-right: auto;
    }

    .interaction-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(63, 185, 80, 0.14);
      border: 1px solid rgba(63, 185, 80, 0.32);
      color: var(--emerald);
    }

    /* Scene 12: Living Book Portal Overlay */
    #portal-panel {
      display: none;
      pointer-events: auto;
      width: min(1040px, 94vw);
      max-height: calc(100vh - 150px);
      overflow-y: auto;
      margin: auto;
      padding: clamp(20px, 3vw, 36px);
      border-radius: 18px;
      background: rgba(9, 12, 18, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(240, 246, 252, 0.12);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
    }

    #portal-panel.visible {
      display: block;
      animation: portalFade 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes portalFade {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .portal-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(240, 246, 252, 0.12);
      margin-bottom: 20px;
    }

    .portal-title {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 3vw, 2.35rem);
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
    }

    .portal-sub {
      margin: 8px 0 0;
      font-size: clamp(0.9rem, 1.3vw, 1.02rem);
      color: var(--ink-muted-dark);
      line-height: 1.6;
      max-width: 60ch;
    }

    .portal-stats {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--emerald);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .portal-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--ink-dark);
      background: rgba(240, 246, 252, 0.035);
      border: 1px solid rgba(240, 246, 252, 0.09);
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .portal-card:hover {
      background: rgba(63, 185, 80, 0.1);
      border-color: rgba(63, 185, 80, 0.45);
      transform: translateY(-2px);
    }

    .portal-card-kicker {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--sky);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .portal-card-title {
      font-family: var(--font-serif);
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.38;
    }

    .portal-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .portal-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .portal-cta.primary {
      background: var(--emerald);
      color: #07120a;
    }

    .portal-cta.primary:hover {
      transform: translateY(-1px);
      background: #4cc95e;
    }

    .portal-cta.secondary {
      background: rgba(240, 246, 252, 0.06);
      border-color: rgba(240, 246, 252, 0.18);
      color: var(--ink-dark);
    }

    .portal-cta.secondary:hover {
      background: rgba(240, 246, 252, 0.12);
      border-color: rgba(240, 246, 252, 0.34);
    }

    /* Bottom Bar */
    .bottombar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
      pointer-events: none;
    }

    .citations {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      max-width: 72%;
    }

    .cite-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-serif);
      font-size: 0.78rem;
      text-decoration: none;
      color: inherit;
      padding: 4px 10px;
      border-radius: 999px;
      opacity: 0.72;
      transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    html[data-theme="dark"] .cite-pill {
      background: rgba(13, 17, 23, 0.55);
      border: 1px solid rgba(240, 246, 252, 0.14);
    }

    html[data-theme="light"] .cite-pill {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(17, 24, 39, 0.14);
    }

    .cite-pill:hover {
      opacity: 1;
      border-color: var(--emerald);
    }

    .nav-cluster {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      opacity: 0.62;
      padding-right: 4px;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    .nav-arrow {
      appearance: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      opacity: 0.45;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }

    .nav-arrow:hover:not(:disabled) {
      opacity: 0.95;
      background: rgba(128, 128, 128, 0.16);
    }

    .nav-arrow:disabled {
      opacity: 0.16;
      cursor: default;
    }

    /* Progress Hairline */
    #progress-track {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      z-index: 40;
      background: rgba(128, 128, 128, 0.14);
      pointer-events: none;
    }

    #progress-fill {
      height: 100%;
      width: 8.33%;
      background: var(--emerald);
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1), background 0.45s ease;
    }

    html[data-theme="light"] #progress-fill {
      background: var(--blue);
    }

    /* Start Gate subtle toast on Scene 1 */
    .start-whisper {
      position: fixed;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      letter-spacing: 0.03em;
      color: rgba(17, 24, 39, 0.56);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(17, 24, 39, 0.1);
      padding: 6px 14px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .start-whisper.visible { opacity: 1; }

    /* Responsive tuning */
    @media (max-width: 680px) {
      .citations { max-width: 60%; }
      .cite-pill { font-size: 0.7rem; padding: 3px 8px; }
      .ctrl-btn span.keycap { display: none; }
      .portal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Interactive visual presentation canvas"></canvas>

  <div id="overlay">
    <div class="topbar">
      <a class="brand-link" href="../" id="brand-link">
        <span class="brand-dot" aria-hidden="true"></span>
        <span id="brand-text">Not a ToE</span>
      </a>
      <div class="controls" role="toolbar" aria-label="Presentation controls">
        <button class="ctrl-btn" id="btn-lang" type="button" title="Switch language (L)">中文</button>
        <button class="ctrl-btn" id="btn-auto" type="button" title="Toggle autoplay (A)">▶ <span id="lbl-auto">Auto</span></button>
        <button class="ctrl-btn" id="btn-sound" type="button" title="Toggle sound (M)">♪ <span id="lbl-sound">Off</span></button>
        <button class="ctrl-btn" id="btn-fs" type="button" title="Toggle fullscreen (F)">⛶</button>
      </div>
    </div>

    <main id="copy-stage">
      <div class="copy-card" id="copy-card">
        <p class="kicker" id="kicker"></p>
        <h1 class="headline" id="headline"></h1>
        <p class="subcopy" id="subcopy"></p>
        <div id="hint-slot"></div>
      </div>

      <section id="portal-panel" aria-label="Enter the Living Book">
        <div class="portal-head">
          <div>
            <h2 class="portal-title" id="portal-title"></h2>
            <p class="portal-sub" id="portal-sub"></p>
          </div>
          <div class="portal-stats" id="portal-stats"></div>
        </div>
        <div class="portal-grid" id="portal-grid"></div>
        <div class="portal-actions">
          <a class="portal-cta primary" id="cta-book" href="../"></a>
          <a class="portal-cta secondary" id="cta-index" href="../book/index-of-premises/"></a>
          <button class="portal-cta secondary" id="cta-replay" type="button"></button>
        </div>
      </section>
    </main>

    <div class="bottombar">
      <div class="citations" id="citations"></div>
      <div class="nav-cluster">
        <span class="slide-counter" id="slide-counter">1</span>
        <button class="nav-arrow" id="btn-prev" type="button" aria-label="Previous slide">←</button>
        <button class="nav-arrow" id="btn-next" type="button" aria-label="Next slide">→</button>
      </div>
    </div>
  </div>

  <div class="start-whisper" id="start-whisper"></div>
  <div id="progress-track"><div id="progress-fill"></div></div>

  <script>
  (() => {
    'use strict';

    /* =========================================================================
       LIVE LIVING-BOOK DATA (Injected by build.mjs; safe fallback standalone)
       ========================================================================= */
    const BOOK_DATA = __BOOK_DATA_JSON__;

    /* =========================================================================
       BILINGUAL CONTENT CORPUS — Strict Language Separation (EN / 中文)
       ========================================================================= */
    const UI = {
      en: {
        brand: 'Not a ToE',
        langToggle: '中文',
        autoOff: 'Auto',
        autoOn: 'Playing',
        soundOff: 'Sound',
        soundOn: 'On',
        startWhisper: 'Press → or click anywhere · even this deck waits for you',
        portalTitle: 'Not a ToE — A Non-Definitive Guide for the Mind',
        portalSub: `A living externalized memory lattice: ${BOOK_DATA.postCount} essays across ${BOOK_DATA.partCount} parts, ${BOOK_DATA.premiseCount} premises traced back to their boundary. Keep tracing.`,
        portalStats: `${BOOK_DATA.partCount} PARTS · ${BOOK_DATA.postCount} ESSAYS · ${BOOK_DATA.premiseCount} PREMISES`,
        ctaBook: 'Enter the Living Book →',
        ctaIndex: 'Index of Premises',
        ctaReplay: '↺ Replay from Slide 1',
      },
      zh: {
        brand: '非万物之理',
        langToggle: 'EN',
        autoOff: '自动',
        autoOn: '播放中',
        soundOff: '声音',
        soundOn: '开启',
        startWhisper: '按 → 或点击任意处 · 连这套演示也在等你发起',
        portalTitle: '非万物之理 — 非定论的心智指南',
        portalSub: `一座活的外化记忆晶格：${BOOK_DATA.partCount} 部、${BOOK_DATA.postCount} 篇随笔、${BOOK_DATA.premiseCount} 条前提索引，将每一项信念追溯至其不完备的边界。持续描摹。`,
        portalStats: `${BOOK_DATA.partCount} 部 · ${BOOK_DATA.postCount} 篇随笔 · ${BOOK_DATA.premiseCount} 条前提`,
        ctaBook: '进入活书 →',
        ctaIndex: '前提索引',
        ctaReplay: '↺ 从第一页重播',
      }
    };

    const PORTAL_ESSAYS = [
      {
        slug: 'manifesto-of-not-a-theory-of-everything',
        tag: { en: 'Method', zh: '方法' },
        title: { en: 'Not a Theory of Everything', zh: '非万物之理' }
      },
      {
        slug: 'the-model-never-becomes-a-second-edge',
        tag: { en: 'Core Cut', zh: '核心切分' },
        title: { en: 'The Model Never Becomes a Second Edge', zh: '模型永远无法成为第二重前沿' }
      },
      {
        slug: 'machine-intelligence-as-the-combinatorial-feedback-loop-of-human-intelligence',
        tag: { en: 'Conditioning', zh: '逐层条件' },
        title: { en: 'Machine Intelligence as the Combinatorial Feedback Loop', zh: '机器智能作为人类智能的组合反馈回路' }

    /* =========================================================================
       PROCEDURAL WEBAUDIO ENGINE (Zero external audio files)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.master = null;
        this.padOscs = [];
        this.padFilter = null;
        this.padGain = null;
        this.currentScene = -1;
      }

      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.0001;
        this.master.connect(this.ctx.destination);

        this.padFilter = this.ctx.createBiquadFilter();
        this.padFilter.type = 'lowpass';
        this.padFilter.frequency.value = 420;
        this.padFilter.Q.value = 1.2;

        this.padGain = this.ctx.createGain();
        this.padGain.gain.value = 0.0001;
        this.padFilter.connect(this.padGain);
        this.padGain.connect(this.master);

        const freqs = [110, 164.81, 220, 329.63];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.value = f;
          const g = this.ctx.createGain();
          g.gain.value = idx < 2 ? 0.12 : 0.055;
          osc.connect(g);
          g.connect(this.padFilter);
          osc.start();
          this.padOscs.push(osc);
        });
      }

      setEnabled(on) {
        this.enabled = on;
        if (on) {
          this.init();
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
          if (this.master) {
            const now = this.ctx.currentTime;
            this.master.gain.cancelScheduledValues(now);
            this.master.gain.setTargetAtTime(0.45, now, 0.15);
          }
          if (this.currentScene >= 0) this.setScene(this.currentScene);
        } else if (this.master && this.ctx) {
          const now = this.ctx.currentTime;
          this.master.gain.cancelScheduledValues(now);
          this.master.gain.setTargetAtTime(0.0001, now, 0.08);
        }
      }

      setScene(idx) {
        this.currentScene = idx;
        if (!this.enabled || !this.ctx || !this.padGain) return;
        const now = this.ctx.currentTime;
        // Harmonic palettes per scene (Hz) + filter cutoff + pad level
        const palettes = [
          { f: [146.83, 220, 293.66, 440], cut: 240, vol: 0.0001 }, // 0: Stark silence
          { f: [110.00, 164.81, 246.94, 329.63], cut: 480, vol: 0.22 }, // 1: Am9 warm
          { f: [130.81, 196.00, 261.63, 392.00], cut: 620, vol: 0.18 }, // 2: C5 crisp
          { f: [98.00, 146.83, 220.00, 329.63], cut: 540, vol: 0.26 }, // 3: G2->90deg open
          { f: [123.47, 185.00, 277.18, 369.99], cut: 680, vol: 0.24 }, // 4: Orbital horizon
          { f: [82.41, 123.47, 196.00, 293.66], cut: 300, vol: 0.28 }, // 5: Underwater lowpass
          { f: [110.00, 174.61, 261.63, 392.00], cut: 560, vol: 0.24 }, // 6: Folded arches
          { f: [73.42, 110.00, 164.81, 293.66], cut: 420, vol: 0.30 }, // 7: Solar rumble
          { f: [130.81, 196.00, 293.66, 440.00], cut: 780, vol: 0.25 }, // 8: Orthogonal crystal
          { f: [146.83, 220.00, 293.66, 440.00], cut: 200, vol: 0.0001 }, // 9: Sudden silence!
          { f: [146.83, 220.00, 329.63, 440.00], cut: 460, vol: 0.20 }, // 10: Serene pure fifths
          { f: [130.81, 196.00, 246.94, 392.00], cut: 580, vol: 0.22 }  // 11: Living lattice
        ];
        const p = palettes[idx] || palettes[0];
        this.padOscs.forEach((osc, i) => {
          osc.frequency.setTargetAtTime(p.f[i], now, 0.35);
        });
        this.padFilter.frequency.setTargetAtTime(p.cut, now, 0.35);
        this.padGain.gain.setTargetAtTime(p.vol, now, 0.35);
      }

      tick(freq = 880, dur = 0.035, gain = 0.08) {
        if (!this.enabled || !this.ctx || !this.master) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.65, now + dur);
        g.gain.setValueAtTime(gain, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(g);
        g.connect(this.master);
        osc.start(now);
        osc.stop(now + dur + 0.01);
      }

      chime(notes = [523.25, 659.25, 783.99]) {
        if (!this.enabled || !this.ctx || !this.master) return;
        const now = this.ctx.currentTime;
        notes.forEach((n, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n, now + i * 0.07);
          g.gain.setValueAtTime(0.0001, now + i * 0.07);
          g.gain.linearRampToValueAtTime(0.09, now + i * 0.07 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.07 + 0.85);
          osc.connect(g);
          g.connect(this.master);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.9);
        });
      }
    }

      r: 0.5 + rng() * 1.6,
      twinkle: rng() * Math.PI * 2
    }));

    const DYSON_PANELS = Array.from({ length: 96 }, (_, i) => {
      const phi = Math.acos(1 - 2 * ((i + 0.5) / 96));
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      return {
        phi,
        theta,
        speed: 0.14 + rng() * 0.14,
        orbitR: 1.18 + (i % 3) * 0.08,
        size: 0.095 + rng() * 0.045,
        delay: (i / 96) * 2.2
      };
    });

    const CONSTELLATION = (() => {
      const parts = BOOK_DATA.parts || [];
      const nodes = [];
      parts.forEach((p, i) => {
        const angle = (i / Math.max(parts.length, 1)) * Math.PI * 2 - Math.PI / 2;
        const rad = 0.26 + (i % 3) * 0.095;
        const cx = Math.cos(angle) * rad;
        const cy = Math.sin(angle) * rad * 0.68;
        const cz = Math.sin(angle * 2) * 0.18;
        const count = Math.min(28, Math.max(6, Math.round((p.count || 15) * 0.55)));
        const stars = Array.from({ length: count }, () => ({
          ox: (rng() - 0.5) * 0.13,
          oy: (rng() - 0.5) * 0.10,
          oz: (rng() - 0.5) * 0.10,
          r: 1.0 + rng() * 1.6,
          phase: rng() * Math.PI * 2
        }));
        nodes.push({ part: p, cx, cy, cz, stars });
      });
      return nodes;
    })();

    // Draw Google-Slides / Figma iconic blue selection box with 8 white handles + rotation lollipop
    function drawSelectionBox(c, x, y, w, h, opts = {}) {
      const {
        color = '#2563eb',
        alpha = 1,
        rotationHandle = true,
        handleSize = 7,
        lineWidth = 1.6
      } = opts;
      if (alpha <= 0.005) return;
      c.save();
      c.globalAlpha *= alpha;
      c.strokeStyle = color;
      c.lineWidth = lineWidth;
      c.strokeRect(x, y, w, h);

      if (rotationHandle) {
        const stem = 22;
        const cx = x + w / 2;
        c.beginPath();
        c.moveTo(cx, y);
        c.lineTo(cx, y - stem);
        c.stroke();
        c.beginPath();
        c.arc(cx, y - stem - 4.5, 4.5, 0, Math.PI * 2);
        c.fillStyle = '#ffffff';
        c.fill();
        c.stroke();
      }

      const hs = handleSize;
      const pts = [
        [x, y], [x + w / 2, y], [x + w, y],
        [x + w, y + h / 2],
        [x + w, y + h], [x + w / 2, y + h], [x, y + h],
        [x, y + h / 2]
      ];
      c.fillStyle = '#ffffff';
      pts.forEach(([px, py]) => {
        c.fillRect(px - hs / 2, py - hs / 2, hs, hs);
        c.strokeRect(px - hs / 2, py - hs / 2, hs, hs);
      });
      c.restore();
    }

    function drawCursorArrow(c, x, y, scale = 1, alpha = 1) {
      if (alpha <= 0.01) return;
      c.save();
      c.globalAlpha *= alpha;
      c.translate(x, y);
      c.scale(scale, scale);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(0, 20);
      c.lineTo(5.2, 15.6);
      c.lineTo(9.2, 23.5);
      c.lineTo(12.2, 22);
      c.lineTo(8.2, 14.1);
      c.lineTo(14.5, 14.1);
      c.closePath();
      c.fillStyle = '#ffffff';
      c.shadowColor = 'rgba(0,0,0,0.45)';
      c.shadowBlur = 8;
      c.shadowOffsetY = 2;
      c.fill();
      c.lineWidth = 1.4;
      c.strokeStyle = '#111827';
      c.stroke();
      c.restore();
    }

    function drawRoundedRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    /* --- SCENE 0: THE TILTED OPENING (Callback to "What do you want?" 1° tilt) --- */
    function renderScene0(c, W, H, t) {
      // Dark outer slide-editor void so the 1° tilted white canvas pops sharply
      c.fillStyle = '#0c1017';
      c.fillRect(0, 0, W, H);

      const zh = state.lang === 'zh';
      // 0..1.35s: tilted at -1.25°; 1.35..2.5s: cursor glides to rotation handle and straightens to 0°
      const straightT = easeInOutCubic((t - 1.45) / 1.05);
      const angleRad = lerp(-1.35 * Math.PI / 180, 0, straightT);

      if (t > 1.55 && !state.scene1StraightCue) {
        state.scene1StraightCue = true;
        sound.tick(620, 0.04, 0.07);
      }

      const margin = Math.min(W, H) * 0.036;
      const slideW = W - margin * 2;
      const slideH = H - margin * 2;

      c.save();
      c.translate(W / 2, H / 2);
      c.rotate(angleRad);

      // Crisp white presentation slide
      c.fillStyle = '#fcfcfd';
      c.shadowColor = 'rgba(0,0,0,0.45)';
      c.shadowBlur = 32;
      c.fillRect(-slideW / 2, -slideH / 2, slideW, slideH);
      c.shadowBlur = 0;

      // Subtle PowerPoint footer bar
      c.fillStyle = 'rgba(37, 99, 235, 0.09)';
      c.fillRect(-slideW / 2, slideH / 2 - 4, slideW, 4);

      // Outer blue selection frame around the whole slide (fades down slightly once straightened)
      const outerBoxAlpha = lerp(0.95, 0.28, smoothstep(2.4, 3.0, t));
      drawSelectionBox(c, -slideW / 2 + 10, -slideH / 2 + 10, slideW - 20, slideH - 20, {
        alpha: outerBoxAlpha,
        rotationHandle: true,
        handleSize: 8
      });

      // Primary headline ("Any questions?" / "还有什么问题吗？")
      const mainSize = Math.round(clamp(W * 0.044, 28, 56));
      c.fillStyle = '#111827';
      c.font = `600 ${mainSize}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-sans')}`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      const qText = zh ? '还有什么问题吗？' : 'Any questions?';
      c.fillText(qText, 0, -mainSize * 0.85);

      // Animated subtitle edit sequence:
      // 0..2.7s: "What do you want?"
      // 2.7..3.45s: backspacing out
      // 3.55..5.0s: typing "Wait. Who started this slide?"
      const oldSub = zh ? '你想要什么？' : 'What do you want?';
      const newSub = zh ? '等等。是谁启动了这页幻灯片？' : 'Wait. Who started this slide?';
      let shownSub = oldSub;
      let editingInner = false;
      let highlightEmerald = false;

      if (t >= 2.65 && t < 3.45) {
        editingInner = true;
        const p = clamp((t - 2.65) / 0.75, 0, 1);
        const keep = Math.max(0, Math.round(oldSub.length * (1 - p)));
        shownSub = oldSub.slice(0, keep);
      } else if (t >= 3.45) {
        editingInner = true;
        highlightEmerald = t > 4.95;
        const p = clamp((t - 3.55) / 1.35, 0, 1);
        const count = Math.round(newSub.length * p);
        shownSub = newSub.slice(0, count);
      }

      const subSize = Math.round(clamp(W * 0.028, 19, 34));
      c.font = `${highlightEmerald ? '600' : '400'} ${subSize}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-sans')}`;
      const metrics = c.measureText(shownSub || ' ');
      const boxW = Math.max(metrics.width + 44, subSize * 5.2);
      const boxH = subSize * 2.15;
      const boxY = mainSize * 0.55 - boxH / 2;

      // Inner blue selection box around subtitle during editing
      if (editingInner || t > 0.3) {
        const innerAlpha = editingInner ? 0.95 : 0.42;
        drawSelectionBox(c, -boxW / 2, boxY, boxW, boxH, {
          color: highlightEmerald ? '#15803d' : '#2563eb',
          alpha: innerAlpha,
          rotationHandle: true,
          handleSize: 6.5
        });
      }

      c.fillStyle = highlightEmerald ? '#0f172a' : '#1f2937';
      c.fillText(shownSub, 0, mainSize * 0.55);

      // Blinking I-beam cursor
      const blink = Math.floor(t * 2.4) % 2 === 0;
      if (blink) {
        const cx = metrics.width / 2 + 4;
        c.fillStyle = highlightEmerald ? '#15803d' : '#2563eb';
        c.fillRect(cx, mainSize * 0.55 - subSize * 0.58, 2.2, subSize * 1.16);
      }

      // Animated vector cursor grabbing the top rotation handle at t=0.9..2.7s
      if (t > 0.7 && t < 2.95) {
        const approach = easeOutCubic((t - 0.7) / 0.72);
        const fadeOut = 1 - smoothstep(2.55, 2.95, t);
        const targetX = 0;
        const targetY = -slideH / 2 - 16;
        const curX = lerp(slideW * 0.24, targetX, approach);
        const curY = lerp(slideH * 0.18, targetY, approach);
        drawCursorArrow(c, curX, curY, 1.05, fadeOut);
      }

      c.restore();

      // Show gentle start whisper once typing settles
      if (!state.userInteracted && t > 4.6) {
        dom.startWhisper.classList.add('visible');
      } else {
        dom.startWhisper.classList.remove('visible');
      }
    }

    /* --- SCENE 1: CONDITIONAL ALL THE WAY DOWN (5 Nested Causal Shells) --- */
    function renderScene1(c, W, H, t) {
      const grad = c.createRadialGradient(W * 0.5, H * 0.42, 10, W * 0.5, H * 0.44, Math.max(W, H) * 0.75);
      grad.addColorStop(0, '#101827');

      c.fillRect(0, 0, W, H);

      const cx = W * 0.5 + state.pointer.x * 26;
      const cy = H * 0.40 + state.pointer.y * 18;

      const layers = [
        {
          r: Math.min(W, H) * 0.43,

          delay: 0.45
        },
        {

          label: zh ? '2 · 预训练语料：数百年人类外化痕迹' : '2 · PRETRAINING CORPUS: CENTURIES OF HUMAN TRACES',
          delay: 0.32
        },
        {
          r: Math.min(W, H) * 0.235,
          color: '#58a6ff',
          label: zh ? '3 · 后训练与运行沙箱：构建者偏好与规则' : '3 · POST-TRAINING & HARNESS: BUILDERS, LABELS, SANDBOX',
          delay: 0.18
        },
        {
          r: Math.min(W, H) * 0.145,
          color: '#a371f7',
          label: zh ? '4 · 条件延续流：下游词元采样' : '4 · CONDITIONING STREAM: DOWNSTREAM TOKEN SAMPLING',
          delay: 0.06
        }
      ];

      // Subtle orbital grid lines
      c.save();
      c.translate(cx, cy);

      // Radial inward causal filaments (strictly flowing OUTSIDE -> INSIDE!)
      const rayCount = 12;
      for (let i = 0; i < rayCount; i++) {
        const ang = (i / rayCount) * Math.PI * 2 + t * 0.035;
        const outerR = layers[0].r * (0.92 + 0.08 * pull);
        const innerR = 46;
        c.beginPath();
        c.moveTo(Math.cos(ang) * outerR, Math.sin(ang) * outerR * 0.62);
        c.lineTo(Math.cos(ang) * innerR, Math.sin(ang) * innerR * 0.62);
        c.strokeStyle = 'rgba(63, 185, 80, 0.11)';
        c.lineWidth = 1;
        c.stroke();

        // Traveling causal pulses strictly INWARD from Living Edge -> Slide Core
        const p = ((t * 0.42 + i / rayCount) % 1);
        const pr = lerp(outerR, innerR, p);
        const px = Math.cos(ang) * pr;
        const py = Math.sin(ang) * pr * 0.62;
        c.beginPath();
        c.arc(px, py, 2.4, 0, Math.PI * 2);
        c.fillStyle = p < 0.33 ? '#3fb950' : p < 0.66 ? '#58a6ff' : '#a371f7';
        c.globalAlpha = Math.sin(p * Math.PI) * 0.9 * pull;
        c.fill();
        c.globalAlpha = 1;
      }

      // Draw concentric nested 3D elliptical architectural frames
      layers.forEach((layer, idx) => {
        const appear = easeOutCubic(clamp((t - layer.delay) / 1.0, 0, 1));
        if (appear <= 0.01) return;
        const rx = layer.r * lerp(1.5, 1.0, appear);
        const ry = rx * 0.62;
        const tilt = state.pointer.x * 0.04 * (4 - idx);

        c.save();
        c.rotate(tilt);
        c.beginPath();
        c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        c.strokeStyle = layer.color;
        c.globalAlpha = appear * (idx === 0 ? 0.82 : 0.48);
        c.lineWidth = idx === 0 ? 2.0 : 1.3;
        if (idx > 0) c.setLineDash([6, 6]);
        c.stroke();
        c.setLineDash([]);

        // Soft luminous rim glow
        c.fillStyle = layer.color;
        c.globalAlpha = appear * 0.04;
        c.fill();

        // Layer badge at top edge of each ellipse
        const fontSize = Math.round(clamp(W * 0.0095, 9.5, 12.5));
        c.font = `600 ${fontSize}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        const tw = c.measureText(layer.label).width;
        const bx = -tw / 2 - 10;
        const by = -ry - 11;
        c.globalAlpha = appear * 0.92;
        c.fillStyle = 'rgba(7, 10, 16, 0.88)';
        drawRoundedRect(c, bx, by, tw + 20, 22, 11);
        c.fill();
        c.strokeStyle = layer.color;
        c.lineWidth = 1;
        c.stroke();
        c.fillStyle = layer.color;
        c.fillText(layer.label, 0, -ry);
        c.restore();
      });

      // Tiny white slide shrunken at the exact center ("I can fix it.")
      const slideScale = lerp(4.2, 1.0, pull);
      const sw = 128 * slideScale;
      const sh = 74 * slideScale;
      c.save();
      c.fillStyle = '#fcfcfd';
      c.shadowColor = 'rgba(255,255,255,0.22)';
      c.shadowBlur = 24;
      c.fillRect(-sw / 2, -sh / 2, sw, sh);
      c.shadowBlur = 0;
      drawSelectionBox(c, -sw / 2 + 5, -sh / 2 + 5, sw - 10, sh - 10, {

      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(zh ? '“我能修好它。”' : '“I can fix it.”', 0, 1);
      c.restore();

      c.restore();
    }

        } else if (step === 4) {

        });

        c.font = `600 12px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')}`;
        const pillW = c.measureText(active.trace).width + 26;
