<!doctype html>
<html><head><meta charset="utf-8">
<title>Infographic, picture by Nano Banana through Antigravity</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@font-face { font-family: "Info Sans", "Figtree"; src: url(../../../../kits/shared/lib/fonts/Figtree.ttf); font-weight: 300 900; }
@font-face { font-family: "Info Sans", "NotoSC"; src: url(../../../../kits/shared/lib/fonts/NotoSansSC.ttf); font-weight: 100 900; }
:root { --navy:#1c2240; --ink:#232842; --green:#3f7a2c; --gold:#9a6a08; --coral:#b8432b; --sky:#2a6a96; --indigo:#4a3a8c; --plate: rgba(250,245,230,0.93); }
html,body{margin:0}
body{width:1024px;height:1024px;overflow:hidden;position:relative;color:var(--ink);font-family: "Info Sans", "Figtree","NotoSC",sans-serif;background:#1d2a48}
body.zh{font-family: "Info Sans", "NotoSC",sans-serif}
.pic{position:absolute;left:0;top:0;width:1024px;height:1024px}
svg.art{position:absolute;left:0;top:0}
.plate{position:absolute;box-sizing:border-box;background:var(--plate);border-radius:6px;padding:7px 10px 8px;border-left:4px solid var(--c);box-shadow:0 1px 0 rgba(0,0,0,.25),0 4px 10px rgba(10,12,30,.4)}
.plate h3{margin:0 0 3px;font-size:14px;line-height:1.2;font-weight:800;color:var(--c)}
.plate p{margin:0;font-size:12.3px;line-height:1.32}
.zh .plate h3{font-size:14.5px;font-weight:700}.zh .plate p{font-size:12.6px;line-height:1.5}
.plate b{color:var(--c)}
.title{position:absolute;left:22px;top:16px;width:486px}
.title h1{margin:0;font-size:37px;line-height:1.06;font-weight:800;color:#fdf3d6;letter-spacing:-.01em;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.zh .title h1{font-size:37px;letter-spacing:.05em;font-weight:700}
.title .claim{margin-top:8px;width:486px;font-size:15px;line-height:1.38;font-weight:600;color:#f4ead0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.zh .title .claim{font-size:15.5px;line-height:1.55}
.title .url{margin-top:6px;font:9.4px "DejaVu Sans Mono",monospace;color:#c9c3e6}
.use{display:flex;gap:14px;align-items:center;background:rgba(232,240,222,.95)}
.use h3{margin:0;white-space:nowrap;font-size:15px}
.nw{white-space:nowrap}
.num{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:6px;vertical-align:1px;font-weight:700;font-family: "Info Sans", "Figtree"}
</style></head><body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024"><g id="leads" fill="none" stroke="#fdf8ea" stroke-width="1.6" stroke-dasharray="3 3"></g></svg>
<div class="title"><h1 data-k="title"></h1><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/on-demand-contexts-keep-coherence-at-one-step/</div></div>

<div class="plate" id="kb" style="left:22px;top:250px;width:236px;--c:var(--coral)"><h3 data-k="hb"></h3><p data-k="b"></p></div>
<div class="plate" id="ks" style="left:268px;top:250px;width:240px;--c:var(--gold)"><h3 data-k="hs"></h3><p data-k="s"></p></div>
<div class="plate" id="k1" style="left:12px;top:772px;width:204px;--c:var(--coral)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="plate" id="k2" style="left:830px;top:12px;width:182px;--c:var(--green)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="plate" id="k3" style="left:170px;top:400px;width:180px;--c:var(--indigo)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="plate" id="k4" style="left:228px;top:838px;width:330px;--c:var(--sky)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="plate" id="k5" style="left:630px;top:12px;width:190px;--c:var(--gold)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="plate" id="k6" style="left:566px;top:760px;width:282px;--c:var(--green)"><h3 data-k="c6h"></h3><p data-k="c6"></p></div>
<div class="plate use" id="ku" style="left:12px;top:932px;width:1000px;--c:var(--navy)"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<script>
const S={en:{
title:'On-Demand Contexts Keep Coherence at One Step',
claim:'A pipeline that loads maker and cold critic fresh for each task, discards the context after handoff, and returns every undecided point to the operator, so logical coherence never thickens into a standing image.',
hb:'The belief',
b:'A standing agent keeps its conversation; a shared cache, a deadline rule, or a watchdog carries coherence and decisions from one step to the next.',
hs:'Where it stops',
s:'The retained sequence is a reference preserved past its step: later predictions condition on what the session holds, not on what the task still requires. A rule made earlier runs blindly later.',
c1h:'Standing contexts preserve an image',
c1:'Long-context drift, stale memory, and role bleed are <b>one Image lag</b> at the scale of a session: residue left to thicken.',
c2h:'Decisions return',
c2:'Only tasks are delegated. Choosing between positions that cannot be reconciled is <b>a further act at a living center</b>: the run waits, the human decides.',
c3h:'One premise',
c3:'Maker and cold critic: the same charter, the critic without the maker’s working history. A point settles only when both trace it to <b>the one premise</b>.',
c4h:'Handoff re-traces finished residue',
c4:'A final artifact the critic signed, with its sha256, never a draft plus fixes. Every receiver recomputes the hash and confirms with both; then <b>the contexts drop</b>.',
c5h:'The living memory',
c5:'Charters, skills, run folders: residue legible to the next load. No shared cache, which would be <b>a memory of memories</b>.',
c6h:'Recap; the operator persists',
c6:'A fresh bot reads the whole run folder: <b>where did the run fall short of coherence?</b> The human decides. The dispatcher starts the first bot, then steps back.',
h_use:'What stays useful',
use:'Tasks delegate cleanly: a bot is the base model with a charter and skills in a fresh context, settling what follows from the premise. Files and hashes keep the work legible for re-tracing. What cannot be derived returns to the Mind that still decides.'},
zh:{
title:'按需语境将融贯<br>保持在一步',
claim:'为每项任务全新加载制作者与冷审校者，交接后即丢弃语境，未决分歧尽数交还操作者，使逻辑融贯不致增厚为<span class=nw>常驻图像</span>。',
hb:'被持有的信念',
b:'常驻智能体保留对话历史；<span class=nw>共享缓存</span>、截止规则或看门狗，把<span class=nw>融贯</span>与决定从一步带到下一步。',
hs:'在何处止步',
s:'被保留的序列成了越过自身那一步仍被<span class=nw>固守</span>的参照：后续预测以会话已有的<span class=nw>内容</span>为条件，而非任务当前依然要求的<span class=nw>前提</span>。早先定下的规则，事后被<span class=nw>盲目执行</span>。',
c1h:'常驻语境保留了图像',
c1:'长上下文漂移、陈旧记忆与<span class=nw>角色串味</span>，是单次会话尺度上的<b><span class=nw>同一种</span><span class=nw>图像滞后</span></b>：残余被<span class=nw>放任增厚</span>。',
c2h:'决定必须交还',
c2:'唯有任务可以移交。在无法<span class=nw>调和</span>的立场之间取舍，是<b><span class=nw>鲜活中心处</span>的一次新行动</b>：<span class=nw>运行等待</span>，由人决定。',
c3h:'唯一的前提',
c3:'制作者与冷审校者：<span class=nw>同一份</span><span class=nw>章程</span>，审校者不带制作者的<span class=nw>工作历史</span>。<span class=nw>唯有</span>双方都追溯到<b><span class=nw>唯一的</span><span class=nw>前提</span></b>，一点<span class=nw>才算落定</span>。',
c4h:'交接是对定稿残余的重新追溯',
c4:'审校者签发的定稿制品连同其哈希值，从不是草稿加<span class=nw>待修清单</span>。每位接收者重新计算哈希并向双方确认，<span class=nw>随后</span><b><span class=nw>语境丢弃</span></b>。',
c5h:'活的记忆',
c5:'章程、技能、运行目录：对<span class=nw>下一次</span>加载保持可读的残余。<span class=nw>不设</span>共享缓存，那会成为<b><span class=nw>记忆的记忆</span></b>。',
c6h:'复盘；操作者存续',
c6:'全新的机器人通读整个<span class=nw>运行目录</span>：<b>在何处未能保持逻辑融贯？</b>由人决定。调度器启动第一个<span class=nw>机器人</span>，随即<span class=nw>退居一旁</span>。',
h_use:'依然有用之处',
use:'任务可以干净地移交：机器人就是装进全新语境的基础模型加章程与技能，落定可从前提推导出的事项。文件与哈希值让工作便于重新追溯。推导不出的，<span class=nw>交还</span>给仍在做决定的<span class=nw>心智</span>。'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',W=S[lang];
document.documentElement.lang=lang;document.body.classList.toggle('zh',lang==='zh');
for(const el of document.querySelectorAll('[data-k]'))el.innerHTML=W[el.dataset.k];
['k1','k2','k3','k4','k5','k6'].forEach((id,i)=>document.querySelector(`#${id} h3`).insertAdjacentHTML('afterbegin',`<span class="num">${i+1}</span>`));
const pt=(id,[fx,fy])=>{const r=document.getElementById(id).getBoundingClientRect();return[r.left+fx*r.width,r.top+fy*r.height]};
const tie=(a,b)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#fffaf0" stroke="#1c2240" stroke-dasharray="none"/>`;
let h='';
h+=tie(pt('k1',[0.45,0]),[100,690]);   // the cobwebbed standing form
h+=tie(pt('k1',[0.08,0]),[34,560]);    // its swollen shadow
h+=tie(pt('k2',[0.5,1]),[912,420]);    // the one person (operator)
h+=tie(pt('k3',[1,0.02]),[462,430]);   // the copper spiral (maker), routed above its shadow
h+=tie(pt('k3',[1,0.1]),[540,456]);    // the cage's matching shadow (critic)
h+=tie(pt('k4',[0.45,0]),[384,760]);   // the sealed sheet
h+=tie(pt('k5',[0.6,1]),[740,300]);    // the pigeonhole cabinet
h+=tie(pt('k6',[0.75,0]),[782,556]);   // the magnifier on the run folder
h+=tie(pt('k6',[1,0.3]),[858,746]);    // the bell by the door (the dispatcher's trigger)
document.getElementById('leads').innerHTML=h;
</script></body></html>
