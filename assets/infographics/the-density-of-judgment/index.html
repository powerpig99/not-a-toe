<!doctype html>
<html><head><meta charset="utf-8">
<title>Infographic, picture by Nano Banana through Antigravity</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@font-face { font-family: "Info Sans", "Figtree"; src: url(../../../../kits/shared/lib/fonts/Figtree.ttf); font-weight: 300 900; }
@font-face { font-family: "Info Sans", "NotoSC"; src: url(../../../../kits/shared/lib/fonts/NotoSansSC.ttf); font-weight: 100 900; }
:root { --ink:#1e2833; --steel:#2f4a63; --orange:#b9471a; --teal:#1f6f6a; --plum:#6a3d7a; --olive:#5c6a1e; --plate: rgba(247,244,234,0.94); }
html,body{margin:0}
body{width:1024px;height:1024px;overflow:hidden;position:relative;color:var(--ink);font-family: "Info Sans", "Figtree","NotoSC",sans-serif;background:#bfb9a6}
body.zh{font-family: "Info Sans", "NotoSC",sans-serif}
.pic{position:absolute;left:0;top:0;width:1024px;height:1024px}
svg.art{position:absolute;left:0;top:0}
.plate{position:absolute;box-sizing:border-box;background:var(--plate);border-radius:5px;padding:7px 10px 8px;border-left:4px solid var(--c);box-shadow:0 1px 0 rgba(0,0,0,.18),0 3px 9px rgba(40,36,24,.28)}
.plate h3{margin:0 0 3px;font-size:14px;line-height:1.2;font-weight:800;color:var(--c)}
.plate p{margin:0;font-size:12.3px;line-height:1.32}
.zh .plate h3{font-size:14.5px;font-weight:700}.zh .plate p{font-size:12.6px;line-height:1.5}
.plate b{color:var(--c)}
.title{position:absolute;left:24px;top:18px;width:520px}
.title h1{margin:0;font-size:44px;line-height:1.02;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.title h1 b{color:var(--orange)}
.zh .title h1{font-size:44px;letter-spacing:.08em;font-weight:700}
.title .claim{margin-top:9px;width:520px;font-size:16px;line-height:1.36;font-weight:600;color:#2b3440}
.zh .title .claim{font-size:16px;line-height:1.55}
.title .url{margin-top:7px;font:10px "DejaVu Sans Mono",monospace;color:#3f4a56}
.use{display:flex;gap:14px;align-items:center;background:rgba(236,242,238,.95)}
.use h3{margin:0;white-space:nowrap;font-size:15px}
.nw{white-space:nowrap}
.num{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:6px;vertical-align:1px;font-weight:700;font-family: "Info Sans", "Figtree"}
</style></head><body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024"><g id="leads" fill="none" stroke="#1e2833" stroke-width="1.4" stroke-dasharray="3 3"></g></svg>
<div class="title"><h1 data-k="title"></h1><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/the-density-of-judgment/</div></div>

<div class="plate" id="kb" style="left:24px;top:150px;width:256px;--c:var(--orange)"><h3 data-k="hb"></h3><p data-k="b"></p></div>
<div class="plate" id="ks" style="left:290px;top:150px;width:270px;--c:var(--steel)"><h3 data-k="hs"></h3><p data-k="s"></p></div>
<div class="plate" id="k1" style="left:690px;top:16px;width:318px;--c:var(--steel)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="plate" id="k2" style="left:276px;top:816px;width:296px;--c:var(--orange)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="plate" id="k3" style="left:16px;top:582px;width:230px;--c:var(--olive)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="plate" id="k4" style="left:16px;top:456px;width:230px;--c:var(--teal)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="plate" id="k5" style="left:16px;top:308px;width:230px;--c:var(--plum)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="plate" id="k6" style="left:770px;top:128px;width:238px;--c:var(--orange)"><h3 data-k="c6h"></h3><p data-k="c6"></p></div>
<div class="plate use" id="ku" style="left:12px;top:946px;width:1000px;--c:var(--steel)"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<script>
const S={en:{
title:'The Density of <b>Judgment</b>',
claim:'Accelerating an open-ended loop shrinks the interval between interventions and multiplies the choices that remain with the Mind.',
hb:'The belief',
b:'Flint was hailed as the first open model “created without human intervention”: more automated throughput, less human agency.',
hs:'Where it stops',
s:'Nothing is created without intervention: created by whom? The harness is the first intervention, accepting the release the second, with adjustments between.',
c1h:'The harness, compiled',
c1:'The stretch that then runs unattended is <b>that intervention in compiled form</b>: deterministic rules, search bounds, and starting preconditions.',
c2h:'The interval tightens',
c2:'The loop runs <b>faster</b>, not longer on its own: more candidates return for selection, sooner. Each pass shifts the boundary, so steering cannot rest on a cached inventory of prior conclusions.',
c3h:'Closed by perspective',
c3:'Under a fixed endpoint, acceleration does reduce human involvement to monitoring and exceptions. Closed or open is set by <b>the goal and stopping rule</b> of the directing Mind.',
c4h:'Preconditions do two jobs',
c4:'Asserted in logic, neutral background that enables a run; observed after the run, <b>the boundary all along</b>. Widening it takes a new free variable from a living Mind.',
c5h:'Front-loaded premises',
c5:'Each mid-run intervention injects a premise. Traced back and codified into the start, the middle runs uninterrupted: <b>the impression</b> of no human intervention.',
c6h:'The edge moves outward',
c6:'The previous outer loops are the present inner loops. Automating an outer loop is <b>itself an intervention</b> made at the current edge.',
h_use:'What stays useful',
use:'The rise in automated throughput is real: routine implementation thins, and inside its bounds the run’s autonomy is real, its detailed path found by the system rather than dictated step by step.'},
zh:{
title:'判断的<b>密度</b>',
claim:'加速开放式回环会缩短介入之间的间隔，并使留归<span class=nw>心智</span>的抉择<span class=nw>成倍增加</span>。',
hb:'被持有的信念',
b:'Flint 被欢呼为首个“未经人类介入而<br>创建”的开源模型：自动化吞吐量越高，<br>人的主体性就越少。',
hs:'在何处止步',
s:'没有任何事物是未经介入而创建的：若无<br>介入，创建者是谁？运行架设是第一次<br>介入，验收发布版本是第二次，其间还有<br>持续的调整。',
c1h:'运行架设的编译形态',
c1:'此后无人值守地运行的那一段，正是<b>这次介入的<span class=nw>编译形态</span></b>：确定性规则、<span class=nw>搜索边界</span>与起始<span class=nw>先决条件</span>。',
c2h:'间隔收紧',
c2:'回环并非独自运行得更久，而是<b>转得更快</b>：更多候选方案更早返回以供筛选。每一轮都推移约束边界，掌舵无法仰赖过往结论的<span class=nw>库存</span>。',
c3h:'封闭源于视角',
c3:'在固定终点之下，加速确实会把人的<br>参与收窄为监控与异常处理。封闭<br>还是开放，取决于掌舵心智所施加的<br><b>目标与停机规则</b>。',
c4h:'先决条件的双重角色',
c4:'在逻辑中，它是中立的赋能背景；<br>运行结束后观察，它<b>从头到尾都是<br>边界</b>。要扩张它，须由鲜活的心智<br>注入新的自由变量。',
c5h:'前置的前提',
c5:'每一次中途介入都注入一个前提。<br>把它们逆向追溯、编纂进起点，<br>中间环节便能不受打断地运行，<br>“未经人类介入”的<b>印象</b>由此而来。',
c6h:'边缘向外推移',
c6:'先前的外回环就是当下的内回环。将外回环自动化，<b>本身就是</b>在当前边缘处作出的一次介入。',
h_use:'依然有用之处',
use:'自动化吞吐量的提升是真实的：常规实现在减少；在边界之内，运行的自主性也是真实的，具体路径由系统自行寻得，而非被<span class=nw>逐步口授</span>。'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',W=S[lang];
document.documentElement.lang=lang;document.body.classList.toggle('zh',lang==='zh');
for(const el of document.querySelectorAll('[data-k]'))el.innerHTML=W[el.dataset.k];
['k1','k2','k3','k4','k5','k6'].forEach((id,i)=>document.querySelector(`#${id} h3`).insertAdjacentHTML('afterbegin',`<span class="num">${i+1}</span>`));
const pt=(id,[fx,fy])=>{const r=document.getElementById(id).getBoundingClientRect();return[r.left+fx*r.width,r.top+fy*r.height]};
const tie=(a,b)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#fbf8ee" stroke="#1e2833" stroke-dasharray="none"/>`;
let h='';
h+=tie(pt('k1',[0.15,1]),[724,372]);   // the punched tape feeding the hub
h+=tie(pt('k2',[1,0.25]),[740,770]);   // tokens on the sorting table
h+=tie(pt('k2',[1,0.7]),[668,884]);    // the crate of chosen tokens
h+=tie(pt('k3',[0.6,1]),[160,742]);    // the idle hopper, filled to the brim
h+=tie(pt('k4',[1,0.5]),[254,540]);    // the rail round the machine
h+=tie(pt('k5',[1,0.3]),[452,452]);    // the inner rings, spinning
h+=tie(pt('k6',[0.9,1]),[912,498]);    // the loose segments at the gap of the outer ring
document.getElementById('leads').innerHTML=h;
</script></body></html>
