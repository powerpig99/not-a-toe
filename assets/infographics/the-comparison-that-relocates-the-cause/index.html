<!doctype html>
<html><head><meta charset="utf-8">
<title>Infographic: The Comparison That Relocates the Cause (picture: Antigravity image model, lithographed tinplate toy diorama, take B)</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@font-face { font-family: "Info Sans", "Figtree"; src: url(../../../../kits/shared/lib/fonts/Figtree.ttf); font-weight: 300 900; }
@font-face { font-family: "Info Sans", "NotoSC"; src: url(../../../../kits/shared/lib/fonts/NotoSansSC.ttf); font-weight: 100 900; }
:root { --navy:#1f2a44; --ink:#262a3a; --brick:#a8402a; --sea:#1d5a7a; --brass:#8a6410; --teal:#2c6f6a; --plum:#6a3f6e; --green:#3f6f2c; --plate: rgba(252,249,238,0.94); }
html,body{margin:0}
body{width:1024px;height:1024px;overflow:hidden;position:relative;color:var(--ink);font-family:"Figtree","NotoSC",sans-serif;background:#f3ecd8}
body.zh{font-family:"NotoSC",sans-serif}
.pic{position:absolute;left:144px;top:144px;width:880px;height:880px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 110px),linear-gradient(to bottom,transparent 0,#000 110px);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 110px),linear-gradient(to bottom,transparent 0,#000 110px);mask-composite:intersect}
svg.art{position:absolute;left:0;top:0}
.plate{position:absolute;box-sizing:border-box;background:var(--plate);border-radius:6px;padding:8px 11px 9px;border-left:4px solid var(--c);box-shadow:0 1px 0 rgba(0,0,0,.18),0 4px 10px rgba(40,30,20,.22)}
.plate h3{margin:0 0 3px;font-size:14.5px;line-height:1.2;font-weight:800;color:var(--c)}
.plate p{margin:0;font-size:12.6px;line-height:1.33}
.zh .plate h3{font-size:15px;font-weight:700}.zh .plate p{font-size:13px;line-height:1.5}
.plate b{color:var(--c)}
.title{position:absolute;left:24px;top:16px;width:468px}
.title h1{margin:0;font-size:39px;line-height:1.05;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.zh .title h1{font-size:42px;letter-spacing:.06em;font-weight:700}
.title .claim{margin-top:8px;font-size:16px;line-height:1.38;font-weight:600}
.zh .title .claim{font-size:16.5px;line-height:1.55}
.title .url{margin-top:6px;white-space:nowrap;font:10px "DejaVu Sans Mono",monospace;color:#6a6252}
.use{display:flex;gap:14px;align-items:center;background:rgba(232,240,224,.95)}
.use h3{margin:0;white-space:nowrap;font-size:15.5px}
.nw{white-space:nowrap}
.num{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:6px;vertical-align:1px;font-weight:700;font-family:"Figtree"}
</style></head><body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024"><g id="leads" fill="none" stroke="#3a3346" stroke-width="1.5" stroke-dasharray="3 3"></g></svg>
<div class="title"><h1 data-k="title"></h1><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/the-comparison-that-relocates-the-cause/</div></div>

<div class="plate" id="k1" style="left:12px;top:236px;width:330px;--c:var(--plum)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="plate" id="k2" style="left:12px;top:420px;width:330px;--c:var(--brick)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="plate" id="k3" style="left:12px;top:690px;width:236px;--c:var(--brass)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="plate" id="k4" style="left:262px;top:836px;width:330px;--c:var(--sea)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="plate" id="k5" style="left:510px;top:18px;width:250px;--c:var(--teal)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="plate" id="k6" style="left:772px;top:18px;width:240px;--c:var(--green)"><h3 data-k="c6h"></h3><p data-k="c6"></p></div>
<div class="plate use" id="ku" style="left:12px;top:944px;width:680px;--c:var(--navy)"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<script>
const S={en:{
title:'The Comparison That Relocates the Cause',
claim:'Ranking tools under one protocol scores the Mind’s allocation as the instruments’ capability, while fine print shields the move.',
c1h:'The ranking',
c1:'A ranking of instruments measured under one protocol is registered as evidence of where capability resides. <b>The ranking itself is the relocation.</b>',
c2h:'Inside one protocol',
c2:'Backbone, hardware, and wall-clock budget held fixed, elaborate harnesses add no statistically significant gain over a minimal read, write, and bash session: outer layers duplicate the state-tracking the inner loop already performs.',
c3h:'A diving suit on the track',
c3:'The suit interferes with running. The interference is registered as a property of the suit rather than <b>the load it carries under an assumption about the required action</b>.',
c4h:'Deep water again',
c4:'Constrain the context, pair a smaller backbone, move to novel environments or production engineering, and the layers that were dead weight on the track <b>become the load-bearing structure</b>.',
c5h:'The fine print',
c5:'Scope qualifiers register as caution, then are called up after the fact. <b>What looks like a limit on the claim lets it travel farther</b> while remaining formally defensible.',
c6h:'Left outside the ranking',
c6:'The Mind that selected the backbone, fixed the budget, and chose the tasks is left outside the ranking. Model and harness are <b>both residue it leaves</b>.',
h_use:'What stays useful',
use:'Inside that pairing of model capacity, task horizon, and resource ceiling, stripping redundant middleware removes translation overhead. The ranking stays a one-step-old trace; it turns into lag only when held as the location of the cause.'},
zh:{
title:'转移原因的比较',
claim:'同一规程下的工具排序将心智的配置计为器物的能力，<span class=nw>而细则限定</span>反倒掩护了这一转移。',
c1h:'排序',
c1:'同一规程下对工具测得的排序，被登记为能力坐落于何处的证据。<b>这一排序本身正是原因的转移。</b>',
c2h:'固定规程内部',
c2:'模型基座、硬件与挂钟时间预算固定，繁复框架相比仅有读写与命令行的精简会话，未见统计显著的<span class=nw>增益</span>：外层重复了内循环已在执行的状态追踪。',
c3h:'跑道上的潜水服',
c3:'潜水服妨碍奔跑。这一妨碍被登记为潜水服的属性，而非<b>它在所需行动的假设之下承受的负荷</b>。',
c4h:'跑道重新变为深水',
c4:'收紧上下文窗口、换用较小基座、转向新颖环境或<span class=nw>生产级</span>工程，在跑道上登记为累赘的框架层级，<b><span class=nw>便成为</span>了承重结构</b>。',
c5h:'细则限定',
c5:'范围限定登记为审慎，事后再被传唤。<b>看似对主张的限制，实则让主张走得<span class=nw>更远</span></b>，同时保持形式上的<span class=nw>可辩护性</span>。',
c6h:'排序之外',
c6:'挑选基座、固定预算、择定任务的<span class=nw>心智</span>，被留在了排序之外。模型与<span class=nw>框架</span><b>皆是它留下的余迹</b>。',
h_use:'仍然有用之处',
use:'在模型容量、任务视距与资源上限的这一配对内部，剥离冗余中间件消除了转译开销。排序作为滞后一步的余迹留存；唯有被执着为原因所在的坐标时，它才化作滞后。'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',W=S[lang];
document.documentElement.lang=lang;document.body.classList.toggle('zh',lang==='zh');
for(const el of document.querySelectorAll('[data-k]'))el.innerHTML=W[el.dataset.k];
['k1','k2','k3','k4','k5','k6'].forEach((id,i)=>document.querySelector(`#${id} h3`).insertAdjacentHTML('afterbegin',`<span class="num">${i+1}</span>`));
const pt=(id,[fx,fy])=>{const r=document.getElementById(id).getBoundingClientRect();return[r.left+fx*r.width,r.top+fy*r.height]};
const tie=(a,b)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#fffaf0" stroke="#1f2a44" stroke-dasharray="none"/>`;
// art at 880 px from (144,144): page = 144 + 0.859 * image
let h='';
h+=tie(pt('k1',[1,0.45]),[478,372]);   // the podium, its low left step
h+=tie(pt('k2',[0.88,1]),[336,662]);   // the track lanes
h+=tie(pt('k3',[1,0.3]),[612,684]);    // the diver's boots
h+=tie(pt('k4',[1,0.2]),[812,836]);    // the water in the basin
h+=tie(pt('k5',[0.96,1]),[800,398]);   // the paper tag on the podium
h+=tie(pt('k6',[0.6,1]),[952,384]);    // the hand
document.getElementById('leads').innerHTML=h;
</script></body></html>
