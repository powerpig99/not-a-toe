<!doctype html>
<html><head><meta charset="utf-8">
<title>Infographic: The Carry That Cannot Be Named Inside the Register (picture: Nano Banana through Antigravity, ukiyo-e woodblock print)</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@font-face { font-family: "Info Sans", "Figtree"; src: url(../../../../kits/shared/lib/fonts/Figtree.ttf); font-weight: 300 900; }
@font-face { font-family: "Info Sans", "NotoSC"; src: url(../../../../kits/shared/lib/fonts/NotoSansSC.ttf); font-weight: 100 900; }
/* woodblock palette: Prussian blue, persimmon, sumi, on the print's own washi cream */
:root { --navy:#1d3557; --ink:#2b2622; --prussian:#1f4e79; --persimmon:#b5481a; --sumi:#4a3f36; --ochre:#8a5a12; --moss:#3f6b2c; --plate: rgba(255,252,244,0.96); }
html,body{margin:0}
body{width:1024px;height:1024px;overflow:hidden;position:relative;color:var(--ink);font-family:"Figtree","NotoSC",sans-serif;background:#fbf2d6}
body.zh{font-family:"NotoSC",sans-serif}
.pic{position:absolute;left:0;top:0;width:1024px;height:1024px}
svg.art{position:absolute;left:0;top:0}
.plate{position:absolute;box-sizing:border-box;background:var(--plate);border-radius:6px;padding:8px 11px 9px;border-left:4px solid var(--c);box-shadow:0 1px 0 rgba(60,40,20,.18),0 3px 9px rgba(60,40,20,.20)}
.plate h3{margin:0 0 3px;font-size:14.5px;line-height:1.2;font-weight:800;color:var(--c)}
.plate p{margin:0;font-size:12.6px;line-height:1.36}
.zh .plate h3{font-size:15px;font-weight:700}.zh .plate p{font-size:13px;line-height:1.55}
.plate b{color:var(--c)}
.title{position:absolute;left:24px;top:16px;width:976px}
.title h1{margin:0;font-size:35px;line-height:1.08;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.zh .title h1{font-size:38px;letter-spacing:.06em;font-weight:700}
.title .claim{margin-top:6px;width:900px;font-size:16px;line-height:1.38;font-weight:600}
.zh .title .claim{font-size:17px;line-height:1.5}
.title .url{margin-top:5px;font:10.5px "DejaVu Sans Mono",monospace;color:#6a5e50}
.use{display:flex;gap:14px;align-items:center;background:rgba(232,240,224,.97)}
.use h3{margin:0;white-space:nowrap;font-size:15.5px}
.nw{white-space:nowrap}
#path{stroke:var(--persimmon);stroke-opacity:.85;stroke-width:4;stroke-dasharray:0.1 9;stroke-linecap:round}
.num{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:6px;vertical-align:1px;font-weight:700;font-family:"Figtree"}
</style></head><body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024"><defs><marker id="chev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#b5481a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="path" fill="none"></g><g id="leads" fill="none" stroke="#3a3029" stroke-width="1.4" stroke-dasharray="3 3"></g></svg>
<div class="title"><h1 data-k="title"></h1><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/the-carry-that-cannot-be-named-inside-the-register/</div></div>

<div class="plate" id="k1" style="left:708px;top:150px;width:304px;--c:var(--prussian)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="plate" id="k2" style="left:368px;top:150px;width:312px;--c:var(--prussian)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="plate" id="k3" style="left:12px;top:150px;width:328px;--c:var(--persimmon)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="plate" id="k4" style="left:12px;top:728px;width:314px;--c:var(--ochre)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="plate" id="k5" style="left:354px;top:728px;width:314px;--c:var(--sumi)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="plate" id="k6" style="left:696px;top:728px;width:316px;--c:var(--moss)"><h3 data-k="c6h"></h3><p data-k="c6"></p></div>
<div class="plate use" id="ku" style="left:12px;top:904px;width:1000px;--c:var(--navy)"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<!-- Full-bleed layout from the kit template. The art (ukiyo-e woodblock, take s4 of nine, picture by Nano Banana through Antigravity):
 lit lantern ~ (143,495), left end post x~205, eight dark lanterns 4 + 4 with a middle rod x~538, right end post x~882, rack y~375-680.
 Reading order: top row right to left (1,2,3), down the open left margin, bottom row left to right (4,5,6). -->
<script>
const S={en:{
title:'The Carry That Cannot Be Named Inside the Register',
claim:'Inside a fixed-width register addition follows the rules, while reading overflow as a carry steps outside the bit space.',
c1h:'Inside the eight bits',
c1:'Add <b>1</b> to <b>255</b> and every bit flips to <b>0</b>. Nothing has broken: the step follows the boolean logic of the adders strictly.',
c2h:'One zero, three readings',
c2:'An ordinary <b>wrap-around</b> under mod 256, a <b>silent fault</b> where a counter wraps to zero, or a <b>carry</b> into a ninth bit: the eight bits cannot decide which.',
c3h:'Naming the carry',
c3:'Naming the transition a carry is not another 8-bit addition. The act that judges the 8-bit boundary inadequate has already stepped into the ninth bit.',
c4h:'A thousand jumps widen the register',
c4:'Recorded carries widen 8 bits to 16. <b class=nw>255 + 1 = 256</b> becomes an ordinary in-register step, and at <b class=nw>65535 + 1 = 0</b> the new ceiling wraps in the same silence.',
c5h:'Expressed, not discovered',
c5:'Waiting for a wall at a fixed number looks for the cut inside the residue rather than in the act that draws it. Zahavy’s paper is itself such an act.',
c6h:'Proven, and felt',
c6:'A proof assistant checks Gödel’s theorem as one more valid addition inside a wider register. Felt meaning is registering friction at the boundary of one’s own frame, as when Einstein read <b class=nw>m<sub>i</sub> = m<sub>g</sub></b> as a carry.',
h_use:'What stays useful',
use:'Inside the register, recombination and deduction follow the rules and stay highly useful; speeding them up raises the density of the judgment that tells a wrap-around, an in-register step, and a carry apart.'},
zh:{
title:'进位无法在寄存器之内被命名',
claim:'在定宽寄存器内加法严守规则，而把溢出认作进位是走出位宽的判定',
c1h:'八个比特之内',
c1:'给 <b>255</b> 加上 <b>1</b>，每一个比特翻转为 <b>0</b>。没有任何规则受损：这一步严格遵循加法器的布尔逻辑。',
c2h:'一个零，三种读法',
c2:'模 256 下一次寻常的<b>回绕</b>、计数器静默归零的<b class=nw>故障</b>，还是向第九位的<b>进位</b>：<span class=nw>在八个比特之内</span><span class=nw>无从判定。</span>',
c3h:'命名进位',
c3:'把这次翻转命名为进位，并不是又一次八位加法。<span class=nw>判定</span>八位边界不再够用的那个动作，本身已经<span class=nw>踏入了第九位。</span>',
c4h:'一千个跳跃加宽寄存器',
c4:'有据可查的进位把寄存器从八位加宽到十六位：<b class=nw>255 + 1 = 256</b> 成了寄存器内部的寻常步骤，而在新的上限处，<b class=nw>65535 + 1 = 0</b> 在同样的<span class=nw>静默中回绕。</span>',
c5h:'是表达，不是发现',
c5:'等待一堵停在固定数字上的墙，是在残余物内部<span class=nw>寻找</span>切分，而不是在划出切分的动作中寻找它。<span class=nw>扎哈维</span>的论文本身就是这样一个动作。',
c6h:'证明与体会',
c6:'证明助手核验哥德尔定理，只是更宽寄存器内部又一次合乎规则的加法。体会深意，是在自身框架边界处对摩擦的登记，正如爱因斯坦把 <b class=nw>m<sub>i</sub> = m<sub>g</sub></b> <span class=nw>认作进位。</span>',
h_use:'依然有用之处',
use:'在寄存器之内，符号重组与形式演绎严守规则，保持着高度的实用价值；加速它们，只会推高判定回绕、寄存器内步骤与进位的那份判断的密度。'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',W=S[lang];
document.documentElement.lang=lang;document.body.classList.toggle('zh',lang==='zh');
for(const el of document.querySelectorAll('[data-k]'))el.innerHTML=W[el.dataset.k];
['k1','k2','k3','k4','k5','k6'].forEach((id,i)=>document.querySelector(`#${id} h3`).insertAdjacentHTML('afterbegin',`<span class="num">${i+1}</span>`));
const R=id=>document.getElementById(id).getBoundingClientRect();
const pt=(id,[fx,fy])=>{const r=R(id);return[r.left+fx*r.width,r.top+fy*r.height]};
const tie=(a,b)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#fffaf0" stroke="#3a3029" stroke-dasharray="none"/>`;
let h='';
h+=tie(pt('k1',[0.5,1]),[826,446]);   // right half of the eight dark lanterns
h+=tie(pt('k2',[0.25,1]),[412,446]);  // left half of the eight dark lanterns
h+=tie(pt('k3',[0.4,1]),[150,452]);   // the one lit lantern outside the bay
h+=tie(pt('k4',[0.6,0]),[206,672]);   // the left end post: the edge of the register
h+=tie(pt('k5',[0.55,0]),[539,672]);  // the rod dividing the bay: a wall inside the frame
h+=tie(pt('k6',[0.6,0]),[882,672]);   // the right end post: the boundary of the frame
document.getElementById('leads').innerHTML=h;
// numbered path: plate edge to plate edge, only through open paper
const seg=(a,b)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}L${b[0].toFixed(0)} ${b[1].toFixed(0)}" marker-end="url(#chev)"/>`;
const by=id=>{const r=document.querySelector(`#${id} .num`).getBoundingClientRect();return r.top+r.height/2};
let ph='';
ph+=seg([R('k1').left-3,by('k1')],[R('k2').right+5,by('k2')]);
ph+=seg([R('k2').left-3,by('k2')],[R('k3').right+5,by('k3')]);
ph+=seg([30,R('k3').bottom+6],[30,R('k4').top-8]);
ph+=seg([R('k4').right+3,by('k4')],[R('k5').left-5,by('k5')]);
ph+=seg([R('k5').right+3,by('k5')],[R('k6').left-5,by('k6')]);
document.getElementById('path').innerHTML=ph;
</script></body></html>
