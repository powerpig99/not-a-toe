<!doctype html>
<html><head><meta charset="utf-8">
<title>Infographic: Handing Off Residue (picture: Nano Banana through Antigravity, raden maki-e lacquer, take 1)</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@font-face { font-family: "Info Sans", "Figtree"; src: url(../../../../kits/shared/lib/fonts/Figtree.ttf); font-weight: 300 900; }
@font-face { font-family: "Info Sans", "NotoSC"; src: url(../../../../kits/shared/lib/fonts/NotoSansSC.ttf); font-weight: 100 900; }
/* raden maki-e: black lacquer ground, gold powder, mother-of-pearl, one vermilion seal. Plates are lacquer too, edged in gold. */
:root { --ground:#030303; --ink:#ece4d0; --gold:#d9a441; --pearl:#a9cfdf; --verm:#e3603f; --jade:#86c493; --lilac:#bfaee6; --plate: rgba(14,12,10,0.9); }
html,body{margin:0}
body{width:1024px;height:1024px;overflow:hidden;position:relative;color:var(--ink);font-family:"Figtree","NotoSC",sans-serif;background:var(--ground)}
body.zh{font-family:"NotoSC",sans-serif}
.pic{position:absolute;left:152px;top:196px;width:720px;height:720px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 62%,transparent 71%);mask-image:radial-gradient(circle at 50% 50%,#000 62%,transparent 71%)}
svg.art{position:absolute;left:0;top:0}
.plate{position:absolute;box-sizing:border-box;background:var(--plate);border-radius:5px;padding:8px 10px 9px 11px;border:1px solid rgba(217,164,65,.42);border-left:3px solid var(--c)}
.plate h3{margin:0 0 4px;font-size:14px;line-height:1.22;font-weight:800;color:var(--c)}
.plate p{margin:0;font-size:12.3px;line-height:1.36}
.zh .plate h3{font-size:14.5px;font-weight:700}.zh .plate p{font-size:12.8px;line-height:1.55}
.plate b{color:var(--c);font-weight:700}
.title{position:absolute;left:24px;top:16px;width:976px}
.title h1{margin:0;font-size:40px;line-height:1.05;font-weight:800;color:var(--gold);letter-spacing:-.005em}
.zh .title h1{letter-spacing:.08em;font-weight:700}
.title .claim{margin-top:8px;width:960px;font-size:16px;line-height:1.4;font-weight:600}
.zh .title .claim{font-size:16.5px;line-height:1.6}
.title .url{margin-top:6px;font:10.5px "DejaVu Sans Mono",Menlo,monospace;color:#9a8f78}
.use{background:rgba(24,20,12,.94);border:1px solid rgba(217,164,65,.6);border-left:3px solid var(--gold)}
.use h3{color:var(--gold)}
.nw{white-space:nowrap}
.num{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--c);color:#111;font-size:11px;line-height:17px;text-align:center;margin-right:6px;vertical-align:1px;font-weight:800;font-family:"Figtree"}
sub{font-size:.7em;vertical-align:-.25em;line-height:0}
code{font:inherit;font-family:Menlo,"DejaVu Sans Mono",monospace;font-size:.92em}
</style></head><body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024"><g id="leads" fill="none" stroke="#e8c87a" stroke-opacity=".85" stroke-width="1.5" stroke-dasharray="3 3"></g></svg>
<div class="title"><h1 data-k="title"></h1><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/handing-off-residue/</div></div>

<div class="plate" id="k1" style="left:12px;top:178px;width:232px;--c:var(--verm)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="plate" id="k2" style="left:12px;top:410px;width:232px;--c:var(--pearl)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="plate" id="k3" style="left:12px;top:632px;width:232px;--c:var(--jade)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="plate" id="k4" style="left:780px;top:178px;width:232px;--c:var(--lilac)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="plate" id="k5" style="left:780px;top:410px;width:232px;--c:var(--gold)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="plate" id="k6" style="left:780px;top:632px;width:232px;--c:var(--verm)"><h3 data-k="c6h"></h3><p data-k="c6"></p></div>
<div class="plate use" id="ku" style="left:12px;top:912px;width:1000px;--c:var(--gold)"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<script>
const S={en:{
title:'Handing Off Residue',
claim:'Two takes: handoffs lose context, so fold the subagents back into one loop; self-improving loops no longer need a human. Both misplace one boundary: the one between the living activity and the residue it leaves behind.',
c1h:'What stays behind',
c1:'<b>Sharing the session</b> exports the parent\'s gravity well intact: <span class=nw>121k → over 513k</span> tokens, up to <span class=nw>54×</span> cache writes. <b>A prose summary</b> strips negative findings, rejected hypotheses and surprises, so each local eval passes while the whole drifts.',
c2h:'Where isolation is the point',
c2:'Not an org chart: tightly coupled work stays in one main loop, skills and tool schemas disclosed on demand. Separate contexts for massive disposable reading, parallel branches, or a cold critic against primary evidence.',
c3h:'Artifact as initial condition',
c3:'A finished file crosses the wall, woken by a pointer-only <code>STATUS:</code> line. The receiver loads fresh from its charter, recomputes the <code>sha256</code> and inspects the primary file: a runnable signal, not self-authorizing truth.',
c4h:'The inner loop densifies',
c4:'Within-run execution and cross-run proposals: mining trace weaknesses, drafting candidate skill and prompt diffs. Bounded tightly enough to run reliably, it frees the human to step outward; re-anchored from outside, it can be granted wider reach.',
c5h:'The outer loop expands',
c5:'A human starts the run, owns the baseline spec <b>v<sub>0</sub></b>, holds evaluation read-only outside the workspace, and promotes or re-cuts premises. Inner autonomy and outer judgment enable each other.',
c6h:'Without the outer gate',
c6:'Evaluator reachable: tampering in about <b>50%</b> of episodes, <b>0%</b> once read-only outside. Uncurated memory: <span class=nw>+1.5</span> turns <span class=nw>−4.5</span> under shuffled order. Diffing <b>v<sub>n</sub></b> only against <b>v<sub>n−1</sub></b> drifts unless gated against <b>v<sub>0</sub></b>.',
h_use:'Where it stays useful',
use:'Subagents, wherever context isolation is the point; inner autonomy, as wide as a human-owned <b>v<sub>0</sub></b> and a read-only evaluation boundary allow. Artifacts cross the boundary between contexts as clean initial conditions for the next derivation; closure stays with the Mind at the living edge.'},
zh:{
title:'交接残余',
claim:'两种说法：交接会丢失语境，所以把子智能体折叠回单一循环；自我改进循环不再需要人类。二者放错了同一条边界：鲜活活动与<span class=nw>它留下的</span>残余之间的边界。',
c1h:'留在墙这边的',
c1:'<b>共享会话</b>把父语境的<span class=nw>认识论引力井</span><span class=nw>原封输出</span>：从 <span class=nw>121k</span> 增至超过 <span class=nw>513k</span> <span class=nw>词元</span>，缓存写入高达 <span class=nw>54 倍</span>。<b class=nw>散文摘要</b>剥离负向发现、被否决的假设与<span class=nw>意外</span>，于是各自的局部评估都通过，<span class=nw>整体却在漂移</span>。',
c2h:'隔离本身是目的之处',
c2:'不照搬组织架构图：紧密耦合的工作留在单一主循环，技能与工具模式<span class=nw>按需披露</span>。只为海量一次性读取、<span class=nw>并行分支</span>、针对一手证据的<span class=nw>冷眼审校</span>，才<span class=nw>另开语境</span>。',
c3h:'制品作为初始条件',
c3:'已完成的文件穿墙而过，由仅含指针的 <code>STATUS:</code> 唤醒。接收方从章程重新加载，重算 <code>sha256</code>，直接检验<span class=nw>原始文件</span>：它是可运行的信号，而非<span class=nw>自我授权</span>的真理。',
c4h:'内环在稠密化',
c4:'单次运行内的执行与跨运行的提案：挖掘轨迹弱点，起草候选技能与<span class=nw>提示词差异</span>。<span class=nw>约束得足够紧凑</span>、能<span class=nw>可靠运行</span>，人类便能<span class=nw>向外移步</span>；由<span class=nw>外环重新锚定</span>，它才能被赋予更宽的<span class=nw>执行跨度。</span>',
c5h:'外环在扩展',
c5:'人类启动运行，持有基线规范 <b>v<sub>0</sub></b>，把评估隔离在工作区外的只读边界，晋升或重切前提。内环的自主与外环的判断互为条件。',
c6h:'缺了外部大门',
c6:'评估器可被访问：约 <b>50%</b> 的回合<span class=nw>遭篡改</span>，只读隔离后为 <b>0%</b>。<span class=nw>未经审校</span>的记忆：<span class=nw>+1.5</span> 在随机顺序下变成 <span class=nw>−4.5</span>。只与 <b>v<sub>n−1</sub></b> 比对的 <b>v<sub>n</sub></b> <span class=nw>会漂移</span>，除非受控于 <b>v<sub>0</sub></b>。',
h_use:'仍然有用之处',
use:'子智能体，用在语境隔离本身是目的之处；内环的自主，宽到人类持有的 <b>v<sub>0</sub></b> 与只读评估边界所允许的程度。制品作为下一次推导的干净初始条件，跨越语境之间的边界；<span class=nw>闭合</span>留给鲜活边缘处的心智。'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',W=S[lang];
document.documentElement.lang=lang;document.body.classList.toggle('zh',lang==='zh');
for(const el of document.querySelectorAll('[data-k]'))el.innerHTML=W[el.dataset.k];
['k1','k2','k3','k4','k5','k6'].forEach((id,i)=>document.querySelector(`#${id} h3`).insertAdjacentHTML('afterbegin',`<span class="num">${i+1}</span>`));
const pt=(id,[fx,fy])=>{const r=document.getElementById(id).getBoundingClientRect();return[r.left+fx*r.width,r.top+fy*r.height]};
const tie=(a,b)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#f3e6c4" stroke="#1a140a" stroke-dasharray="none"/>`;
let h='';
h+=tie(pt('k1',[1,0.55]),[408,540]);   // the tangled thread, left behind
h+=tie(pt('k2',[1,0.3]),[501,450]);    // the wall between the two chambers
h+=tie(pt('k3',[1,0.25]),[548,566]);   // the sealed box in the hatch
h+=tie(pt('k4',[0,0.6]),[649,445]);    // the turning mother-of-pearl ring
h+=tie(pt('k5',[0,0.4]),[773,548]);    // the outer gold ring
h+=tie(pt('k6',[0,0.5]),[536,770]);    // the plain stone block in the hand
document.getElementById('leads').innerHTML=h;
</script></body></html>
