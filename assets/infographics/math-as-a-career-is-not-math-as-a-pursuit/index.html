<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Infographic, picture by an image model</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
  :root { --paper: #fcf8e3; --navy: #1d2147; --ink: #262a50; --green: #2f8a4c; --violet: #6d4fc4; --gold: #a8780e; --coral: #d9503f; --sky: #2a7fc4; }
  html, body { margin: 0; background: var(--paper); }
  body { width: 1024px; height: 1024px; overflow: hidden; position: relative; color: var(--ink); font-family: "Info Sans", "Figtree", "Avenir Next", "Noto Sans CJK SC", sans-serif; }
  .zh { font-family: "Info Sans", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
  svg.art { position: absolute; left: 0; top: 0; }
  .pic { position: absolute; left: 202px; top: 150px; width: 620px; height: 620px; -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); }
  .head { position: absolute; top: 30px; width: 450px; }
  .head h2 { margin: 0 0 6px; font-size: 29px; font-weight: 700; color: var(--navy); }
  .head p { margin: 0; font-size: 16.5px; line-height: 1.34; }
  .zh .head h2 { font-size: 30px; letter-spacing: 0.04em; } .zh .head p { font-size: 17px; line-height: 1.5; }
  .head b, .call b { color: var(--c); font-weight: 700; }
  .call { position: absolute; }
  .call h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.2; font-weight: 700; color: var(--c); }
  .call p { margin: 0; font-size: 13.4px; line-height: 1.34; }
  .zh .call h3 { font-size: 17px; } .zh .call p { font-size: 14.2px; line-height: 1.5; }
  .call.l { text-align: right; }
  .zh .head[style*="gold"] b { white-space: nowrap; }
  .call p, .head p, .use p { text-wrap: pretty; } .call h3 { text-wrap: balance; }
  .zh .call h3 { font-size: 16px; }
  .use { position: absolute; left: 44px; top: 778px; width: 936px; box-sizing: border-box; background: #e2f0e2; border-radius: 34px; padding: 12px 28px 13px; display: flex; gap: 18px; align-items: center; }
  .use h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--green); white-space: nowrap; }
  .use p { margin: 0; font-size: 14.4px; line-height: 1.36; }
  .zh .use p { font-size: 15px; line-height: 1.5; }
  .banner { position: absolute; left: 0; top: 878px; width: 1024px; height: 146px; background: var(--navy); color: #fff; text-align: center; }
  .banner h1 { margin: 20px 60px 6px; font-size: 30px; line-height: 1.2; font-weight: 700; }
  .zh .banner h1 { line-height: 1.3; font-size: 32px; letter-spacing: 0.06em; }
  .banner .claim { font-size: 18px; color: #f3d57a; margin: 0 70px; line-height: 1.35; }
  .zh .banner .claim { font-size: 19px; }
  .banner .url { position: absolute; left: 0; right: 0; bottom: 9px; font: 11px "DejaVu Sans Mono", ui-monospace, monospace; color: #8f93c4; }
</style>
</head>
<body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024" viewBox="0 0 1024 1024"><g id="leads" fill="none" stroke="#1d2147" stroke-width="1.6"></g></svg>

<div class="head" style="left: 40px; --c: var(--gold)"><h2 data-k="h_belief"></h2><p data-k="belief"></p></div>
<div class="head" style="left: 536px; --c: var(--coral)"><h2 data-k="h_stops"></h2><p data-k="stops"></p></div>

<div class="call l" id="L1" style="left: 14px; top: 300px; width: 196px; --c: var(--green)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="call l" id="L2" style="left: 14px; top: 452px; width: 196px; --c: var(--violet)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="call l" id="L3" style="left: 14px; top: 604px; width: 196px; --c: var(--coral)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="call" id="R1" style="left: 812px; top: 196px; width: 198px; --c: var(--sky)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="call" id="R2" style="left: 812px; top: 380px; width: 198px; --c: var(--gold)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="call" id="R3" style="left: 812px; top: 590px; width: 198px; --c: var(--green)"><h3 data-k="c6h"></h3><p data-k="c6"></p></div>

<div class="use"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<div class="banner"><h1 data-k="title"></h1><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/math-as-a-career-is-not-math-as-a-pursuit/</div></div>

<script>
const S = {
  en: {
    h_belief: 'The belief', belief: 'A model solves a PhD student’s thesis problem: <b>careers are being reoriented</b>, and the moment calls for sympathy.',
    h_stops: 'Where it stops', stops: 'Math as a career is not math as a pursuit. The two <b>track while the pursuit drives the career</b>; only with the career placed first does the advance register as a loss.',
    c1h: 'The pursuit drives the career', c1: 'The thesis is what working through a problem leaves behind; the position, what that residue is traded for.',
    c2h: 'The degree conferred for itself', c2: 'The paper still carries the name; what it recorded no longer travels with it.',
    c3h: 'The thesis as a bargaining chip', c3: 'With the thesis held as the career’s chip, a solved problem registers as credit taken away, not more mathematics.',
    c4h: 'A faster engine is more mathematics', c4: 'The engine that solved this one is at hand for the next; the next question still opens at the Mind doing the mathematics.',
    c5h: 'The order reversed', c5: 'The career becomes the end, mathematics the means; once the means can be replaced, the two part ways.',
    c6h: 'The homework score taken for learning', c6: 'With the score placed first, the capability it was meant to record thins.',
    h_use: 'What stays useful', use: 'Each marker as residue, pointing back to the activity: that is precisely its use. With the pursuit back in front, a model solving a problem is reach extended further.',
    title: 'Math as a Career Is Not Math as a Pursuit', claim: 'The two track while the pursuit drives the career; mistaking the marker for what it represents reverses causality.',
  },
  zh: {
    h_belief: '信念', belief: '一个模型解开了一位博士生的论文题目：<b>职业正在被重新定向</b>，这个时刻值得的是同情。',
    h_stops: '它在何处止步', stops: '作为职业的数学不是作为追求的数学。<b>追求带动职业时二者同行</b>；只有把职业放在前面，才会把这一进展记成损失。',
    c1h: '追求带动职业', c1: '论文是做一个问题留下的东西，职位是这份留存换来的。',
    c2h: '为它自己而授予的学位', c2: '纸上的名字还在，它所记录的东西却不再跟着它走。',
    c3h: '论文作为职业筹码', c3: '论文被当作职业筹码，解开的问题就被记成被拿走的功劳，而不是多出来的数学。',
    c4h: '更快的引擎就是更多的数学', c4: '解开这一个的引擎，也正好拿来对付下一个；下一个问题仍在做数学的心智那里打开。',
    c5h: '先后倒过来', c5: '职业成了所求，数学成了手段；手段一旦能被替代，二者就分道。',
    c6h: '作业分数被当成了学习', c6: '分数放在前面，它本该记录的能力就变薄。',
    h_use: '仍然有用的', use: '每一个标记作为残余指回活动，它的用处恰在于此。把追求放回前面，模型解开一个问题就是够得更远。',
    title: '作为职业的数学不是作为追求的数学', claim: '追求带动职业时二者同行；把标记当成它所代表的东西，因果就倒了过来。',
  },
};
const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en', W = S[lang];
document.documentElement.lang = lang;
document.body.classList.toggle('zh', lang === 'zh');
for (const el of document.querySelectorAll('[data-k]')) el.innerHTML = W[el.dataset.k];
const at = (x, y) => [Math.round(202 + x * 0.6055), Math.round(150 + y * 0.6055)];
// leader starts beside each callout's heading
const from = (id) => { const el = document.getElementById(id), r = el.getBoundingClientRect(), h = el.querySelector('h3').getBoundingClientRect(); return el.classList.contains('l') ? [Math.round(r.right + 4), Math.round(h.top + h.height / 2)] : [Math.round(r.left - 4), Math.round(h.top + h.height / 2)]; };
const lead = (id, p) => { const a = from(id), b = at(...p); return `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#fcf8e3"/>`; };
document.getElementById('leads').innerHTML =
  lead('L1', [418, 512]) +   // the mathematician's glowing polyhedron
  lead('L2', [575, 748]) +   // the rolled diploma
  lead('L3', [492, 790]) +   // the navy book (the thesis)
  lead('R1', [530, 528]) +   // the machine's gripper with the solved polyhedron
  lead('R2', [826, 470]) +   // the ladder
  lead('R3', [668, 728]);    // the ticked sheet (a score)
</script>
</body>
</html>
