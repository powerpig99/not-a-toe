<!doctype html>
<html><head><meta charset="utf-8">
<title>Infographic: The Surface That Registers (picture: Nano Banana through Antigravity)</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@font-face { font-family: "Info Sans", "Figtree"; src: url(../../../../kits/shared/lib/fonts/Figtree.ttf); font-weight: 300 900; }
@font-face { font-family: "Info Sans", "NotoSC"; src: url(../../../../kits/shared/lib/fonts/NotoSansSC.ttf); font-weight: 100 900; }
:root { --navy:#1f2a44; --ink:#2a2c3a; --terra:#b24a2e; --teal:#2f7470; --ochre:#93690c; --slate:#3d5a80; --verm:#c0392b; --plum:#6a4a8a; --plate: rgba(255,251,240,0.94); }
html,body{margin:0}
body{width:1024px;height:1024px;overflow:hidden;position:relative;color:var(--ink);font-family: "Info Sans", "Figtree","NotoSC",sans-serif;background:#f7eacc}
body.zh{font-family: "Info Sans", "NotoSC",sans-serif}
/* the picture at 0.8 scale, its own cream ground continuing the page; edges faded into the page */
.pic{position:absolute;left:205px;top:190px;width:819px;height:819px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 24px),linear-gradient(to bottom,transparent 0,#000 24px);-webkit-mask-composite:source-in;mask-composite:intersect}
svg.art{position:absolute;left:0;top:0}
.plate{position:absolute;box-sizing:border-box;background:var(--plate);border-radius:6px;padding:7px 10px 8px;border-left:4px solid var(--c);box-shadow:0 1px 0 rgba(60,40,10,.18),0 3px 9px rgba(60,40,10,.16)}
.plate h3{margin:0 0 3px;font-size:14px;line-height:1.2;font-weight:800;color:var(--c)}
.plate p{margin:0;font-size:12.3px;line-height:1.33}
.zh .plate h3{font-size:14.5px;font-weight:700}.zh .plate p{font-size:12.6px;line-height:1.5}
.plate b{color:var(--c)}
.title{position:absolute;left:22px;top:16px;width:500px}
.title h1{margin:0;font-size:39px;line-height:1.05;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.zh .title h1{font-size:40px;letter-spacing:.06em;font-weight:700}
.title .claim{margin-top:8px;width:500px;font-size:15.5px;line-height:1.38;font-weight:600;color:#33364a}
.zh .title .claim{font-size:16px;line-height:1.55}
.title .url{margin-top:6px;font:10px "DejaVu Sans Mono",monospace;color:#6a6650}
.use{display:flex;gap:14px;align-items:center;background:rgba(232,240,226,.96)}
.use h3{margin:0;white-space:nowrap;font-size:15px}
.nw{white-space:nowrap}
.zh #k1{top:336px !important}
.num{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:6px;vertical-align:1px;font-weight:700;font-family: "Info Sans", "Figtree"}
</style></head><body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024"><g id="leads" fill="none" stroke="#3a3550" stroke-width="1.5" stroke-dasharray="3 3"></g></svg>
<div class="title"><h1 data-k="title"></h1><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/the-surface-that-registers/</div></div>

<div class="plate" id="kb" style="left:22px;top:208px;width:246px;--c:var(--plum)"><h3 data-k="hb"></h3><p data-k="b"></p></div>
<div class="plate" id="ks" style="left:278px;top:208px;width:246px;--c:var(--ochre)"><h3 data-k="hs"></h3><p data-k="s"></p></div>
<div class="plate" id="k1" style="left:294px;top:318px;width:272px;--c:var(--verm)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="plate" id="k2" style="left:10px;top:470px;width:222px;--c:var(--terra)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="plate" id="k3" style="left:548px;top:16px;width:464px;--c:var(--slate)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="plate" id="k4" style="left:548px;top:150px;width:430px;--c:var(--teal)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="plate" id="k5" style="left:574px;top:872px;width:438px;--c:var(--ochre)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="plate" id="k6" style="left:10px;top:716px;width:222px;--c:var(--navy)"><h3 data-k="c6h"></h3><p data-k="c6"></p></div>
<div class="plate use" id="ku" style="left:12px;top:962px;width:550px;--c:var(--teal)"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<script>
const S={en:{
title:'The Surface That Registers',
claim:'A circulating sentence produces the sense of mutual recognition precisely by remaining thin enough for many higher-dimensional models to intersect it without sharing structure.',
hb:'The common reading',
b:'Broad acceptance is evidence of uniqueness. Inside its frame that holds: the sentence did clear a wider filter.',
hs:'Where it stops',
s:'The filter is <b>compatibility</b>, enlarged by constraining fewer dimensions. The thinness that reaches more minds keeps most content underspecified.',
c1h:'Borrowed weight',
c1:'The line tracks an intention, the source supplies weight, posting registers as expression. None of the poster’s premises enters the channel. <b>The satisfaction is real. The transmission is zero.</b>',
c2h:'Travel sheds the chain',
c2:'Extracted, the formulation sheds the chain of distinctions that selected it. Circulation measures <b>the breadth of possible intersections</b>, not the density of shared particularity.',
c3h:'A low-dimensional surface',
c3:'It constrains a few axes and leaves the rest free. Thiel’s line pins <b>one binary contrast</b>, opposing the crowd versus thinking for oneself, and leaves open what the crowd is, which premises are fixed, and where one’s own practice sits.',
c4h:'Sparse overlap',
c4:'Different models project onto the same axes and register an exact hit. The constrained dimensions do align; each model’s premises, boundaries and revision points stay outside. <b>Resonance is the registration of sparse overlap.</b>',
c5h:'Weak and strong uniqueness',
c5:'What survives projection onto many models is a residual, not a dense packet they share. A trace that keeps its premises constrains many orthogonal axes, so it <b>refracts and meets resistance</b> by construction.',
c6h:'The first-person extension',
c6:'Heeding the essence, not the words: laying out the actual chain of premises, boundaries and revisions <b>at one’s own locus</b>, where the Mind draws the next cut.',
h_use:'What stays useful',
use:'Inside already-shared frames, a short token indexes a whole shared history. It stops carrying once the frame itself must be revised.'},
zh:{
title:'登记共鸣的表面',
claim:'流转的句子之所以唤起相互认出的感觉，恰在于它薄到足以让众多高维模型与之相交而<span class=nw>不共享结构</span>。',
hb:'常见的解读',
b:'广泛受认可即是独特性的证据。在它自身的框架内这成立：这句话确实通过了<span class=nw>更宽的过滤器</span>。',
hs:'在何处止步',
s:'它通过的过滤器名叫<b>兼容性</b>，靠减少受约束的维度来拓宽。让句子触及更多心智的那份单薄，也使大部分内容<span class=nw>未被指明</span>。',
c1h:'借来的分量',
c1:'句子贴合意图，出处补上分量，发布登记为一次表达。发布者的前提丝毫没有进入<span class=nw>通道</span>。<b>满足感是真实的，<span class=nw>传递量却为零</span>。</b>',
c2h:'流转蜕去链条',
c2:'一经抽离，表述便蜕去挑选它的<span class=nw>那条区分链条</span>。流转度量的是<b>可能相交的截面<span class=nw>有多宽</span></b>，而不是所共享的特殊性<span class=nw>有多密</span>。',
c3h:'低维表面',
c3:'它只约束寥寥几个轴向，其余留白。蒂尔的句子只约束<b>一组二元对比</b>：<span class=nw>反对大众</span>与自己思考；什么算作大众、哪些前提被固定、自身做法处于何处，<span class=nw>全都敞开</span>。',
c4h:'稀疏重叠',
c4:'各异的模型投射到同一组轴向上，登记一次精准命中。受约束的维度确实<span class=nw>对齐了</span>；各自的前提、边界与修正节点留在通道之外。<b>共鸣，是对<span class=nw>稀疏重叠</span>的<span class=nw>登记</span>。</b>',
c5h:'弱独特性与强独特性',
c5:'投射到众多模型之上后幸存的，是残余物，而不是它们共享的<span class=nw>高密度信息包</span>。保留前提链条的印迹同时约束多个正交轴向，在构造上<span class=nw>就会</span><b>遭遇折射<span class=nw>与阻力</span></b>。',
c6h:'第一人称的延展',
c6:'领会要义而非字面：<b>在自己的位点上</b>把前提、边界与修正的实际链条一一铺开，心智在那里做出<span class=nw>下一次切分</span>。',
h_use:'依然有用之处',
use:'在已共享的框架内，简短的符号能索引一整段共同经历；一旦需要修正的<span class=nw>正是</span>框架本身，它便<span class=nw>不再承载</span>。'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',W=S[lang];
document.documentElement.lang=lang;document.body.classList.toggle('zh',lang==='zh');
for(const el of document.querySelectorAll('[data-k]'))el.innerHTML=W[el.dataset.k];
['k1','k2','k3','k4','k5','k6'].forEach((id,i)=>document.querySelector(`#${id} h3`).insertAdjacentHTML('afterbegin',`<span class="num">${i+1}</span>`));
// art coordinates (1024 px picture) to page: 205 + 0.8x, 190 + 0.8y
const A=(x,y)=>[Math.round(205+0.8*x),Math.round(190+0.8*y)];
const pt=(id,[fx,fy])=>{const r=document.getElementById(id).getBoundingClientRect();return[r.left+fx*r.width,r.top+fy*r.height]};
const tie=(a,b,via)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}${via?via.map(v=>`L${v[0]} ${v[1]}`).join(''):''}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#fffaf0" stroke="#3a3550" stroke-dasharray="none"/>`;
let h='';
h+=tie(pt('k1',[0.55,1]),A(370,580));            // the blank card on the sheet
h+=tie(pt('k2',[1,0.35]),A(175,520));            // the knotted chain, standing apart
h+=tie([1000,pt('k3',[0,1])[1]],A(955,560));            // the thin sheet, its open right end
h+=tie([638,pt('k4',[0,1])[1]],[624,655],[[638,640]]); // the shell's ring, down the gap between shell and coral
h+=tie([638,640],[710,655]);                       // the coral's ring, from the same gap
h+=tie([935,pt('k4',[0,1])[1]],[903,655],[[935,640]]); // the crystals' ring, down the clear side right of the crystals
h+=tie(pt('k5',[0.12,0]),A(495,835));            // the shell below the sheet
h+=tie(pt('k5',[0.42,0]),A(660,850));            // the coral below
h+=tie(pt('k5',[0.72,0]),A(830,845));            // the crystals below
h+=tie(pt('k6',[1,0.4]),A(165,820));             // the knotted chain at its own locus
document.getElementById('leads').innerHTML=h;
</script></body></html>
