<!doctype html>
<html><head><meta charset="utf-8">
<title>Infographic: What Is Metaphysics? (picture: Nano Banana through Antigravity, egg tempera predella panel, take A3)</title>
<style>
  @font-face { font-family: "Info Sans"; font-weight: 300 900; src: url("../fonts/info-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  @font-face { font-family: "Info Sans"; font-weight: 100 900; src: url("./info-sans.zh.woff2") format("woff2"); unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@font-face { font-family: "Info Sans", "Figtree"; src: url(../../../../kits/shared/lib/fonts/Figtree.ttf); font-weight: 300 900; }
@font-face { font-family: "Info Sans", "NotoSC"; src: url(../../../../kits/shared/lib/fonts/NotoSansSC.ttf); font-weight: 100 900; }
/* tempera earth pigments: lapis, rose madder, terre verte, ochre, umber */
:root { --navy:#24314f; --ink:#2b2a2a; --lapis:#2f4f86; --madder:#a2443d; --verte:#4f6f4a; --ochre:#8d6418; --umber:#5b4632; --plate: rgba(250,245,232,0.93); }
html,body{margin:0}
body{width:1024px;height:1024px;overflow:hidden;position:relative;color:var(--ink);font-family:"Figtree","NotoSC",sans-serif;background:#c8d1d0}
body.zh{font-family:"NotoSC",sans-serif}
.pic{position:absolute;left:0;top:0;width:1024px;height:1024px}
svg.art{position:absolute;left:0;top:0}
.plate{position:absolute;box-sizing:border-box;background:var(--plate);border-radius:6px;padding:8px 11px 9px;border-left:4px solid var(--c);box-shadow:0 1px 0 rgba(0,0,0,.2),0 4px 10px rgba(40,30,20,.22)}
.plate h3{margin:0 0 3px;font-size:14.5px;line-height:1.2;font-weight:800;color:var(--c)}
.plate p{margin:0;font-size:12.6px;line-height:1.36}
.zh .plate h3{font-size:15px;font-weight:700}.zh .plate p{font-size:13px;line-height:1.55}
.plate b{color:var(--c)}
.title{position:absolute;left:26px;top:20px;width:620px}
.title h1{margin:0;font-size:42px;line-height:1.05;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.title h2{margin:4px 0 0;font-size:20px;line-height:1.2;font-weight:600;color:var(--umber)}
.zh .title h1{font-size:42px;letter-spacing:.06em;font-weight:700}
.zh .title h2{font-size:20px;letter-spacing:.04em;font-weight:500}
.title .claim{margin-top:9px;width:560px;font-size:16px;line-height:1.38;font-weight:600;color:#26303f}
.zh .title .claim{font-size:16.5px;line-height:1.55}
.title .url{margin-top:6px;white-space:nowrap;font:9px "DejaVu Sans Mono",monospace;color:#4a5068}
.use{display:flex;gap:14px;align-items:center;background:rgba(246,240,222,.95)}
.use h3{margin:0;white-space:nowrap;font-size:15.5px}
.nw{white-space:nowrap}
.num{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;line-height:17px;text-align:center;margin-right:6px;vertical-align:1px;font-weight:700;font-family:"Figtree"}
</style></head><body>
<img class="pic" src="art.jpg" alt="">
<svg class="art" width="1024" height="1024"><g id="leads" fill="none" stroke="#3a2c1e" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="3 3"></g></svg>
<div class="title"><h1 data-k="title"></h1><h2 data-k="sub"></h2><div class="claim" data-k="claim"></div><div class="url">powerpig99.github.io/not-a-toe/posts/what-is-metaphysics-as-the-cut-that-names-the-seeking-as-destination/</div></div>

<div class="plate" id="k1" style="left:16px;top:262px;width:282px;--c:var(--lapis)"><h3 data-k="c1h"></h3><p data-k="c1"></p></div>
<div class="plate" id="k2" style="left:660px;top:28px;width:348px;--c:var(--ochre)"><h3 data-k="c2h"></h3><p data-k="c2"></p></div>
<div class="plate" id="k3" style="left:566px;top:596px;width:206px;--c:var(--madder)"><h3 data-k="c3h"></h3><p data-k="c3"></p></div>
<div class="plate" id="k4" style="left:690px;top:258px;width:318px;--c:var(--verte)"><h3 data-k="c4h"></h3><p data-k="c4"></p></div>
<div class="plate" id="k5" style="left:560px;top:812px;width:448px;--c:var(--umber)"><h3 data-k="c5h"></h3><p data-k="c5"></p></div>
<div class="plate use" id="ku" style="left:16px;top:934px;width:992px;--c:var(--navy)"><h3 data-k="h_use"></h3><p data-k="use"></p></div>
<script>
const S={en:{
title:'What Is Metaphysics?',
sub:'As the Cut That Names the Seeking as Destination',
claim:'Naming the irreducible seeking freezes it into a citable object; repeated return to the first person narrows excess lag.',
c1h:'The question presupposes what is sought',
c1:'“What is metaphysics?” expects a determinate field to define. A definition asks the living venture into <b>the display case</b>: a museum of footprints that erases the hand drawing the line.',
c2h:'Naming freezes activity into an object',
c2:'Named, the seeking is <b>mistaken for the destination</b>. Scaffolding put up so further distinctions can land, <b>preserved past its step</b>, becomes the lag that resists the next cut.',
c3h:'Third-person citation thickens image lag',
c3:'Quoted under a name, the expression becomes <b>a portable position</b>, adopted or critiqued from outside. <b>The named object is the lag looking at itself.</b>',
c4h:'Returning to first-person narrows lag',
c4:'Interpretation trails the generating act by at least one step. Each return re-renders the reference toward that bound: <b>a direction, not an arrival</b>.',
c5h:'Public expression is an exercise in clarification, not a destination',
c5:'The record is <b>residue</b>, re-traced by any mind that finds it useful under its own friction, the writer’s too. This cut is a trace as well, while the activity that drew it walks on.',
h_use:'What stays useful',
use:'Heidegger’s 1929 lecture forgoes talk <i>about</i> metaphysics and keeps the questioner inside the question. A name stays useful as a reference: used as an instrument, set down at its step.'},
zh:{
title:'何谓形而上学？',
sub:'作为将追寻命名为目的的一刀',
claim:'将不可化约的追寻命名，即将其冻成可被引用的对象；反复返回第一人称则收窄超额滞后。',
c1h:'问题预设了被寻求之物',
c1:'“何谓形而上学？”期待一个可被定义的<span class=nw>确定领域</span>。要求定义，就是要求活生生的<span class=nw>涉险</span>走入<b><span class=nw>陈列柜</span></b>：一座抹去画线之手的<span class=nw>足迹博物馆</span>。',
c2h:'命名将活动冻成对象',
c2:'追寻一经命名，便<b><span class=nw>被误认成了终点</span></b>。为让后面的区分<span class=nw>落地</span>而搭的<span class=nw>脚手架</span>，<b><span class=nw>越过自身那一步</span>被保存</b>，便成了<span class=nw>抵制</span>下一次切分的滞后。',
c3h:'第三人称引用<br>加厚图像滞后',
c3:'在某个名字之下被引用，表达成了<b><span class=nw>便携的立场</span></b>，可从外部<span class=nw>接纳</span>或批判。<b>被命名的对象，<span class=nw>正是</span><span class=nw>凝视着自身</span>的滞后。</b>',
c4h:'返回第一人称窄化滞后',
c4:'阐释比生成动作至少滞后一步。每一次返回，都把参照朝这一步之界重新渲染：<b>是方向，<span class=nw>不是抵达</span></b>。',
c5h:'公开表达是澄清的练习而非目的',
c5:'记录是<b>残余</b>，供任何在自身摩擦中觉得它有用的心智重新追溯，包括写下它的那个心智。这一刀同样只是痕迹，划出它的活动仍在前行。',
h_use:'依然有用之处',
use:'海德格尔 1929 年的演讲放弃了关于形而上学的讨论，让追问者始终置身于追问之中。名字作为参照依然有用：当作器具使用，在它那一步放下。'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',W=S[lang];
document.documentElement.lang=lang;document.body.classList.toggle('zh',lang==='zh');
for(const el of document.querySelectorAll('[data-k]'))el.innerHTML=W[el.dataset.k];
['k1','k2','k3','k4','k5'].forEach((id,i)=>document.querySelector(`#${id} h3`).insertAdjacentHTML('afterbegin',`<span class="num">${i+1}</span>`));
const pt=(id,[fx,fy])=>{const r=document.getElementById(id).getBoundingClientRect();return[r.left+fx*r.width,r.top+fy*r.height]};
const tie=(a,b)=>`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}L${b[0]} ${b[1]}"/><circle cx="${b[0]}" cy="${b[1]}" r="4" fill="#fffaf0" stroke="#24314f" stroke-dasharray="none"/>`;
let h='';
h+=tie(pt('k1',[0.6,1]),[300,632]);   // the footprint cast in the display case
h+=tie(pt('k2',[0.25,1]),[515,410]);  // the scaffolding
h+=tie(pt('k3',[0,0.35]),[488,630]);  // the two onlookers
h+=tie(pt('k4',[0.42,1]),[818,560]);  // the walker
h+=tie(pt('k5',[0.25,0]),[650,778]);  // the trail of footprints
document.getElementById('leads').innerHTML=h;
</script></body></html>
