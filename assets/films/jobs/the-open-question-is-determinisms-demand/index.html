<script>
"use strict";
const TL = {"en":{"total":408.44,"beats":[{"id":"b01","plate":1,"start":0.8,"dur":26.56,"lines":[{"t":1.12,"d":3.76,"text":"Why did evolution choose humans to be the most intelligent species?"},{"t":5.68,"d":5.12,"text":"The question presupposes a chooser, and that part can be taken out with nothing lost."},{"t":11.2,"d":6.72,"text":"A second premise cannot be taken out: each conscious being chooses for itself and bears the consequences."},{"t":18.48,"d":8.72,"text":"And when the reply comes that this still leaves open whether a choice is determined or not, that openness is already determinism's demand."}]},{"id":"b02","plate":1,"start":28.06,"dur":15.52,"lines":[{"t":28.46,"d":1.2,"text":"Start with the question."},{"t":29.98,"d":3.76,"text":"It supposes that humans were chosen, by someone or by something."},{"t":34.3,"d":3.12,"text":"Once that is accepted, only the chooser can answer."},{"t":37.82,"d":5.6,"text":"The chosen cannot: asking the chosen is asking for a report from a seat it never occupied."}]},{"id":"b03","plate":1,"start":44.28,"dur":38.56,"lines":[{"t":44.68,"d":4.96,"text":"The word selection was borrowed by Darwin from breeders, and breeders do choose."},{"t":50.12,"d":2.56,"text":"The theory kept the word and removed the breeder."},{"t":53.16,"d":5.04,"text":"Individuals vary, they leave different numbers of offspring, and lineages shift."},{"t":58.84,"d":6.88,"text":"People trace kinship with this, and the spread of drug resistance, and the shape of a beak, with no foresight anywhere."},{"t":66.28,"d":6.48,"text":"The trouble begins where the word is read back into a selector, and most intelligent into the rank that selector was aiming at."},{"t":73.48,"d":2.96,"text":"The ruler behind that rank belongs to whoever asks."},{"t":76.84,"d":2.96,"text":"Take the chooser out, and the description still holds."},{"t":80.28,"d":2.4,"text":"That is the mark of a premise that can be dropped."}]},{"id":"b04","plate":1,"start":83.54,"dur":17.92,"lines":[{"t":83.94,"d":1.36,"text":"What remains is this."},{"t":85.86,"d":2.08,"text":"No one else makes the choice for anyone."},{"t":88.42,"d":6.56,"text":"Each conscious being chooses for itself, one thing, another, or nothing at all, and bears what follows."},{"t":95.54,"d":3.2,"text":"Agency is no late product of the evolutionary story."},{"t":99.14,"d":2.08,"text":"The one telling that story is an agent."}]},{"id":"b05","plate":2,"start":103.06,"dur":26.4,"lines":[{"t":103.46,"d":4.4,"text":"Hand this to a language model, and it handles it as a claim to be weighed."},{"t":108.42,"d":7.12,"text":"Handling it so is a choice as well, made by the people who built the model and set its goals, its data and its tests."},{"t":116.18,"d":1.28,"text":"The model does not make it."},{"t":118.02,"d":3.04,"text":"Accepting the output makes it the user's own choice."},{"t":121.54,"d":7.76,"text":"Rejecting it, ignoring it, asking again in other words: each is a choice, and its consequences fall to the user."}]},{"id":"b06","plate":2,"start":130.16,"dur":24.32,"lines":[{"t":130.48,"d":3.04,"text":"Now try to drop this premise as the first was dropped."},{"t":134,"d":4.4,"text":"There is one way: to say the denial was not chosen, that it was forced."},{"t":138.88,"d":3.44,"text":"But the denial is something the speaker is doing, and answers for."},{"t":142.32,"d":2.88,"text":"Any refutation is already another instance."},{"t":145.76,"d":3.28,"text":"Under one test, the two premises go opposite ways."},{"t":149.44,"d":2.32,"text":"The chooser drops out and nothing changes."},{"t":152.16,"d":2.16,"text":"This one comes back in the act of dropping it."}]},{"id":"b07","plate":3,"start":156.08,"dur":26.24,"lines":[{"t":156.48,"d":8.88,"text":"The step that usually follows grants all of this and adds: it does not settle whether such choices are determined, undetermined, or something else."},{"t":165.84,"d":1.52,"text":"Two readings are said to fit."},{"t":168,"d":3.2,"text":"In one, the choice is not fixed by what came before."},{"t":171.6,"d":5.6,"text":"In the other it is fixed by prior conditions and laws, and still counts as the agent's own."},{"t":178,"d":4.16,"text":"Since Hobbes and Hume that second reading has been called compatibilism."}]},{"id":"b08","plate":3,"start":183.02,"dur":18.88,"lines":[{"t":183.42,"d":1.76,"text":"Compatibilism has its use."},{"t":185.66,"d":12.4,"text":"People tell what is done from one's own reasons apart from what is done under threat, and on that they praise, hold liable, make contracts, and bring up children, without waiting for any account of the source."},{"t":198.62,"d":3.12,"text":"Courts and everyday dealings run on that distinction."}]},{"id":"b09","plate":3,"start":202.6,"dur":30.72,"lines":[{"t":203,"d":2.16,"text":"Its boundary lies in the word fixed."},{"t":205.64,"d":8.32,"text":"To ask whether a choice is fixed is to ask about it as a finished thing, set among its prior conditions, under a gaze that takes them all in at once."},{"t":214.52,"d":1.44,"text":"No one holds that gaze."},{"t":216.52,"d":2.8,"text":"The choice already arrived at is the open origin."},{"t":219.72,"d":6.08,"text":"Asking whether it is really fixed requires a fixedness to be there in advance, for it to have or to lack."},{"t":226.28,"d":3.04,"text":"It only stays unsettled if determinism is demanded."},{"t":229.8,"d":3.36,"text":"To assert that it is unsettled slips the hidden premise back in."}]},{"id":"b10","plate":3,"start":234.02,"dur":23.2,"lines":[{"t":234.42,"d":5.76,"text":"The neutral reply is that incompatibility is a further claim, one that has to be argued."},{"t":240.58,"d":5.76,"text":"But bringing in a further claim that can be argued is one more instance of choosing, not a refutation."},{"t":247.14,"d":4.64,"text":"The reply also says the two readings differ in which state of affairs obtains."},{"t":252.34,"d":4.64,"text":"That again supposes a state of affairs already finished, standing there to obtain."}]},{"id":"b11","plate":4,"start":258.82,"dur":35.04,"lines":[{"t":259.22,"d":6.16,"text":"The neutral stance treats determinism and indeterminism as rivals, exactly one of them true."},{"t":265.86,"d":3.76,"text":"But indeterminism is not the absence of deterministic claims."},{"t":270.02,"d":1.04,"text":"It is their source."},{"t":271.78,"d":7.28,"text":"Every deterministic claim is issued: someone picks a system, its variables and a starting point, and asserts a rule."},{"t":279.78,"d":6.08,"text":"Inside such an account there is one continuation, so it can only place its other side as a rival."},{"t":286.18,"d":2.32,"text":"It has no room for the act that issued it."},{"t":289.22,"d":4.56,"text":"The models keep their use: prediction, engineering and testing rely on them."}]},{"id":"b12","plate":4,"start":294.56,"dur":28.32,"lines":[{"t":294.96,"d":5.68,"text":"The word source invites a picture: a fixed point upstream, the first link of a chain."},{"t":301.12,"d":2,"text":"The source is not fixed in that sense."},{"t":303.6,"d":8.16,"text":"It is the differentiating, as ongoing action: the ability to make a distribution, one thing, another, or nothing at all."},{"t":312.72,"d":3.76,"text":"To treat it as a fixed source is again a deterministic premise."},{"t":317.04,"d":5.68,"text":"It asks that the ability to distribute was itself distributed already, by conditions before it."}]},{"id":"b13","plate":5,"start":324.48,"dur":26.24,"lines":[{"t":324.8,"d":3.36,"text":"Where does the finished thing come from, the one that could be fixed?"},{"t":328.48,"d":3.2,"text":"What stops is what the differentiating leaves behind."},{"t":332.16,"d":7.28,"text":"To look at a choice, it is set down as a result, and the result can be seen because the differentiating has already moved on."},{"t":340,"d":10.64,"text":"The observer gets lost in its own observation: it accounts for what was left as though that were the source, and misses that the stopping, the looking and the accounting are further instances."}]},{"id":"b14","plate":5,"start":351.42,"dur":22.4,"lines":[{"t":351.82,"d":4.56,"text":"Whatever can be put down here is what has been left behind, these lines among it."},{"t":357.1,"d":2.24,"text":"The observer is not among the things left."},{"t":359.74,"d":5.76,"text":"Another observer can only infer it from them, while its awareness of itself passes through no inference."},{"t":366.06,"d":3.12,"text":"The observed other and the inferred other are not the same."},{"t":369.66,"d":4,"text":"And the inference always arrives later than the differentiating it looks for."}]},{"id":"b15","plate":5,"start":374.52,"dur":31.52,"lines":[{"t":374.92,"d":1.36,"text":"Back to the opening question."},{"t":376.68,"d":5.28,"text":"The chosen cannot give a chooser's reasons, and when the tracing is done no chooser turns up."},{"t":382.6,"d":4.24,"text":"What turns up is each being that chooses for itself and bears the consequences."},{"t":387.48,"d":6.4,"text":"Determined or undetermined asks a finished thing for a property, and the asking is the differentiating under way."},{"t":394.44,"d":9.36,"text":"Deterministic description and compatibilist responsibility keep their use among what is left behind: records, regularities, coordination between people."},{"t":404.36,"d":1.52,"text":"The choosing is not on the record."}]}]},"zh":{"total":303.16,"beats":[{"id":"b01","plate":1,"start":0.8,"dur":17.76,"lines":[{"t":0.96,"d":2.64,"text":"演化为什么选中了人类，让人类做最聪明的物种？"},{"t":4,"d":3.52,"text":"这个问题预设了一位选择者，这一部分可以拿掉，什么都不会少。"},{"t":7.92,"d":3.92,"text":"第二个前提拿不掉：每一个有意识的生命为自己抉择，并承担后果。"},{"t":12.24,"d":6.08,"text":"而当有人回答说，这仍然没有确定抉择是被决定的还是未被决定的，这份悬而未决，已经是决定论的索求。"}]},{"id":"b02","plate":1,"start":19.26,"dur":11.68,"lines":[{"t":19.42,"d":0.72,"text":"先看这个问题。"},{"t":20.62,"d":1.92,"text":"它预设人类是被某人或某物选中的。"},{"t":23.02,"d":2.64,"text":"预设一旦被接受，能回答的就只有那位选择者。"},{"t":26.14,"d":4.64,"text":"被选中的答不了：要它作答，等于向它索要一份来自它从未占据的位置的报告。"}]},{"id":"b03","plate":1,"start":31.64,"dur":27.36,"lines":[{"t":31.8,"d":3.92,"text":"选择这个词，是达尔文从育种者那里借来的，育种者确实在选。"},{"t":36.2,"d":1.92,"text":"理论留下了这个词，拿掉了育种者。"},{"t":38.44,"d":3.04,"text":"个体有差别，留下的后代有多有少，世系随之偏移。"},{"t":41.88,"d":4.48,"text":"人们用它追溯亲缘，解释抗药性的蔓延，解释喙的形状，全程不需要任何预见。"},{"t":46.76,"d":5.28,"text":"麻烦出在这个词被读回成一位选择者的地方，出在最聪明被读成这位选择者所瞄准的名次的地方。"},{"t":52.44,"d":2.24,"text":"名次所依的那把尺，是发问的人自己立的。"},{"t":55.08,"d":1.68,"text":"拿掉选择者，描述照样成立。"},{"t":57.24,"d":1.44,"text":"这就是一个可以拿掉的前提的标志。"}]},{"id":"b04","plate":1,"start":59.7,"dur":12.64,"lines":[{"t":59.86,"d":0.8,"text":"剩下的是这个。"},{"t":60.98,"d":1.28,"text":"没有别人替谁作出抉择。"},{"t":62.66,"d":5.68,"text":"每一个有意识的生命为自己抉择，选这一样，选另一样，或者什么都不选，并承担由此而来的一切。"},{"t":68.74,"d":1.52,"text":"主体不是演化故事后来的产物。"},{"t":70.66,"d":1.36,"text":"讲这个故事的，就是主体。"}]},{"id":"b05","plate":2,"start":73.94,"dur":20.64,"lines":[{"t":74.1,"d":4.08,"text":"把这段话交给一个语言模型，模型把它当作一个有待掂量的主张来处理。"},{"t":78.58,"d":6,"text":"这样处理也是一次抉择，作出它的是造出模型的人，他们定下了目标、数据与检验。"},{"t":84.98,"d":0.88,"text":"模型没有作出它。"},{"t":86.18,"d":2.88,"text":"使用者接受这个输出，输出就成了使用者自己的抉择。"},{"t":89.46,"d":4.96,"text":"拒绝它，不理它，换一种问法再问，每一样都是抉择，后果由使用者承担。"}]},{"id":"b06","plate":2,"start":95.28,"dur":18.56,"lines":[{"t":95.44,"d":2.56,"text":"现在照拿掉前一个那样，试着把这个前提也拿掉。"},{"t":98.48,"d":3.12,"text":"办法只有一种：说这次否认不是选的，是被迫的。"},{"t":101.92,"d":2.64,"text":"可是否认是说话的人正在做的事，也是他要为之负责的事。"},{"t":104.96,"d":2,"text":"任何反驳，都已经是它的又一个实例。"},{"t":107.36,"d":2.24,"text":"同一种检验之下，两个前提走向相反。"},{"t":109.84,"d":1.44,"text":"选择者拿掉了，什么都没变。"},{"t":111.76,"d":1.84,"text":"这一个，在拿掉它的动作里自己回来。"}]},{"id":"b07","plate":3,"start":115.44,"dur":19.68,"lines":[{"t":115.6,"d":7.12,"text":"接下来常见的一步，是承认以上各点，再补上一句：这并没有确定这样的抉择是被决定的，未被决定的，还是别的什么。"},{"t":123.12,"d":1.36,"text":"据说有两种读法都合得上。"},{"t":124.96,"d":1.84,"text":"一种认为抉择不被先前的事情固定。"},{"t":127.2,"d":4.4,"text":"另一种认为抉择被先在的条件与规律固定，却仍然算作行动者自己的抉择。"},{"t":132,"d":2.8,"text":"从霍布斯与休谟以来，后一种读法叫作相容论。"}]},{"id":"b08","plate":3,"start":135.82,"dur":13.92,"lines":[{"t":135.98,"d":1.04,"text":"相容论有它的用处。"},{"t":137.42,"d":9.12,"text":"人们用它分开出于自己的理由而做的事与在胁迫之下做的事，据此称许，追责，订约，教养孩子，不必先等任何关于来源的说法尘埃落定。"},{"t":146.94,"d":2.64,"text":"法庭与日常的交往，每天都靠这条区分运转。"}]},{"id":"b09","plate":3,"start":150.44,"dur":26.56,"lines":[{"t":150.6,"d":1.28,"text":"它的边界在固定这个词上。"},{"t":152.28,"d":8.24,"text":"问一次抉择是否被固定，是把它当作一件已经完成的事来问，把它摆进它的先在条件之间，并且设想有一道目光能把这些条件一次看全。"},{"t":161,"d":0.96,"text":"没有人握有这道目光。"},{"t":162.36,"d":1.92,"text":"已经走到的那个抉择，是开放的起点。"},{"t":164.68,"d":5.12,"text":"再问它究竟有没有被固定，是要求事先有一份固定摆在那里，好让它拥有或者缺少。"},{"t":170.2,"d":3.12,"text":"只有在索求决定论的时候，这件事才显得尚无定论。"},{"t":173.72,"d":3.2,"text":"断言它尚无定论，那个隐藏的前提就又滑了回来。"}]},{"id":"b10","plate":3,"start":177.7,"dur":15.2,"lines":[{"t":177.86,"d":3.36,"text":"中立的回答是：不相容是一个另外的主张，还需要论证。"},{"t":181.62,"d":4,"text":"可是引入一个可以争辩的另外的主张，是抉择的又一个实例，不是反驳。"},{"t":186.02,"d":2.96,"text":"这个回答还说，两种读法差在哪一种事态成立。"},{"t":189.38,"d":3.36,"text":"这又一次假定有一份事态已经完成，摆在那里等着成立。"}]},{"id":"b11","plate":4,"start":194.5,"dur":24.16,"lines":[{"t":194.66,"d":3.92,"text":"中立的立场把决定论与不确定论当作对手，其中恰有一个为真。"},{"t":198.98,"d":2.24,"text":"可是不确定论并不是确定论断的缺席。"},{"t":201.62,"d":1.2,"text":"它是确定论断的来源。"},{"t":203.22,"d":5.04,"text":"每一个确定论断都是被作出的：有人选定系统，变量与起点，断言一条规则。"},{"t":208.66,"d":4.16,"text":"在这样一份叙述之内只有一个后继，它只能把自己的另一面安置成对手。"},{"t":213.22,"d":2.08,"text":"它容纳不了作出这份叙述的那个动作。"},{"t":215.7,"d":2.8,"text":"模型照旧有用：预测，工程与检验都靠它。"}]},{"id":"b12","plate":4,"start":219.36,"dur":19.68,"lines":[{"t":219.52,"d":4.56,"text":"来源这个词容易招来一幅图画：上游有一个固定的点，一条链上的第一环。"},{"t":224.48,"d":1.6,"text":"这个来源不是那种意义上的固定。"},{"t":226.48,"d":5.12,"text":"它是作为持续动作的区分：作出一个分布的能力，选这一样，选另一样，或者什么都不选。"},{"t":232.08,"d":2.64,"text":"把它当成一个固定的来源，又是一个决定论的前提。"},{"t":235.12,"d":3.76,"text":"这等于要求，作出分布的能力自身，已经被先于它的条件分布好了。"}]},{"id":"b13","plate":5,"start":240.64,"dur":18.56,"lines":[{"t":240.8,"d":2.72,"text":"那件已经完成，可以被固定的事，是从哪里来的？"},{"t":243.92,"d":2.08,"text":"停下来的东西，是区分留在身后的东西。"},{"t":246.4,"d":5.36,"text":"要查看一次抉择，就得把它当作一个结果放下来，结果之所以看得见，是因为区分已经往前去了。"},{"t":252.16,"d":6.88,"text":"观察者迷失在自己的观察里：把留下的东西当作来源来交代，看不见停下，查看与交代，都是区分的又一个实例。"}]},{"id":"b14","plate":5,"start":259.9,"dur":17.12,"lines":[{"t":260.06,"d":4,"text":"凡是能在这里写下来的，都是留在身后的东西，这几行字也在其中。"},{"t":264.46,"d":1.76,"text":"观察者不在这些留下的东西里面。"},{"t":266.62,"d":4.56,"text":"另一个观察者只能从留下的东西把它推断出来，而它对自己的觉察不经推断。"},{"t":271.58,"d":2.88,"text":"被观察到的他者与被推断出的他者，不是同一个。"},{"t":274.86,"d":1.92,"text":"推断总是到得比它要找的区分晚。"}]},{"id":"b15","plate":5,"start":277.72,"dur":23.04,"lines":[{"t":277.96,"d":0.88,"text":"回到开头的问题。"},{"t":279.32,"d":4.24,"text":"被选中的说不出选择者的理由，而往回追的时候，也没有一位选择者出现。"},{"t":283.96,"d":2.56,"text":"出现的是每一个为自己抉择并承担后果的生命。"},{"t":287,"d":6.08,"text":"被决定还是未被决定，是向一件已完成的事索要一个性质，而索要这个动作，就是正在进行的区分。"},{"t":293.48,"d":5.92,"text":"决定论的描述与相容论的归责，在留下来的东西里各有其用：记录，规律，人与人之间的协调。"},{"t":299.64,"d":0.8,"text":"抉择不在记录上。"}]}]}};
