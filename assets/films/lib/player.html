<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film</title>
<style>
  /* Film Sans: the labels' face. The Latin file is shared; each film brings the Chinese glyphs its own strings use. */
  @font-face { font-family: "Film Sans"; font-weight: 600; src: url("./fonts/film-sans.latin.woff2") format("woff2"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20CF, U+2190-21FF; }
  html, body { margin: 0; background: #0b0b0b; color: #f2f2f2; font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #theater { display: grid; background: #0b0b0b; }
  #frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #0b0b0b; cursor: pointer; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  #canvas, .overlay { position: absolute; left: 0; top: 0; }
  .overlay { width: 100%; height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }
  #gate { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11, 11, 11, 0.45); border: 0; color: inherit; font: inherit; cursor: pointer; }
  #gate span { width: 76px; height: 76px; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; font-size: 26px; padding-left: 6px; box-sizing: border-box; }
  #gate[hidden] { display: none; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid #2a2a2a; flex-wrap: wrap; }
  #bar button { font: inherit; color: #f2f2f2; background: transparent; border: 1px solid #3a3a3a; border-radius: 2px; padding: 5px 9px; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: #f2f2f2; color: #0b0b0b; border-color: #f2f2f2; }
  #time { color: #9a9a9a; min-width: 92px; font-variant-numeric: tabular-nums; }
  #seek { flex: 1 1 160px; min-width: 0; accent-color: #f2f2f2; }
  #theater:fullscreen { height: 100vh; grid-template-rows: 1fr auto; align-content: center; }
</style>
<script type="importmap">{ "imports": { "three": "./three-lite.mjs" } }</script>
</head>
<body>
<div id="theater">
  <div id="frame"><div id="stage"><canvas id="canvas"></canvas></div><button id="gate" type="button" aria-label="Play"><span>&#9654;</span></button></div>
  <div id="bar">
    <button id="play" type="button">Play</button><span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span id="langs"></span><button id="full" type="button">Full</button>
  </div>
</div>
<audio id="audio" preload="metadata"></audio>
<script type="module">
// The narration is the clock: every animation frame draws film.renderAt(audio.currentTime). A language is one
// film instance on its own overlay; switching keeps the place by beat and by the share of the beat already heard.
const q = new URLSearchParams(location.search), job = q.get('job'), embed = q.get('embed') === '1', KEY = 'nat-media-lang', NAMES = { zh: '中文', en: 'English' };
const $ = (id) => document.getElementById(id), audio = $('audio'), stageEl = $('stage'), frame = $('frame');
const read = async (url) => { const r = await fetch(url); return r.ok ? r.json() : null; };
const contract = await read('../contract.json'), { width, height } = contract.video.formats['16x9'];
stageEl.style.width = `${width}px`; stageEl.style.height = `${height}px`;
const fit = () => { stageEl.style.transform = `scale(${frame.clientWidth / width})`; };
new ResizeObserver(fit).observe(frame); fit();
const sc = new FontFace('Film Sans', `url("../jobs/${job}/film-sans.zh.woff2") format("woff2")`, { weight: '600', unicodeRange: 'U+2E80-9FFF, U+3000-303F, U+FF00-FFEF' });
document.fonts.add(sc);
// A film measures its labels when it starts, so both faces are in before it does; a face that fails leaves the fallback.
await Promise.allSettled([sc.load(), document.fonts.load('600 32px "Film Sans"')]);
const { default: film } = await import(`../jobs/${job}/film.mjs`);
const cuts = {};
for (const lang of ['zh', 'en']) { const timeline = await read(`../jobs/${job}/timeline.${lang}.json`); if (timeline) cuts[lang] = { timeline }; }
const langs = Object.keys(cuts);
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
let lang = langs.includes(q.get('lang')) ? q.get('lang') : langs.includes(saved) ? saved : (/^zh/i.test(navigator.language || '') && cuts.zh ? 'zh' : langs.includes('en') ? 'en' : langs[0]);
const open = async (l) => {
  const cut = cuts[l];
  if (!cut.renderAt) {
    cut.overlay = Object.assign(document.createElement('div'), { className: 'overlay' }); stageEl.append(cut.overlay);
    Object.assign(cut, await film({ canvas: $('canvas'), overlay: cut.overlay, width, height, fps: contract.video.fps, lang: l, aspect: '16x9', params: { lockcam: false, ambient: true, debug: false }, contract, timeline: cut.timeline }));
  }
  for (const k of langs) if (cuts[k].overlay) cuts[k].overlay.style.display = k === l ? '' : 'none';
  return cut;
};
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
// Until it is first played or sought, the stage shows a frame from a little way in, not the empty opening.
let started = false;
const draw = () => { const cut = cuts[lang], t = started ? Math.min(audio.currentTime, cut.seconds - 0.001) : Math.min(cut.seconds * 0.05, 20); cut.renderAt(t); $('seek').value = Math.round(1000 * t / cut.seconds); $('time').textContent = `${clock(started ? t : 0)} / ${clock(cut.seconds)}`; if (!started) $('seek').value = 0; };
const tick = () => { draw(); if (!audio.paused) requestAnimationFrame(tick); };
const state = () => { $('play').textContent = audio.paused ? 'Play' : 'Pause'; $('gate').hidden = !audio.paused; };
const toggle = () => { if (audio.paused) audio.play(); else audio.pause(); };
const place = (l, t) => { const b = cuts[l].timeline.beats, i = Math.max(0, b.findLastIndex((x) => t >= x.t0)); return [i, (t - b[i].t0) / (b[i].t1 - b[i].t0)]; };
const set = async (l, keep) => {
  const was = !audio.paused, [i, f] = keep ? place(lang, audio.currentTime) : [0, 0];
  audio.pause(); const cut = await open(l), b = cut.timeline.beats[Math.min(i, cut.timeline.beats.length - 1)]; lang = l;
  audio.src = `../jobs/${job}/audio.${l}.m4a`; if (keep && started) audio.currentTime = b.t0 + f * (b.t1 - b.t0);
  for (const el of $('langs').children) el.setAttribute('aria-pressed', el.dataset.lang === l ? 'true' : 'false');
  if (was) await audio.play(); draw(); state();
};
$('langs').innerHTML = langs.length > 1 && !embed ? langs.map((l) => `<button type="button" data-lang="${l}" aria-pressed="false">${NAMES[l]}</button>`).join(' ') : '';
for (const el of $('langs').children) el.addEventListener('click', () => set(el.dataset.lang, true));
audio.addEventListener('play', () => { started = true; state(); tick(); }); audio.addEventListener('seeking', () => { started = true; }); audio.addEventListener('pause', state); audio.addEventListener('seeked', draw);
$('play').addEventListener('click', toggle); $('gate').addEventListener('click', toggle); frame.addEventListener('click', (e) => { if (e.target !== $('gate') && !$('gate').contains(e.target)) toggle(); });
$('seek').addEventListener('input', () => { audio.currentTime = $('seek').value / 1000 * cuts[lang].seconds; draw(); });
$('full').addEventListener('click', () => (document.fullscreenElement ? document.exitFullscreen() : $('theater').requestFullscreen()));
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); toggle(); } else if (e.code === 'ArrowRight') audio.currentTime += 5; else if (e.code === 'ArrowLeft') audio.currentTime -= 5; });
// Inside a post the page's own switch sets the language, and the frame is as tall as the player needs.
addEventListener('message', (e) => { if (e.origin === location.origin && langs.includes(e.data?.natLang) && e.data.natLang !== lang) set(e.data.natLang, true); });
if (embed) document.documentElement.style.overflow = 'hidden';
const tell = () => { if (embed) parent.postMessage({ natHeight: $('theater').offsetHeight }, location.origin); };
new ResizeObserver(tell).observe($('theater')); addEventListener('resize', tell);
await set(lang, false); tell();
window.__live = { cuts, get lang() { return lang; } };
</script>
</body>
</html>
