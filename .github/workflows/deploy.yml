name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'assets/**'
      - 'build.mjs'
      - 'style.css'
      - 'package*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required so `git log -1 -- <file>` inside build.mjs works for every post file.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        run: node build.mjs

      - name: Upload artifact (attempt 1)
        id: upload_artifact_1
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Upload artifact (attempt 2 on transient failure)
        if: steps.upload_artifact_1.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (attempt 2 on transient syncing_files timeout)
        if: steps.deployment_1.outcome == 'failure'
        id: deployment_2
        uses: actions/deploy-pages@v4
